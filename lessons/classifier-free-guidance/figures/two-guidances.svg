<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>classifier guidance 는 U-Net 의 예측에 noise 그림을 위한 분류기의 gradient 를 더하고, classifier-free guidance 는 같은 U-Net 의 조건부 예측과 무조건 예측의 차이를 쓴다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#38bdf8" font-size="14" text-anchor="start">classifier guidance (ADM)</text>
  <rect x="24.0" y="50.0" width="140.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="94.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x_t</text>
  <text x="94.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">noise 그림</text>
  <line x1="166.0" y1="78.0" x2="206.0" y2="78.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210.0" y="46.0" width="150.0" height="30.0" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="285.0" y="66.0" fill="#e2e8f0" font-size="12" text-anchor="middle">diffusion U-Net</text>
  <rect x="210.0" y="82.0" width="150.0" height="30.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="285.0" y="102.0" fill="#e2e8f0" font-size="12" text-anchor="middle">분류기 p(y | x_t)</text>
  <line x1="362.0" y1="61.0" x2="452.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="362.0" y1="97.0" x2="452.0" y2="84.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="400.0" y="120.0" fill="#f59e0b" font-size="11" text-anchor="middle">∇ log p(y | x_t)</text>
  <rect x="456.0" y="54.0" width="240.0" height="48.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="576.0" y="82.0" fill="#e2e8f0" font-size="12" text-anchor="middle">예측 − 무게 × 분류기 gradient</text>
  <text x="24.0" y="160.0" fill="#34d399" font-size="14" text-anchor="start">classifier-free guidance</text>
  <rect x="24.0" y="176.0" width="140.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="94.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x_t</text>
  <text x="94.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">noise 그림</text>
  <line x1="166.0" y1="204.0" x2="206.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210.0" y="172.0" width="150.0" height="30.0" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="285.0" y="192.0" fill="#e2e8f0" font-size="12" text-anchor="middle">U-Net (글 c)</text>
  <rect x="210.0" y="208.0" width="150.0" height="30.0" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="285.0" y="228.0" fill="#e2e8f0" font-size="12" text-anchor="middle">같은 U-Net (빈 글 ∅)</text>
  <line x1="362.0" y1="187.0" x2="452.0" y2="198.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="362.0" y1="223.0" x2="452.0" y2="210.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="456.0" y="180.0" width="240.0" height="48.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="576.0" y="208.0" fill="#e2e8f0" font-size="12" text-anchor="middle">무조건 + s × (조건부 − 무조건)</text>
  <text x="360.0" y="266.0" fill="#94a3b8" font-size="12" text-anchor="middle">따로 학습하는 분류기가 없다</text>
</svg>
