<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>bucket 다섯 개를 같은 배율로 그린 모습. 1024 × 1024, 896 × 1152, 768 × 1344, 1152 × 896, 512 × 2048 은 모양이 달라도 넓이가 1024² 의 98.4 ~ 100% 로 거의 같다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">넓이가 거의 같은 bucket (높이 × 너비, 같은 배율)</text>
  <rect x="40" y="92.96" width="87.04" height="87.04" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="83.52000000000001" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">1024 × 1024</text>
  <text x="83.52000000000001" y="224" fill="#38bdf8" font-size="12" text-anchor="middle">100%</text>
  <rect x="151.04000000000002" y="103.83999999999999" width="97.92" height="76.16000000000001" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.8"/>
  <text x="200.00000000000003" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">896 × 1152</text>
  <text x="200.00000000000003" y="224" fill="#34d399" font-size="12" text-anchor="middle">98.4%</text>
  <rect x="272.96000000000004" y="114.72" width="114.24000000000001" height="65.28" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="330.08000000000004" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">768 × 1344</text>
  <text x="330.08000000000004" y="224" fill="#f59e0b" font-size="12" text-anchor="middle">98.4%</text>
  <rect x="411.20000000000005" y="82.08" width="76.16000000000001" height="97.92" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="449.28000000000003" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">1152 × 896</text>
  <text x="449.28000000000003" y="224" fill="#a78bfa" font-size="12" text-anchor="middle">98.4%</text>
  <rect x="511.36000000000007" y="136.48" width="174.08" height="43.52" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-width="1.8"/>
  <text x="598.4000000000001" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">512 × 2048</text>
  <text x="598.4000000000001" y="224" fill="#f87171" font-size="12" text-anchor="middle">100%</text>
  <text x="380" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">높이와 너비는 64 의 배수이고, pixel 수는 1024² = 1,048,576 에 가깝다. batch 하나는 한 bucket 의 그림으로만 채운다</text>
</svg>
