<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Stable Diffusion v1 과 SDXL 의 U-Net 단계. v1 은 64, 32, 16, 8 크기에 transformer 층이 1, 1, 1, 1 이고, SDXL 은 128, 64, 32 크기에 0, 2, 10 이다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">U-Net 의 단계: 크기, channel, transformer 층 수</text>
  <text x="200" y="66" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="600">Stable Diffusion v1 (512 × 512)</text>
  <rect x="50.0" y="84" width="300" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="200" y="103" fill="#e2e8f0" font-size="12" text-anchor="middle">64×64 · channel 320</text>
  <text x="200" y="120" fill="#38bdf8" font-size="12" text-anchor="middle">transformer 층 1</text>
  <rect x="70.0" y="140" width="260" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="200" y="159" fill="#e2e8f0" font-size="12" text-anchor="middle">32×32 · channel 640</text>
  <text x="200" y="176" fill="#38bdf8" font-size="12" text-anchor="middle">transformer 층 1</text>
  <rect x="90.0" y="196" width="220" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="200" y="215" fill="#e2e8f0" font-size="12" text-anchor="middle">16×16 · channel 1280</text>
  <text x="200" y="232" fill="#38bdf8" font-size="12" text-anchor="middle">transformer 층 1</text>
  <rect x="90.0" y="252" width="220" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="200" y="271" fill="#e2e8f0" font-size="12" text-anchor="middle">8×8 · channel 1280</text>
  <text x="200" y="288" fill="#38bdf8" font-size="12" text-anchor="middle">transformer 층 1 (가장 아래 block)</text>
  <text x="200" y="330" fill="#e2e8f0" font-size="13" text-anchor="middle">transformer 층 16 개</text>
  <text x="200" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">parameter 859,520,964</text>
  <text x="560" y="66" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="600">SDXL (1024 × 1024)</text>
  <rect x="410.0" y="84" width="300" height="44" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.6"/>
  <text x="560" y="103" fill="#e2e8f0" font-size="12" text-anchor="middle">128×128 · channel 320</text>
  <text x="560" y="120" fill="#94a3b8" font-size="12" text-anchor="middle">transformer 층 0</text>
  <rect x="430.0" y="140" width="260" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="560" y="159" fill="#e2e8f0" font-size="12" text-anchor="middle">64×64 · channel 640</text>
  <text x="560" y="176" fill="#f59e0b" font-size="12" text-anchor="middle">transformer 층 2</text>
  <rect x="450.0" y="196" width="220" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="560" y="215" fill="#e2e8f0" font-size="12" text-anchor="middle">32×32 · channel 1280</text>
  <text x="560" y="232" fill="#f59e0b" font-size="12" text-anchor="middle">transformer 층 10</text>
  <text x="560" y="330" fill="#e2e8f0" font-size="13" text-anchor="middle">transformer 층 70 개</text>
  <text x="560" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">parameter 2,567,463,684</text>
  <text x="380" y="372" fill="#94a3b8" font-size="11" text-anchor="middle">128×128 의 token 16,384 개에 attention 을 두면 점수가 2 억 6 천만 개라서, SDXL 은 낮은 해상도에 층을 몰아 둔다</text>
</svg>
