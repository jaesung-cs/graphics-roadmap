<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>높이 1000, 너비 1500 그림을 256 × 384 로 줄이고, 왼쪽에서 100 pixel 떨어진 자리부터 256 × 256 을 잘라 낸다. model 은 원래 크기 (1000, 1500) 와 잘라 낸 자리 (0, 100) 를 조건으로 받는다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">원래 크기와 잘라 낸 자리 (Algorithm 1)</text>
  <rect x="40" y="70" width="180.0" height="120.0" fill="#111a2e" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="130.0" y="134.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1000 × 1500</text>
  <text x="130.0" y="216" fill="#94a3b8" font-size="12" text-anchor="middle">원래 그림</text>
  <line x1="230" y1="130" x2="290" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <text x="260" y="120" fill="#94a3b8" font-size="11" text-anchor="middle">줄이기</text>
  <rect x="300" y="66" width="192.0" height="128.0" fill="#111a2e" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="350.0" y="66" width="128.0" height="128.0" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
  <line x1="300" y1="206" x2="350.0" y2="206" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#a-a)"/>
  <text x="325" y="222" fill="#f59e0b" font-size="11" text-anchor="middle">c_left = 100</text>
  <text x="396.0" y="252" fill="#e2e8f0" font-size="12" text-anchor="middle">256 × 384 에서 256 × 256 을 잘라 냄</text>
  <rect x="540" y="70" width="190" height="120" rx="8" fill="#10291f" stroke="#34d399" stroke-width="1.6"/>
  <text x="635" y="98" fill="#34d399" font-size="13" text-anchor="middle">model 이 받는 조건</text>
  <text x="635" y="126" fill="#e2e8f0" font-size="12" text-anchor="middle">c_size = (1000, 1500)</text>
  <text x="635" y="150" fill="#e2e8f0" font-size="12" text-anchor="middle">c_crop = (0, 100)</text>
  <text x="635" y="174" fill="#94a3b8" font-size="11" text-anchor="middle">+ 잘라 낸 256 × 256 그림</text>
  <text x="380" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">높이가 너비보다 작아 c_top = 0 이고, c_left 는 0 ~ 128 에서 무작위로 뽑는다. 생성할 때는 c_crop = (0, 0) 을 준다</text>
</svg>
