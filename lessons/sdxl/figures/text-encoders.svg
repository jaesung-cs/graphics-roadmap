<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 text encoder. 같은 글의 token 77 개가 CLIP ViT-L 과 OpenCLIP ViT-bigG 를 지나고, 끝에서 둘째 층의 77 × 768 과 77 × 1280 을 이어 붙인 77 × 2048 이 cross-attention 으로 간다. ViT-bigG 의 pooled vector 1280 개는 time embedding 쪽으로 간다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">두 text encoder 의 출력</text>
  <rect x="30" y="130" width="110" height="60" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="85" y="156" fill="#e2e8f0" font-size="12" text-anchor="middle">글의 token</text>
  <text x="85" y="174" fill="#94a3b8" font-size="12" text-anchor="middle">77 개</text>
  <rect x="190" y="70" width="170" height="60" rx="8" fill="#13233d" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="275" y="96" fill="#38bdf8" font-size="13" text-anchor="middle">CLIP ViT-L</text>
  <text x="275" y="114" fill="#94a3b8" font-size="11" text-anchor="middle">12 층</text>
  <rect x="190" y="190" width="170" height="60" rx="8" fill="#1f1a33" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="275" y="216" fill="#a78bfa" font-size="13" text-anchor="middle">OpenCLIP ViT-bigG</text>
  <text x="275" y="234" fill="#94a3b8" font-size="11" text-anchor="middle">32 층</text>
  <line x1="140" y1="150" x2="188" y2="105" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <line x1="140" y1="170" x2="188" y2="215" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <line x1="360" y1="100" x2="418" y2="140" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <text x="395" y="104" fill="#38bdf8" font-size="11" text-anchor="middle">77 × 768</text>
  <line x1="360" y1="210" x2="418" y2="172" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-p)"/>
  <text x="395" y="224" fill="#a78bfa" font-size="11" text-anchor="middle">77 × 1280</text>
  <text x="395" y="250" fill="#94a3b8" font-size="11" text-anchor="middle">끝에서 둘째 층</text>
  <rect x="420" y="130" width="140" height="54" rx="8" fill="#1f1a10" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="490" y="154" fill="#f59e0b" font-size="12" text-anchor="middle">이어 붙이기</text>
  <text x="490" y="172" fill="#e2e8f0" font-size="13" text-anchor="middle">77 × 2048</text>
  <line x1="560" y1="157" x2="598" y2="157" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="600" y="130" width="140" height="54" rx="8" fill="#1f1a10" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="670" y="154" fill="#f59e0b" font-size="12" text-anchor="middle">cross-attention</text>
  <text x="670" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">key·value 로</text>
  <path d="M275,250 L275,290 L598,290" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#a-g)"/>
  <text x="430" y="284" fill="#34d399" font-size="12" text-anchor="middle">pooled vector 1280 개</text>
  <rect x="600" y="266" width="140" height="48" rx="8" fill="#10291f" stroke="#34d399" stroke-width="1.6"/>
  <text x="670" y="295" fill="#34d399" font-size="12" text-anchor="middle">time embedding 쪽</text>
</svg>
