  <text x="418.0" y="132.0" fill="#f59e0b" font-size="9" text-anchor="middle">+ LoRA</text>
  <rect x="448.0" y="92.0" width="48.0" height="50.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
