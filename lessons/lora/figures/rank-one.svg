<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세로 vector b (1, 2, 0, −1) 와 가로 vector a (0.5, 0, 1) 을 곱해 4×3 행렬을 만든다. 행렬의 숫자 12 개를 숫자 7 개로 만들었고, 모든 행이 a 의 배수라서 rank 가 1 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="40.0" y="50.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1"/>
  <text x="62.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1</text>
  <rect x="40.0" y="80.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1"/>
  <text x="62.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="middle">2</text>
  <rect x="40.0" y="110.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1"/>
  <text x="62.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="40.0" y="140.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1"/>
  <text x="62.0" y="160.0" fill="#e2e8f0" font-size="12" text-anchor="middle">−1</text>
  <text x="62.0" y="40.0" fill="#34d399" font-size="13" text-anchor="middle">b</text>
  <text x="110.0" y="115.0" fill="#e2e8f0" font-size="18" text-anchor="middle">×</text>
  <rect x="135.0" y="95.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="157.0" y="115.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.5</text>
  <rect x="179.0" y="95.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="201.0" y="115.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="223.0" y="95.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="245.0" y="115.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1</text>
  <text x="201.0" y="85.0" fill="#f59e0b" font-size="13" text-anchor="middle">a</text>
  <text x="290.0" y="115.0" fill="#e2e8f0" font-size="18" text-anchor="middle">=</text>
  <rect x="320.0" y="50.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="342.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.5</text>
  <rect x="364.0" y="50.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="386.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="408.0" y="50.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="430.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1</text>
  <rect x="320.0" y="80.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="342.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1</text>
  <rect x="364.0" y="80.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="386.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="408.0" y="80.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="430.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="middle">2</text>
  <rect x="320.0" y="110.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="342.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="364.0" y="110.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="386.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="408.0" y="110.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="430.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="320.0" y="140.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="342.0" y="160.0" fill="#e2e8f0" font-size="12" text-anchor="middle">−0.5</text>
  <rect x="364.0" y="140.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="386.0" y="160.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <rect x="408.0" y="140.0" width="44.0" height="30.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="430.0" y="160.0" fill="#e2e8f0" font-size="12" text-anchor="middle">−1</text>
  <text x="386.0" y="40.0" fill="#38bdf8" font-size="13" text-anchor="middle">b a (4 × 3)</text>
  <text x="462.0" y="70.0" fill="#94a3b8" font-size="11" text-anchor="start">= a × 1</text>
  <text x="462.0" y="100.0" fill="#94a3b8" font-size="11" text-anchor="start">= a × 2</text>
  <text x="462.0" y="130.0" fill="#94a3b8" font-size="11" text-anchor="start">= a × 0</text>
  <text x="462.0" y="160.0" fill="#94a3b8" font-size="11" text-anchor="start">= a × −1</text>
  <text x="560.0" y="90.0" fill="#38bdf8" font-size="14" text-anchor="start">숫자 12 개</text>
  <text x="560.0" y="116.0" fill="#e2e8f0" font-size="13" text-anchor="start">← 숫자 4 + 3 = 7 개로</text>
  <text x="560.0" y="142.0" fill="#f59e0b" font-size="14" text-anchor="start">rank 1</text>
  <text x="360.0" y="228.0" fill="#94a3b8" font-size="12" text-anchor="middle">d × r 행렬 B 와 r × k 행렬 A 의 곱은 숫자 r(d + k) 개로 d × k 행렬을 만든다</text>
</svg>
