<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>RoPE 는 query 와 key 의 숫자 두 개씩을 위치 × 30° 만큼 돌린다. 위치 2 의 query 와 위치 3 의 key 는 60° 와 90° 로 돌아 사이각 30° 이고 내적이 0.866 이다. 위치 7 과 8 이어도 210° 와 240° 로 사이각이 30° 라 내적이 같다. 내적은 두 위치의 차이에만 달려 있다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="878" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="440.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">RoPE: 위치만큼 돌리면 내적은 위치의 차이에만 달린다</text>
  <circle cx="230.0" cy="170.0" r="80" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="140.0" y1="170.0" x2="320.0" y2="170.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="230.0" y1="80.0" x2="230.0" y2="260.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="230.0" y1="170.0" x2="270.0" y2="100.7" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="284.0" y="94.7" fill="#38bdf8" font-size="12" text-anchor="start">query 60°</text>
  <line x1="230.0" y1="170.0" x2="230.0" y2="90.0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="244.0" y="84.0" fill="#f59e0b" font-size="12" text-anchor="start">key 90°</text>
  <text x="230.0" y="286.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">query 위치 2, key 위치 3</text>
  <text x="230.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="middle">돌린 각 60°, 90° → 사이각 30°, 내적 0.866</text>
  <circle cx="650.0" cy="170.0" r="80" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="560.0" y1="170.0" x2="740.0" y2="170.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="650.0" y1="80.0" x2="650.0" y2="260.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="650.0" y1="170.0" x2="580.7" y2="210.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="566.7" y="204.0" fill="#38bdf8" font-size="12" text-anchor="end">query 210°</text>
  <line x1="650.0" y1="170.0" x2="610.0" y2="239.3" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="596.0" y="233.3" fill="#f59e0b" font-size="12" text-anchor="end">key 240°</text>
  <text x="650.0" y="286.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">query 위치 7, key 위치 8</text>
  <text x="650.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="middle">돌린 각 210°, 240° → 사이각 30°, 내적 0.866</text>
  <text x="440.0" y="362.0" fill="#94a3b8" font-size="12" text-anchor="middle">돌리기 전 query 와 key 는 둘 다 (1, 0). 한 위치마다 30° 씩 돌린다</text>
</svg>
