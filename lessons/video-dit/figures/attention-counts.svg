<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CogVideoX-5b 의 기본 49 프레임 480×720 에서 head 하나, layer 하나의 attention 점수. 3D full attention 은 17,776² = 315,986,176 개이고, 프레임 안 2D attention 23,692,500 개와 자리별 1D attention 228,150 개를 더한 23,920,650 개의 약 13 배다. 시간 방향으로 줄이지 않았다면 video token 이 66,150 개라 full attention 점수가 약 14 배 더 커진다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="878" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="440.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">attention 점수: 3D full attention 과 2D + 1D (head 하나, layer 하나)</text>
  <text x="40.0" y="104.0" fill="#38bdf8" font-size="13" text-anchor="start" font-weight="bold">3D full attention</text>
  <rect x="200.0" y="80.0" width="560.0" height="36.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.6"/>
  <text x="210.0" y="138.0" fill="#e2e8f0" font-size="12" text-anchor="start">(17,550 + 226)² = 315,986,176</text>
  <text x="40.0" y="184.0" fill="#f59e0b" font-size="13" text-anchor="start" font-weight="bold">2D + 1D attention</text>
  <rect x="200.0" y="160.0" width="42.4" height="36.0" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.6"/>
  <text x="252.4" y="184.0" fill="#e2e8f0" font-size="12" text-anchor="start">13 × 1,350² + 1,350 × 13² = 23,920,650</text>
  <text x="200.0" y="238.0" fill="#94a3b8" font-size="12" text-anchor="start">token: latent 13 × 60 × 90 를 2 × 2 patch 로 → 13 × 30 × 45 = 17,550 개, 글 226 개</text>
  <rect x="40.0" y="262.0" width="800.0" height="74.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="440.0" y="290.0" fill="#e2e8f0" font-size="13" text-anchor="middle">시간 방향으로 줄이지 않고 49 프레임을 그대로 두면 video token 은 49 × 1,350 = 66,150 개</text>
  <text x="440.0" y="316.0" fill="#94a3b8" font-size="12" text-anchor="middle">full attention 점수는 token 수의 제곱이라 (66,150 ÷ 17,550)² ≈ 14.2 배가 된다</text>
</svg>
