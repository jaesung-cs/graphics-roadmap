<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>글을 넣는 세 방법. CogVideoX 는 글 token 226 개를 video token 뒤에 이어 붙여 같은 weight 의 attention 을 쓰고, LayerNorm 뒤의 scale·shift·gate 만 글과 video 가 따로 쓴다. HunyuanVideo 는 처음 20 개 block 에서 글과 video 를 각자의 weight 로 계산하고 attention 만 함께 한 뒤 나머지 40 개 block 에서 한 줄로 합친다. Wan 은 video token 만 self-attention 하고 umT5 의 글 token 512 개는 cross-attention 으로 읽는다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="898" height="418" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="450.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">글을 Transformer 에 넣는 세 방법</text>
  <rect x="30.0" y="60.0" width="260.0" height="300.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="160.0" y="88.0" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="bold">CogVideoX</text>
  <rect x="52.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="71.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="90.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="109.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="128.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="147.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="166.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="185.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="212.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#a78bfa" stroke-width="1"/>
  <rect x="231.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#a78bfa" stroke-width="1"/>
  <rect x="250.0" y="110.0" width="15.0" height="18.0" rx="0" fill="#111a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="160.0" y="150.0" fill="#94a3b8" font-size="11" text-anchor="middle">video token | 글 token → self-attention</text>
  <text x="160.0" y="200.0" fill="#e2e8f0" font-size="12" text-anchor="middle">글 token 226 개를 video 뒤에 이어 붙임</text>
  <text x="160.0" y="230.0" fill="#e2e8f0" font-size="12" text-anchor="middle">attention·MLP weight 는 함께 씀</text>
  <text x="160.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">scale·shift·gate 만 따로 (expert AdaLN)</text>
  <text x="160.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">42 block, 3072 차원 (5B)</text>
  <rect x="320.0" y="60.0" width="260.0" height="300.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="450.0" y="88.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="bold">HunyuanVideo</text>
  <rect x="350.0" y="108.0" width="90.0" height="22.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1"/>
  <rect x="460.0" y="108.0" width="90.0" height="22.0" rx="0" fill="#111a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="395.0" y="123.0" fill="#34d399" font-size="11" text-anchor="middle">video</text>
  <text x="505.0" y="123.0" fill="#a78bfa" font-size="11" text-anchor="middle">글</text>
  <text x="450.0" y="150.0" fill="#94a3b8" font-size="11" text-anchor="middle">20 block 뒤 → 한 줄로 40 block</text>
  <text x="450.0" y="200.0" fill="#e2e8f0" font-size="12" text-anchor="middle">block 20 개: 글과 video 가 각자 weight</text>
  <text x="450.0" y="230.0" fill="#e2e8f0" font-size="12" text-anchor="middle">(attention 만 함께, MMDiT 와 같은 방식)</text>
  <text x="450.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">block 40 개: 한 줄로 합쳐 같은 weight</text>
  <text x="450.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">3072 차원, 13B</text>
  <rect x="610.0" y="60.0" width="260.0" height="300.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="740.0" y="88.0" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="bold">Wan 2.1</text>
  <rect x="650.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="672.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="694.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="716.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="738.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="760.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="782.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="804.0" y="108.0" width="18.0" height="18.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="740.0" y="150.0" fill="#94a3b8" font-size="11" text-anchor="middle">글은 key·value 로만 읽는다</text>
  <text x="740.0" y="200.0" fill="#e2e8f0" font-size="12" text-anchor="middle">video token 만 self-attention</text>
  <text x="740.0" y="230.0" fill="#e2e8f0" font-size="12" text-anchor="middle">글 token 512 개는 cross-attention</text>
  <text x="740.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">시각의 scale·shift·gate MLP 를</text>
  <text x="740.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">모든 block 이 함께 씀 (1.3B, 14B)</text>
  <text x="450.0" y="395.0" fill="#94a3b8" font-size="12" text-anchor="middle">세 model 모두 video token 사이에는 공간과 시간을 가리지 않는 full attention 을 쓴다</text>
</svg>
