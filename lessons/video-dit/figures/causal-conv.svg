<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>시간 방향 kernel 3 의 convolution. 보통의 convolution 은 프레임 t 를 만들 때 t−1, t, t+1 을 읽어 미래를 본다. causal convolution 은 앞에만 0 두 개를 채워 t−2, t−1, t 만 읽으므로, 프레임 1 은 자기 자신만 보고 뒤 프레임이 앞 프레임의 결과를 바꾸지 못한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="858" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="430.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">시간 방향 causal convolution (kernel 3)</text>
  <text x="40.0" y="86.0" fill="#f87171" font-size="13" text-anchor="start" font-weight="bold">보통의 convolution</text>
  <rect x="230.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="253.0" y="85.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="284.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="307.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f1</text>
  <rect x="338.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#1e3a5f" stroke="#f87171" stroke-width="1.2"/>
  <text x="361.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f2</text>
  <rect x="392.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#1e3a5f" stroke="#f87171" stroke-width="1.2"/>
  <text x="415.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f3</text>
  <rect x="446.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#1e3a5f" stroke="#f87171" stroke-width="1.2"/>
  <text x="469.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f4</text>
  <rect x="500.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="523.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f5</text>
  <rect x="554.0" y="60.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="577.0" y="85.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <line x1="361.0" y1="102.0" x2="415.0" y2="134.0" stroke="#f87171" stroke-width="1.2"/>
  <line x1="415.0" y1="102.0" x2="415.0" y2="134.0" stroke="#f87171" stroke-width="1.2"/>
  <line x1="469.0" y1="102.0" x2="415.0" y2="134.0" stroke="#f87171" stroke-width="1.2"/>
  <rect x="392.0" y="136.0" width="46.0" height="32.0" rx="0" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="415.0" y="157.0" fill="#f87171" font-size="12" text-anchor="middle">출력 3</text>
  <text x="716.0" y="157.0" fill="#94a3b8" font-size="12" text-anchor="end">f2, f3, f4 를 읽어 미래 f4 를 본다</text>
  <text x="40.0" y="226.0" fill="#34d399" font-size="13" text-anchor="start" font-weight="bold">causal convolution</text>
  <rect x="230.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="253.0" y="225.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="284.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="307.0" y="225.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="338.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#1e3a5f" stroke="#34d399" stroke-width="1.2"/>
  <text x="361.0" y="225.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f1</text>
  <rect x="392.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#1e3a5f" stroke="#34d399" stroke-width="1.2"/>
  <text x="415.0" y="225.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f2</text>
  <rect x="446.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#1e3a5f" stroke="#34d399" stroke-width="1.2"/>
  <text x="469.0" y="225.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f3</text>
  <rect x="500.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="523.0" y="225.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f4</text>
  <rect x="554.0" y="200.0" width="46.0" height="40.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="577.0" y="225.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f5</text>
  <line x1="361.0" y1="242.0" x2="469.0" y2="274.0" stroke="#34d399" stroke-width="1.2"/>
  <line x1="415.0" y1="242.0" x2="469.0" y2="274.0" stroke="#34d399" stroke-width="1.2"/>
  <line x1="469.0" y1="242.0" x2="469.0" y2="274.0" stroke="#34d399" stroke-width="1.2"/>
  <rect x="446.0" y="276.0" width="46.0" height="32.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="469.0" y="297.0" fill="#34d399" font-size="12" text-anchor="middle">출력 3</text>
  <text x="716.0" y="297.0" fill="#94a3b8" font-size="12" text-anchor="end">f1, f2, f3 만 읽는다</text>
  <text x="430.0" y="345.0" fill="#94a3b8" font-size="12" text-anchor="middle">0 두 개를 앞에만 채우면 출력 1 은 0, 0, f1 을 읽어 첫 프레임만으로 정해진다</text>
</svg>
