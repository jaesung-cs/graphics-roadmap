<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>고양이 분류기의 Bayes rule 을 사진 1000 장으로 센 그림. 1000 장 중 고양이 사진은 100 장, 다른 사진은 900 장이다. 고양이 사진 100 장 중 90 장이 고양이로 판정되고, 다른 사진 900 장 중 45 장이 오경보로 판정된다. 고양이로 판정된 135 장 중 실제 고양이 사진은 90 장이라 확률은 0.67 이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="135.0" width="120.0" height="56.0" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80.0" y="157.0" fill="#94a3b8" font-size="13" text-anchor="middle" font-weight="600">사진</text>
  <text x="80.0" y="176.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1000 장</text>
  <rect x="200.0" y="60.0" width="130.0" height="56.0" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="265.0" y="82.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="600">고양이</text>
  <text x="265.0" y="101.0" fill="#e2e8f0" font-size="12" text-anchor="middle">100 장 (10%)</text>
  <rect x="200.0" y="210.0" width="130.0" height="56.0" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="265.0" y="232.0" fill="#94a3b8" font-size="13" text-anchor="middle" font-weight="600">다른 사진</text>
  <text x="265.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="middle">900 장 (90%)</text>
  <line x1="142.0" y1="155.0" x2="197.0" y2="95.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)"/>
  <line x1="142.0" y1="172.0" x2="197.0" y2="235.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)"/>
  <rect x="400.0" y="20.0" width="130.0" height="56.0" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="465.0" y="42.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="600">고양이 판정</text>
  <text x="465.0" y="61.0" fill="#e2e8f0" font-size="12" text-anchor="middle">90 장 (90%)</text>
  <rect x="400.0" y="95.0" width="130.0" height="50.0" rx="6" fill="#111a2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="465.0" y="117.0" fill="#64748b" font-size="13" text-anchor="middle" font-weight="600">놓침</text>
  <text x="465.0" y="136.0" fill="#e2e8f0" font-size="12" text-anchor="middle">10 장</text>
  <rect x="400.0" y="170.0" width="130.0" height="56.0" rx="6" fill="#111a2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="465.0" y="192.0" fill="#f472b6" font-size="13" text-anchor="middle" font-weight="600">오경보</text>
  <text x="465.0" y="211.0" fill="#e2e8f0" font-size="12" text-anchor="middle">45 장 (5%)</text>
  <rect x="400.0" y="250.0" width="130.0" height="50.0" rx="6" fill="#111a2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="465.0" y="272.0" fill="#64748b" font-size="13" text-anchor="middle" font-weight="600">판정 없음</text>
  <text x="465.0" y="291.0" fill="#e2e8f0" font-size="12" text-anchor="middle">855 장</text>
  <line x1="332.0" y1="80.0" x2="397.0" y2="50.0" stroke="#34d399" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="332.0" y1="95.0" x2="397.0" y2="118.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#am)"/>
  <line x1="332.0" y1="230.0" x2="397.0" y2="200.0" stroke="#f472b6" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="332.0" y1="245.0" x2="397.0" y2="272.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#am)"/>
  <rect x="560.0" y="95.0" width="105.0" height="120.0" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="612.0" y="120.0" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="600">고양이 판정</text>
  <text x="612.0" y="142.0" fill="#e2e8f0" font-size="12" text-anchor="middle">90 + 45 = 135</text>
  <text x="612.0" y="166.0" fill="#38bdf8" font-size="12" text-anchor="middle">그중 고양이</text>
  <text x="612.0" y="188.0" fill="#e2e8f0" font-size="12" text-anchor="middle">90 ÷ 135</text>
  <text x="612.0" y="206.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">= 0.67</text>
  <line x1="532.0" y1="50.0" x2="575.0" y2="92.0" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="532.0" y1="198.0" x2="575.0" y2="214.0" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">분류기가 "고양이" 라고 해도 실제로 고양이인 사진은 3 장 중 2 장이다</text>
</svg>
