# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: mean-std
  title: 평균·분산·표준편차
  variants:
    - question: |
        pixel 값의 흔들림을 표준편차로 나타낼 때, 편차를 그냥 평균하지 않고 제곱해서 평균한 뒤 제곱근을 씌우는 이유는 무엇인가?
      choices:
        - '편차의 평균은 늘 0 이라 제곱으로 부호를 없애고, 제곱근으로 단위를 되돌리려고'
        - '제곱하면 절댓값보다 계산이 빨라지고, 제곱근은 커진 값을 줄여 측정값과 비교하기 쉽게 하려고'
        - '제곱근을 씌우면 값이 언제나 1 보다 작아져서, 표준편차를 확률처럼 읽을 수 있게 하려고'
        - '제곱하면 큰 편차의 비중이 줄어서, 가끔 튀는 값에 끌려가지 않는 흔들림 값을 얻으려고'
      answer: 0
      explanation: |
        편차(측정값 − 평균)는 평균을 기준으로 +와 −가 섞여 있어서 그대로 평균하면 언제나 0 이다. 그래서 제곱해 부호를 없앤 뒤 평균한 것이
        분산이고, 분산은 단위가 단계² 처럼 제곱이라 제곱근을 씌워 원래 단위로 되돌린 것이 표준편차다. 제곱은 오히려 큰 편차를 더 크게 반영하며,
        표준편차는 1 보다 작아야 하는 값이 아니고 계산 속도와도 관계없다.
    - question: |
        같은 pixel 을 네 번 찍었더니 평균에서 떨어진 정도가 +2, −2, +2, −2 단계였다. 분산(편차² 의 평균)과 표준편차는?
      choices:
        - '분산 0, 표준편차 0'
        - '분산 2, 표준편차 1.41'
        - '분산 4, 표준편차 2'
        - '분산 16, 표준편차 4'
      answer: 2
      explanation: |
        편차를 제곱하면 모두 4 라서 평균은 $(4 + 4 + 4 + 4) \div 4 = 4$ 이고, 표준편차는 $\sqrt 4 = 2$ 단계다. 0 은 편차를 제곱하지 않고
        평균했을 때의 값이고, 16 은 제곱을 평균하지 않고 하나를 다시 제곱한 값이며, 2 는 편차의 절댓값 평균을 분산으로 착각한 값이다.
    - question: |
        같은 회색 판을 찍은 두 카메라의 평균 밝기가 같은데, 하나는 표준편차가 1 단계이고 다른 하나는 5 단계다. 무엇이 다른가?
      choices:
        - '5 단계 카메라는 실제보다 평균 5 단계 밝게 찍으므로, 읽은 값마다 5 를 빼 주어야 맞는다'
        - '5 단계 카메라의 값이 평균 주변에 더 넓게 흩어진다. 평균이 실제 밝기와 맞는지는 표준편차로 알 수 없다'
        - '1 단계 카메라는 흩어짐이 작으니 bias 도 없어서, 그 평균은 실제 밝기와 맞는다'
        - '여러 장을 평균하면 흩어짐이 사라지므로, 충분히 평균한 뒤에는 두 카메라의 정확도가 같다'
      answer: 1
      explanation: |
        표준편차는 값이 평균 주변에 얼마나 흩어지는지를 나타낸다. 평균이 실제 값에서 어긋난 정도(bias)는 표준편차와 별개라서 표준편차가 작아도
        bias 가 있을 수 있다. 표준편차는 치우친 정도가 아니며, 같은 장수를 평균해도 표준편차가 큰 카메라는 평균값도 더 흔들린다.

- topic: gaussian-rule
  title: Gaussian 과 68-95-99.7 규칙
  variants:
    - question: |
        pixel noise 가 평균 0, 표준편차 σ 인 Gaussian 이라면, 한 번 찍은 값이 평균에서 ±3σ 밖으로 나갈 확률은 대략 얼마인가?
      choices:
        - '약 32%'
        - '약 5%'
        - '0%. ±3σ 밖의 값은 나오지 않는다'
        - '약 0.3%'
      answer: 3
      explanation: |
        Gaussian 은 ±1σ 안에 68.3%, ±2σ 안에 95.4%, ±3σ 안에 99.7% 가 들어가므로 ±3σ 밖은 약 0.27% 다. 32% 는 ±1σ 밖, 5% 는 ±2σ 밖의 확률이다.
        0.27% 는 작지만 0 이 아니라서, pixel 이 200 만 개 넘는 사진에서는 ±3σ 밖의 pixel 이 한 장에 수천 개 나온다.
    - question: |
        평균 200, 표준편차 2 단계인 pixel 이 있다. noise 의 99.7% 를 "바뀌지 않음" 으로 판단하려면 "바뀌었다" 고 판단할 기준을 어디에 두어야 하는가?
      choices:
        - '198 ~ 202 밖. noise 가 σ 를 넘는 일은 드물어서 σ 하나면 충분하다'
        - '194 ~ 206 밖. 평균에서 3σ = 6 단계까지는 noise 로 본다'
        - '200 이 아니면 모두. 평균과 다른 값은 모두 실제 변화다'
        - '196 ~ 204 밖. 평균에서 2σ 까지만 noise 로 보면 99.7% 를 덮는다'
      answer: 1
      explanation: |
        Gaussian noise 의 99.7% 는 ±3σ 안이라서 $2 \times 3 = 6$ 단계이고, 194 ~ 206 을 noise 로 본다. σ 하나만 잡으면 세 번에 한 번은 noise 를
        변화로 잘못 판단하고, 2σ 는 95.4% 만 덮어 22 번에 한 번꼴로 잘못 판단한다. 평균과 다르기만 하면 변화로 보면 거의 모든 사진에서 오판이 나온다.
    - question: |
        Gaussian 분포를 N(μ, σ²) 로 적을 때, 이 분포를 완전히 정하는 데 필요한 것은 무엇인가?
      choices:
        - '평균 μ 와 표준편차 σ. 하나는 가운데를 정하고 하나는 폭을 정한다'
        - '가장 큰 값과 가장 작은 값. 종 모양은 그 두 값 사이에 걸쳐 놓인다'
        - '측정한 값 전부. 숫자 몇 개로는 종의 모양을 빠짐없이 정할 수 없다'
        - '평균 하나. 종의 폭은 어느 Gaussian 이나 같다'
      answer: 0
      explanation: |
        Gaussian 은 평균은 종의 가운데 위치를 정하고 표준편차는 폭을 정해서 두 숫자로 모양 전체가 정해진다. Gaussian 은 양쪽으로 끝없이 이어지므로
        최댓값·최솟값이 없고, 측정값 전부가 필요하지도 않다. 평균만으로는 폭을 알 수 없다.

- topic: averaging-bias
  title: 평균 내기와 bias
  variants:
    - question: |
        표준편차 2 단계인 pixel 을 독립으로 4 장 찍어 평균하면, 평균값의 표준편차는 얼마가 되는가?
      choices:
        - '0.5 단계. 장수만큼 나눠진다'
        - '2 단계. 평균해도 흔들림은 같다'
        - '1 단계. √4 = 2 로 나눠진다'
        - '8 단계. 네 장의 오차가 더해진다'
      answer: 2
      explanation: |
        독립인 측정 N 개의 평균은 표준편차가 σ ÷ √N 이라 2 ÷ √4 = 1 단계다. +와 −의 오차가 서로 일부만 상쇄되기 때문에 N 이 아니라 √N 으로
        나뉜다. 0.5 는 N 으로 나눈 값이고, 합의 오차를 생각해도 표준편차는 2 × √4 = 4 이지 8 이 아니다.
    - question: |
        밝기를 아는 기준 판을 1000 장 찍어 평균했는데도 실제 밝기와 3 단계 차이가 난다. 가장 그럴듯한 원인과 해결책은?
      choices:
        - '평균해도 줄지 않는 bias 다. 기준 판으로 재서 빼는 calibration 이 필요하다'
        - 'noise 가 아직 덜 상쇄된 것이라서, 10000 장을 평균하면 차이가 0 에 가까워진다'
        - 'noise 가 Gaussian 이 아니라서 평균이 한쪽으로 끌려간 것이므로, 평균 대신 중앙값을 써야 한다'
        - '연달아 찍는 간격이 너무 짧아 앞 사진의 빛이 섞인 것이므로, 간격을 늘리면 차이가 사라진다'
      answer: 0
      explanation: |
        평균으로 줄어드는 것은 측정마다 독립으로 바뀌는 noise 뿐이다. 매번 같은 쪽으로 같은 만큼 틀리는 bias 는 몇 번을 평균해도 그대로 남으므로,
        밝기를 아는 기준이나 셔터를 닫고 찍은 dark frame 으로 재서 빼는 calibration 으로 없앤다. 더 많이 평균해도, 중앙값을 써도, 간격을 바꿔도
        모든 값이 같은 쪽으로 3 단계 치우쳐 있으니 bias 는 남는다.
    - question: |
        평균값의 표준편차가 σ ÷ √N 으로 줄어든다는 규칙이 성립하지 않는 경우는 언제인가?
      choices:
        - '센서의 표준편차가 1 단계보다 작아서, 더 줄어들 흔들림이 거의 남지 않았을 때'
        - '평균한 장수 N 이 짝수라서, +와 −의 오차가 짝지어 정확히 0 으로 지워질 때'
        - '밝기를 0 ~ 255 대신 0 ~ 1 로 적어서, σ 와 √N 의 단위가 서로 맞지 않을 때'
        - '연달아 찍은 사진이 같은 원인으로 같은 쪽으로 틀려서, 오차가 독립이 아닐 때'
      answer: 3
      explanation: |
        √N 규칙은 측정의 오차가 서로 독립이어서 +와 −가 섞여 일부 상쇄된다는 가정에서 나온다. 오차가 같은 쪽으로 함께 움직이면 상쇄되지 않아
        덜 줄고, 늘 같은 bias 는 전혀 줄지 않는다. 표준편차의 크기, N 의 홀짝, 단위는 규칙과 관계없다.

- topic: covariance
  title: 공분산과 상관계수
  variants:
    - question: |
        나란한 두 pixel 의 밝기 x 와 y 사이의 공분산이 양수라는 것은 무슨 뜻인가?
      choices:
        - 'x 와 y 의 편차가 둘 다 늘 양수라서, 두 pixel 이 언제나 평균보다 밝다는 뜻이다'
        - 'x 와 y 가 같은 쪽(+는 +끼리, −는 −끼리)으로 함께 벗어나는 경향이 있다는 뜻이다'
        - 'x 와 y 가 서로 관계없어서, 두 pixel 을 따로 계산해도 된다는 뜻이다'
        - 'x 의 분산이 y 의 분산보다 커서, 왼쪽 pixel 이 더 크게 흔들린다는 뜻이다'
      answer: 1
      explanation: |
        공분산은 두 편차를 곱한 값의 평균이다. 같은 쪽으로 벗어나면 곱이 +, 반대쪽이면 − 라서 공분산이 양수면 둘이 함께 같은 방향으로 움직이는
        경향이 있다. 편차 자체의 부호나 두 분산의 크기 비교와는 다른 이야기이고, 관계가 없으면 공분산은 0 이다.
    - question: |
        x 의 분산이 4, y 의 분산이 1, 둘의 공분산이 1 이다. 상관계수(공분산 ÷ 두 표준편차의 곱)는?
      choices:
        - '0.25'
        - '1'
        - '4'
        - '0.5'
      answer: 3
      explanation: |
        표준편차는 분산의 제곱근이라 x 의 표준편차는 2 이고 y 의 표준편차는 1 이다. 상관계수는 $1 \div (2 \times 1) = 0.5$ 다. 0.25 는 분산을 그대로 곱한 4 로 나눈 값이고,
        상관계수는 언제나 −1 과 1 사이라서 4 는 나올 수 없다. 1 은 두 값이 한 직선 위에 놓일 만큼 완전히 함께 움직일 때다.
    - question: |
        공분산 대신 상관계수를 보는 이유는 무엇인가?
      choices:
        - '상관계수가 1 에 가까우면 한쪽이 다른 쪽의 원인이라는 것까지 알 수 있기 때문이다'
        - '상관계수는 분산이나 표준편차 없이 두 편차의 부호만 세어 구할 수 있기 때문이다'
        - '공분산은 단위에 따라 크기가 바뀌지만, 상관계수는 −1 과 1 사이라 강도를 비교하기 쉬워서다'
        - '공분산은 음수가 될 수 없어서, 반대로 움직이는 관계는 상관계수로만 나타낼 수 있기 때문이다'
      answer: 2
      explanation: |
        공분산은 밝기를 0 ~ 1 대신 0 ~ 255 로 적기만 해도 255² 배가 되는 것처럼 크기에 따라 달라져서 강도를 읽기 어렵다. 상관계수는 공분산을 두
        표준편차의 곱으로 나눈 값이라 단위가 없고 −1 과 1 사이에 있다. 상관계수를 구하려면 표준편차가 필요하고, 상관은 인과를 말해 주지 않으며,
        공분산도 음수가 될 수 있다.

- topic: covariance-matrix
  title: 공분산 행렬과 오차 타원
  variants:
    - question: |
        두 값의 퍼짐을 x·y 의 분산 두 개가 아니라 2 × 2 공분산 행렬로 나타내는 이유는 무엇인가?
      choices:
        - '대각선 밖의 공분산으로 x·y 가 함께 움직이는 관계를 담아, 비스듬한 방향의 퍼짐도 나타낼 수 있어서다'
        - '행렬로 묶어 저장하면 숫자 두 개를 따로 저장할 때보다 파일 크기가 작아지기 때문이다'
        - '대각선 밖 칸에 x 와 y 의 분산을 한 번 더 적어 두면, 받는 쪽에서 값을 검산할 수 있어서다'
        - '분산 두 개만으로도 어느 방향의 퍼짐이든 구할 수 있지만, 관습상 행렬로 쓸 뿐이다'
      answer: 0
      explanation: |
        분산 두 개는 x 축과 y 축 방향의 퍼짐만 나타낸다. 공분산까지 담은 행렬이 있어야 값이 비스듬한 방향으로 길게 퍼진 경우를 표현할 수 있고,
        길이 1 인 방향 vector u 로 uᵀΣu 를 계산하면 그 방향의 분산이 나온다. 대각선 밖 칸은 분산을 다시 적은 것이 아니라 공분산이다. 파일 크기나
        관습 때문도 아니며, 분산 두 개로는 기울어진 타원을 나타낼 수 없다.
    - question: |
        나란한 두 pixel 의 공분산 행렬이 [[2, 1.6], [1.6, 2]] 이다. 오차 타원은 어떤 모양인가?
      choices:
        - '대각선의 두 분산이 2 로 같으므로, 어느 방향으로나 반지름이 같은 원이다'
        - '공분산 1.6 이 분산 2 보다 작아서, x 축 방향으로 조금 길쭉한 타원이다'
        - '공분산이 양수라서 x = y 방향(두 pixel 이 함께 밝아지는 쪽)으로 길게 기운 타원이다'
        - '공분산이 양수라 x 가 늘 때 y 가 줄어서, x = −y 방향(오른쪽 아래)으로 기운 타원이다'
      answer: 2
      explanation: |
        대각선의 분산이 같고 공분산이 양수라서 값은 두 pixel 이 같은 쪽으로 벗어나는 오른쪽 위 방향으로 길게 퍼진다. 그 방향의 분산은
        $(2 + 1.6 + 1.6 + 2) \div 2 = 3.6$ 이고, 직각 방향은 0.4 다. 두 분산이 같아도 원이 되는 것은 공분산이 0 일 때뿐이고, 축에 나란한 타원도
        공분산이 0 일 때 나온다. 공분산이 양수면 x 가 늘 때 y 도 느는 쪽이므로, 오른쪽 아래로 기운 타원은 공분산이 음수일 때다.
    - question: |
        2차원 Gaussian 의 1σ 오차 타원 안에는 값이 몇 % 확률로 들어오는가?
      choices:
        - '68%. 1σ 안에 드는 확률은 차원과 관계없이 늘 같다'
        - '약 39%. 두 방향으로 동시에 들어와야 해서 68% 보다 작다'
        - '약 86%. x 와 y 두 방향의 확률이 보태져 1차원보다 커진다'
        - '50%. 1σ 타원은 넓이로 안과 밖을 반반 나누는 경계다'
      answer: 1
      explanation: |
        2차원 Gaussian 의 1σ 타원 안에는 약 39% 가 들어가고, 2σ 타원 안에는 약 86% 가, 3σ 타원 안에는 약 98.9% 가 들어간다. 1차원의 68-95-99.7 규칙을 그대로
        적용해 68% 라고 읽으면 값이 실제보다 좁게 모여 있다고 착각하게 된다. 86% 는 2σ 타원 안의 확률이고, 1σ 타원은 확률을 반반 나누는
        경계가 아니라서 50% 도 아니다.

- topic: bayes-rule
  title: 조건부 확률과 Bayes rule
  variants:
    - question: |
        고양이 사진이 10% 인 사진 모음에서, 고양이 사진의 90% 를 고양이로 판정하고 다른 사진의 5% 를 잘못 고양이로 판정하는 분류기가 "고양이" 로 판정했다. 실제로 고양이 사진일 확률은 대략 얼마인가?
      choices:
        - '90%. 분류기의 적중률이 곧 고양이일 확률이다'
        - '95%. 오경보 5% 를 뺀 나머지가 고양이다'
        - '10%. 판정해도 prior 는 바뀌지 않는다'
        - '약 67%. 오경보가 섞여 적중률보다 낮다'
      answer: 3
      explanation: |
        사진 1000 장으로 세면 고양이 사진 100 장 중 90 장이 "고양이" 로 판정되고, 다른 사진 900 장 중 45 장도 "고양이" 로 판정된다. 판정된 135 장 중 고양이 사진은 90 장이라
        90 ÷ 135 ≈ 0.67 이다. 90% 는 고양이일 때 판정이 나올 확률 P(판정|고양이)이고, 95% 는 다른 사진을 제대로 넘길 확률이며, 10% 는 판정으로
        고치기 전의 prior 다.
    - question: |
        Bayes rule 에서 prior, likelihood, posterior 는 각각 무엇인가?
      choices:
        - 'prior 는 방금 나온 판정이고, likelihood 는 판정 전의 믿음이고, posterior 는 분류기의 사양이다'
        - 'prior 는 판정 전의 믿음이고, likelihood 는 상태마다 그 판정이 나올 확률이고, posterior 는 판정 뒤의 믿음이다'
        - '세 값은 같은 확률을 Bayes rule 의 계산 단계에 따라 다른 이름으로 부른 것이다'
        - 'prior 는 오경보율이고, likelihood 는 적중률이고, posterior 는 두 확률의 평균이다'
      answer: 1
      explanation: |
        prior P(고양이)는 판정 전에 고양이일 확률이고, likelihood P(판정|고양이)는 고양이라는 상태에서 그 판정이 나올 확률이며,
        posterior P(고양이|판정)은 판정 뒤의 확률이다. posterior 는 likelihood × prior 를 그 판정이 나올 전체 확률로 나눠 구하며, 적중률과 오경보율의 평균이 아니다.
    - question: |
        같은 분류기(적중률 90%, 오경보율 5%)를 고양이 사진이 1% 뿐인 모음과 50% 인 모음에 각각 쓰면, "고양이" 판정이 나왔을 때 고양이일 확률은 어떻게 다른가?
      choices:
        - '고양이가 드문 모음에서는 판정 대부분이 오경보라 약 15% 이고, 흔한 모음에서는 약 95% 다'
        - '분류기의 적중률이 같으므로, 두 모음 모두 판정이 나오면 90% 의 확률로 고양이다'
        - '고양이가 드문 모음에서 더 높다. 드문 것을 찾아냈으니 우연일 가능성이 작아서 더 확실하다'
        - '분류기의 적중률과 오경보율이 같으면 posterior 도 같아서, 두 모음에서 같은 확률이 나온다'
      answer: 0
      explanation: |
        posterior 는 prior 에 크게 좌우된다. 고양이가 1% 이면 1000 장 중 고양이 사진에서 9 장이 판정되고 다른 사진 990 장에서 약 50 장이 판정되어 고양이일
        확률은 약 0.15 이고, 50% 이면 450 장과 25 장이라 약 0.95 다. 적중률과 오경보율이 같아도 prior 가 다르면 posterior 가 달라지며, 드문 것을 찾는
        분류기일수록 오경보의 비중이 커진다.

- topic: bayes-update
  title: 반복 판정과 믿음
  variants:
    - question: |
        같은 장면의 두 frame 에서 "고양이" 판정이 연달아 나왔다. 두 번째 판정을 Bayes rule 로 반영할 때 prior 로 무엇을 쓰는가?
      choices:
        - '처음의 prior 를 그대로 쓴다. 사진 모음의 고양이 비율은 판정해도 바뀌지 않는다'
        - '분류기의 적중률 90% 를 쓴다. 이미 한 번 판정됐으니 그 확률이 믿음이 된다'
        - '첫 번째 판정 뒤의 posterior 를 새 prior 로 쓴다'
        - '0.5 로 초기화한다. 판정마다 치우침 없이 새로 시작해야 공정하다'
      answer: 2
      explanation: |
        Bayes 갱신은 되풀이할 수 있어서, 앞 판정의 posterior 가 다음 판정의 prior 가 된다. 고양이 예에서는 0.10 → 0.67 → 0.97 로 확신이 커진다.
        처음 prior 나 0.5 로 다시 시작하면 첫 판정의 정보를 버리게 되고, 적중률은 likelihood 이지 prior 가 아니다.
    - question: |
        반복 판정으로 믿음이 빠르게 확실해지는 계산이 틀리는 경우는 언제인가?
      choices:
        - '판정 횟수가 세 번을 넘어서, 곱한 확률이 1 을 넘을 만큼 커지기 시작할 때'
        - '분류기의 적중률이 50% 보다 높아서, 판정 한 번이 믿음을 지나치게 크게 바꿀 때'
        - 'prior 가 0.1 보다 커서, 판정 전부터 이미 고양이라고 믿고 있을 때'
        - '벽의 고양이 그림 때문에 매 frame 같은 오경보가 나서, 오류가 서로 독립이 아닐 때'
      answer: 3
      explanation: |
        반복 갱신은 판정마다 오류가 독립이라고 가정한다. 같은 원인으로 같은 오경보가 되풀이되면 판정 여러 번이 사실상 한 번의 정보인데, 독립으로
        계산하면 확신만 지나치게 커진다. 평균으로 bias 를 지울 수 없는 것과 같은 이유다. 횟수, 적중률, prior 의 크기는 이 가정과 관계없고, 갱신마다
        전체 확률로 나누므로 posterior 가 1 을 넘는 일도 없다.
    - question: |
        첫 frame 에서 "고양이" 판정이 나와 고양이일 확률이 0.67 이 되었다. 다음 frame 에서는 판정이 나오지 않았다(적중률 90%, 오경보율 5%). 믿음은 어떻게 되는가?
      choices:
        - '0.67 그대로다. 판정이 나오지 않은 frame 은 믿음을 고칠 아무 정보도 주지 않는다'
        - '약 0.17 로 떨어진다. 고양이가 있으면 판정이 빠질 확률이 10% 뿐이기 때문이다'
        - '0 이 된다. 판정이 한 번이라도 빠지면 고양이가 없다는 것이 확실해지기 때문이다'
        - '0.67 에서 적중률 0.9 를 뺀 값이라 음수가 되어, 더는 확률로 계산할 수 없다'
      answer: 1
      explanation: |
        판정이 나오지 않을 확률은 고양이가 있을 때 0.1, 없을 때 0.95 다. Bayes rule 로 $\frac23 \times 0.1 \div (\frac23 \times 0.1 + \frac13 \times 0.95)
        \approx 0.17$ 이 된다. 판정이 없는 것도 likelihood 가 상태마다 달라서 정보가 되지만, 0.1 의 확률로 놓칠 수 있으니 0 이 되지는 않는다.
        확률은 빼서 고치지 않고 Bayes rule 로 고친다.

- topic: expected-value-sampling
  title: 기댓값과 sampling
  variants:
    - question: |
        그림 생성 설정 A 는 90% 로 쓸 만한 그림을 내 보상 10 을 받고, 10% 로 고쳐야 하는 그림을 내 보상 −50 을 받는다. B 는 70% 로 보상 10 을 받고, 30% 로 보상 0 을 받는다. 기댓값으로 고르면?
      choices:
        - 'B. A 는 9 − 5 = 4 이고 B 는 7 이다'
        - 'A. 성공률이 90% 로 더 높아서 실패할 일이 적다'
        - '둘이 같다. 성공 보상이 10 으로 같아서 기댓값도 같다'
        - 'A. 0.9 × 10 = 9 로 B 의 7 보다 크다'
      answer: 0
      explanation: |
        기댓값은 결과마다 보상 × 확률을 더한 값이다. A 는 9 − 5 = 4 이고 B 는 7 + 0 = 7 이라 B 가 크다. 성공률만 보면 실패의 크기(−50)를 놓치고,
        A 의 9 는 실패 보상을 빼먹은 값이다.
    - question: |
        평균 μ, 표준편차 σ 인 Gaussian 에서 값을 하나 sampling 하려면, 표준 정규분포 N(0, 1) 에서 뽑은 ε 을 어떻게 바꾸는가?
      choices:
        - 'ε × μ + σ'
        - 'ε 를 그대로 쓴다'
        - 'μ + σ × ε'
        - 'μ + σ² × ε'
      answer: 2
      explanation: |
        N(0, 1) 에서 뽑은 ε 에 σ 를 곱하면 폭이 σ 가 되고, μ 를 더하면 가운데가 μ 로 옮겨 간다. 평균 200, σ 2 이면 ε = 1.5 일 때 203 이다.
        σ² 는 분산이라 곱하면 폭이 틀리고, μ 와 σ 의 자리를 바꾸면 다른 분포가 된다. VAE 의 reparameterization trick 도 같은 식이다.
    - question: |
        기댓값이 같은 두 선택지가 있다. 그래도 둘을 구별해야 하는 이유는 무엇인가?
      choices:
        - '기댓값이 같으면 매번 나오는 결과도 같으므로, 사실은 구별할 필요가 없다'
        - '기댓값은 한 번 해 본 결과일 뿐이라, 다시 해 보면 달라질 수 있기 때문이다'
        - '기댓값이 같으면 성공 확률도 같으므로, 성공 보상이 큰 쪽을 골라야 하기 때문이다'
        - '결과가 퍼진 정도(분산)가 달라서, 한쪽만 가끔 큰 손해를 낼 수 있기 때문이다'
      answer: 3
      explanation: |
        기댓값은 아주 여러 번 했을 때의 평균이다. 성공 10·실패 −20 (90%·10%)과 성공 10·실패 0 (70%·30%)은 기댓값이 둘 다 7 이지만 앞쪽만 가끔
        큰 손해를 낸다. 기댓값이 같아도 결과와 확률은 다를 수 있고, 기댓값은 한 번의 결과가 아니라 평균이다.
