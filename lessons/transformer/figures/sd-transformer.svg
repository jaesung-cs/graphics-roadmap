<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Stable Diffusion U-Net 의 attention block. 64×64 latent 의 위치 4,096 개가 token 이 되어 self-attention 으로 서로를 보고, cross-attention 으로 prompt 의 token 77 개를 읽은 뒤 FFN 을 지난다. 단계마다 LayerNorm 을 먼저 하고 입력을 더한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="120.0" width="120.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80.0" y="146.0" fill="#e2e8f0" font-size="12" text-anchor="middle">그림 위치</text>
  <text x="80.0" y="164.0" fill="#38bdf8" font-size="11" text-anchor="middle">token 4,096 개</text>
  <line x1="142.0" y1="150.0" x2="186.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190.0" y="110.0" width="130.0" height="80.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="255.0" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">LayerNorm</text>
  <text x="255.0" y="152.0" fill="#e2e8f0" font-size="13" text-anchor="middle">self-attention</text>
  <text x="255.0" y="172.0" fill="#a78bfa" font-size="11" text-anchor="middle">그림 위치끼리</text>
  <path d="M178,150 L178,88 L332,88 L332,140" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="332.0" cy="150.0" r="9" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="332.0" y="155.0" fill="#e2e8f0" font-size="14" text-anchor="middle">+</text>
  <line x1="322.0" y1="150.0" x2="323.0" y2="150.0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="341.0" y1="150.0" x2="356.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360.0" y="110.0" width="130.0" height="80.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="425.0" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">LayerNorm</text>
  <text x="425.0" y="152.0" fill="#e2e8f0" font-size="13" text-anchor="middle">cross-attention</text>
  <text x="425.0" y="172.0" fill="#34d399" font-size="11" text-anchor="middle">그림 → prompt</text>
  <path d="M348,150 L348,88 L502,88 L502,140" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="502.0" cy="150.0" r="9" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="502.0" y="155.0" fill="#e2e8f0" font-size="14" text-anchor="middle">+</text>
  <line x1="492.0" y1="150.0" x2="493.0" y2="150.0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="511.0" y1="150.0" x2="526.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="530.0" y="110.0" width="130.0" height="80.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595.0" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">LayerNorm</text>
  <text x="595.0" y="152.0" fill="#e2e8f0" font-size="13" text-anchor="middle">FFN</text>
  <text x="595.0" y="172.0" fill="#f59e0b" font-size="11" text-anchor="middle">차원 4 배로</text>
  <path d="M518,150 L518,88 L672,88 L672,140" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="672.0" cy="150.0" r="9" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="672.0" y="155.0" fill="#e2e8f0" font-size="14" text-anchor="middle">+</text>
  <line x1="662.0" y1="150.0" x2="663.0" y2="150.0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="681.0" y1="150.0" x2="700.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360.0" y="240.0" width="130.0" height="54.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="425.0" y="262.0" fill="#e2e8f0" font-size="12" text-anchor="middle">prompt token 77 개</text>
  <text x="425.0" y="280.0" fill="#94a3b8" font-size="10" text-anchor="middle">CLIP text encoder 출력</text>
  <line x1="425.0" y1="238.0" x2="425.0" y2="194.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="470.0" y="222.0" fill="#34d399" font-size="11" text-anchor="start">key · value</text>
  <text x="360.0" y="60.0" fill="#94a3b8" font-size="11" text-anchor="middle">점선: 입력을 옆으로 돌려 더하는 residual connection</text>
  <text x="360.0" y="316.0" fill="#e2e8f0" font-size="11" text-anchor="middle">점수 표: self-attention 4,096 × 4,096 = 16,777,216 칸 · cross-attention 4,096 × 77 = 315,392 칸</text>
</svg>
