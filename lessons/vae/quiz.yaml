# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: average-of-answers
  title: 갈라진 정답과 MSE 의 평균
  variants:
    - question: |
        흑백 사과 사진에 색을 칠하는 모델을 학습한다. 학습 사진의 절반은 빨간 사과이고 절반은 초록 사과다. 색 하나를 내는 모델을 MSE 로
        학습하면 어떤 색이 나오는가?
      choices:
        - '사진 수가 조금이라도 많은 쪽을 따라 빨강이나 초록 가운데 하나를 고른다'
        - '두 색의 평균에 가까운 색을 내서 회색에 가까운 칙칙한 사과가 나온다'
        - '두 색을 모두 배웠으므로 칠할 때마다 빨강과 초록을 무작위로 번갈아 낸다'
        - '같은 입력에 정답이 둘이라 loss 가 줄지 않고 학습이 발산해 버린다'
      answer: 1
      explanation: |
        MSE 를 가장 작게 하는 예측은 정답들의 평균이라서, 빨강과 초록이 반반이면 색이 없는 가운데 값이 나온다. 사진 수가 같으므로 한쪽을 고를
        근거가 없다. 색 하나를 내는 모델은 같은 입력에 늘 같은 출력을 내서 번갈아 고르지 못한다. 학습은 발산하지 않고 정상적으로 끝나는데,
        그 결과가 평균일 뿐이다.
    - question: |
        같은 흑백 사진에 옳은 색이 여러 무리로 갈라지는 colorization 데이터를 multimodal 이라고 부른다. 여기서 multimodal 은 무슨 뜻인가?
      choices:
        - '그림과 글처럼 모델이 받는 입력의 종류가 여럿이라는 뜻이다'
        - '사진을 여러 사람이 찍어 모아서 사람마다 찍는 습관이 다르다는 뜻이다'
        - '정답의 분포에 값이 몰린 봉우리(mode)가 여럿이라는 뜻이다'
        - '모델이 여러 개의 network 로 되어 있어 정답을 여럿 낸다는 뜻이다'
      answer: 2
      explanation: |
        mode 는 값이 몰린 봉우리이고, multimodal 데이터는 같은 입력에 옳은 답의 봉우리가 여럿인 데이터다. 입력의 종류가 여럿이라는 뜻은 CLIP
        같은 모델을 multimodal 모델이라고 부를 때의 다른 뜻이다. 사진을 찍은 사람 수는 봉우리 수와 관계없다. 모델을 이루는 network 의 개수도
        데이터의 성질과 관계없다.
    - question: |
        같은 입력에 정답이 여러 무리로 갈라질 때, 생성 모델로 이 문제를 다루는 방법은 무엇인가?
      choices:
        - '정답들의 분포를 배워서, 만들 때마다 그 분포에서 한 무리의 답을 뽑는다'
        - '평균이 정확해지면 가운데 답도 맞아지므로 학습 epoch 를 더 늘린다'
        - '무리가 하나만 남도록 가장 먼저 모은 정답 하나만 두고 나머지는 지운다'
        - 'learning rate 를 줄여 모델이 평균으로 끌려가는 속도를 늦춘다'
      answer: 0
      explanation: |
        분포를 배워서 그 분포에서 뽑으면 매번 한 무리의 답이 나오고 가운데 답은 거의 나오지 않는다. epoch 를 늘리면 평균에 더 정확히
        수렴할 뿐이다. 정답 하나만 남기면 다른 무리의 데이터를 모두 버리게 되어 분포를 배울 수 없다. learning rate 는 학습 속도만 바꾸고 MSE 가
        평균을 고르는 성질은 그대로다.

- topic: autoencoder-gap
  title: autoencoder 와 latent space 의 빈 곳
  variants:
    - question: |
        잘 학습한 보통의 autoencoder 에서 latent 를 무작위로 골라 decoder 에 넣으면 그럴듯한 새 데이터가 나온다는 보장이 없다.
        이유는 무엇인가?
      choices:
        - 'decoder 는 encoder 를 거친 값만 입력으로 받을 수 있어서, 무작위 latent 는 처리하지 못하기 때문이다'
        - 'autoencoder 는 정보를 줄이는 모델이라 학습 데이터조차 제대로 되살리지 못하기 때문이다'
        - 'latent 의 차원이 데이터보다 커서 무작위로 고르면 의미 없는 값이 섞이기 때문이다'
        - 'loss 가 latent 의 위치를 정하지 않아서, 무리 사이에 decoder 가 본 적 없는 빈 곳이 남기 때문이다'
      answer: 3
      explanation: |
        autoencoder 의 loss 는 학습 데이터를 잘 되살리기만 하면 작아지므로 latent 의 위치에는 제약이 없고, 무리 사이의 빈 곳에서는 decoder 의
        출력이 정해져 있지 않다. decoder 는 어떤 latent 든 입력으로 받을 수 있다. 질문의 autoencoder 는 잘 학습해서 학습 데이터는 잘 되살린다.
        latent 는 보통 데이터보다 훨씬 적은 숫자로 줄인 것이라서 차원이 더 크지 않다.
    - question: |
        autoencoder 는 정답 label 없이 무엇을 정답으로 삼아 학습하는가?
      choices:
        - '사람이 데이터마다 달아 둔 class label 을 latent 로 맞힌다'
        - '입력 자기 자신. 되살린 출력과 원래 입력의 차이를 줄인다'
        - '표준 정규분포에서 뽑은 무작위 값을 latent 의 정답으로 삼는다'
        - 'latent 의 각 숫자가 무슨 뜻인지 사람이 정해 둔 값'
      answer: 1
      explanation: |
        encoder 가 입력을 latent 로 줄이고 decoder 가 되살린 뒤, 되살린 출력과 원래 입력의 차이를 줄인다. 입력 자신이 정답이라서 사람이 단
        class label 은 필요 없다. 표준 정규분포는 VAE 가 latent 에 붙이는 prior 이고 정답으로 쓰이지 않는다. latent 의 뜻은 사람이 정하지 않고
        학습으로 정해진다.
    - question: |
        autoencoder 의 latent 차원(z_dim)을 아주 작게 줄이면 무엇이 달라지는가?
      choices:
        - '담을 수 있는 정보가 줄어 되살린 출력이 원래 입력과 더 많이 달라진다'
        - '꼭 필요한 정보만 남아 되살린 출력이 원래 입력보다 더 선명해진다'
        - 'latent 가 좁은 공간에 몰려서 latent space 의 빈 곳이 저절로 모두 사라진다'
        - 'encoder 없이 decoder 만으로 학습할 수 있게 된다'
      answer: 0
      explanation: |
        latent 의 숫자가 적을수록 입력의 성질을 담을 자리가 줄어서 reconstruction loss 가 커진다. 정보가 줄었으니 출력이 더 선명해질 이유가 없다.
        빈 곳은 loss 에 위치 제약이 없어서 생기는 것이라 차원을 줄여도 남는다. encoder 는 학습 데이터의 latent 를 만드는 데 여전히 필요하다.

- topic: gaussian-encoder
  title: 평균과 분산을 내는 encoder
  variants:
    - question: |
        VAE 의 encoder 가 latent 의 점 하나 대신 평균과 표준편차를 내는 이유는 무엇인가?
      choices:
        - '평균과 표준편차 두 숫자로 요약하면 점 하나를 그대로 저장할 때보다 공간을 덜 쓰기 때문이다'
        - 'decoder 가 얼마나 흐리게 그릴지 정하려면 표준편차를 입력으로 직접 받아야 하기 때문이다'
        - '데이터 하나를 범위로 만들어 decoder 가 범위 전체를 되살리게 하면, 범위끼리 겹쳐 빈 곳이 채워지기 때문이다'
        - '평균만 내면 출력이 미분할 수 없는 점이 되어, encoder 로 gradient 를 구할 수 없기 때문이다'
      answer: 2
      explanation: |
        학습 때 그 분포에서 뽑은 latent 가 매번 조금씩 달라서, decoder 는 평균 근처의 범위 전체를 같은 데이터로 되살리는 법을 배운다. 범위끼리
        맞닿거나 겹치면 빈 곳이 줄어든다. 숫자가 두 배라 저장 공간은 오히려 늘어난다. decoder 는 뽑은 latent 하나를 받고 표준편차를 따로 받지
        않는다. 평균만 내는 보통의 autoencoder 도 gradient 는 구할 수 있다.
    - question: |
        VAE 구현에서 encoder 가 표준편차 σ 대신 log σ² (logvar)를 내는 이유는 무엇인가?
      choices:
        - 'log 를 씌운 값을 내면 KL 항의 log 와 상쇄되어 KL 항을 계산할 필요가 없기 때문이다'
        - 'logvar 는 무작위성이 없는 값이라, 이것을 내면 reparameterization trick 이 필요 없어지기 때문이다'
        - 'σ 는 CPU 에서 계산해야 하지만 logvar 는 GPU 에서 바로 계산되기 때문이다'
        - 'Linear layer 의 출력은 음수일 수 있는데, logvar 는 exp 를 씌우면 언제나 양수인 σ 가 되기 때문이다'
      answer: 3
      explanation: |
        표준편차는 0 보다 커야 하지만 Linear layer 의 출력은 음수일 수 있다. logvar 는 어떤 실수여도 되고, exp 를 씌우면 언제나 양수가 된다.
        KL 항은 logvar 를 넣어 그대로 계산하므로 사라지지 않는다. latent 를 뽑는 단계는 남아 있어서 reparameterization trick 은 여전히 필요하다.
        CPU 와 GPU 중 어디서 계산하는지는 이 선택과 관계없다.
    - question: |
        VAE 에서 prior 와 posterior 는 각각 무엇을 가리키는가?
      choices:
        - 'prior 는 decoder 가 되살린 출력 이미지이고, posterior 는 encoder 에 들어가는 원래 입력 이미지다'
        - 'prior 는 학습 전에 정해 둔 latent 의 분포(보통 N(0, I))이고, posterior 는 encoder 가 데이터 하나를 보고 낸 분포다'
        - 'prior 는 학습을 시작하기 전에 잰 학습 데이터 전체의 평균이고, posterior 는 test 데이터의 평균이다'
        - 'prior 는 학습 앞부분인 첫 epoch 의 loss 이고, posterior 는 학습을 마친 마지막 epoch 의 loss 다'
      answer: 1
      explanation: |
        prior 와 posterior 는 라틴어로 앞과 뒤라는 뜻으로, 데이터를 보기 전에 정한 분포와 데이터를 본 뒤의 분포를 가리킨다. VAE 의 prior 는
        보통 N(0, I) 이고 posterior 는 encoder 가 낸 N(μ, σ²) 이다. decoder 의 출력과 encoder 의 입력은 데이터이지 latent 의 분포가 아니다.
        학습 데이터와 test 데이터의 평균도 latent 의 분포가 아니다. 첫 epoch 와 마지막 epoch 의 loss 값은 이 두 용어의 뜻과 관계없다.

- topic: reparameterization
  title: reparameterization trick
  variants:
    - question: |
        VAE 에서 reparameterization trick 이 필요한 이유는 무엇인가?
      choices:
        - '바로 뽑으면 μ, σ 를 바꿀 때 latent 가 변하는 비율이 없어서, encoder 로 gradient 가 전해지지 않기 때문이다'
        - '뽑은 latent 는 gradient 가 없는 값이라, 그 latent 를 받는 decoder 의 weight 를 학습할 수 없기 때문이다'
        - 'μ 와 σ 를 하나의 latent 로 합쳐 encoder 가 내는 latent 의 차원을 절반으로 줄이기 위해서다'
        - 'test 할 때는 ε 을 0 으로 두어, 무작위 뽑기 없이 같은 latent 를 내기 위해서다'
      answer: 0
      explanation: |
        바로 뽑으면 μ 를 바꿔 다시 뽑아도 결과가 운에 따라 달라져서, μ 를 바꿀 때 latent 가 변하는 비율을 정할 수 없다. decoder 는 뽑힌 latent 를
        입력으로 받으므로 이 trick 이 없어도 학습된다. 이 trick 을 써도 latent 의 차원은 그대로다. test 때 latent 를 뽑을지는 이 trick 과
        관계없는 별개의 선택이다.
    - question: |
        z = μ + σ ⊙ ε, ε ~ N(0, I) 로 latent 를 만들 때, z 를 μ 와 σ 로 미분하면 각각 무엇이 되는가?
      choices:
        - '∂z/∂μ = 0, ∂z/∂σ = 0. ε 이 무작위라서 비율이 없다'
        - '∂z/∂μ = σ, ∂z/∂σ = μ'
        - '∂z/∂μ = 1, ∂z/∂σ = ε'
        - '∂z/∂μ = ε, ∂z/∂σ = 1'
      answer: 2
      explanation: |
        ε 을 먼저 뽑아 고정하면 z 는 μ 에 σε 를 더한 평범한 식이라서, μ 가 1 늘면 z 도 1 늘고 σ 가 1 늘면 z 는 ε 만큼 는다. ε 이 무작위여도 뽑힌
        뒤에는 상수로 보므로 비율은 0 이 아니다. ∂z/∂μ = σ 로 본 보기는 더하는 항 μ 와 ε 에 곱하는 계수 σ 를 혼동했다. ∂z/∂μ = ε 으로 본 보기는
        μ 와 σ 의 역할을 뒤집었다.
    - question: |
        reparameterization trick 을 쓰면 VAE 의 latent 에서 무작위성은 어떻게 되는가?
      choices:
        - '무작위성이 완전히 사라져 같은 입력에는 늘 같은 latent 가 나온다'
        - '무작위성이 encoder 의 weight 안으로 옮겨 가서, 학습 때마다 weight 가 무작위로 바뀐다'
        - 'latent 는 고정되고, 무작위성은 decoder 가 출력을 만들 때 더하는 noise 에만 남는다'
        - '무작위성은 그대로 있고, 바깥에서 뽑아 넣는 입력 ε 으로 자리만 옮겨 간다'
      answer: 3
      explanation: |
        ε 은 학습할 때 매번 새로 뽑으므로 latent 는 여전히 매번 다르다. 다만 뽑기가 μ, σ 를 지나는 계산의 바깥에 있어서 gradient 가 끊기지 않는다.
        무작위성이 사라졌다면 VAE 는 보통의 autoencoder 와 같아진다. encoder 의 weight 는 학습되는 값이지 무작위로 뽑는 값이 아니다. decoder
        의 출력이 달라지는 것은 입력 latent 가 달라서이지 decoder 안에 무작위성이 있어서가 아니다.

- topic: kl-elbo
  title: KL 항과 ELBO
  variants:
    - question: |
        VAE loss 의 KL 항은 encoder 가 내는 μ 와 σ 를 각각 어느 쪽으로 끌어당기는가? prior 는 N(0, 1) 이다.
      choices:
        - 'μ 는 0 쪽으로 끌어당기고 σ 는 1 쪽으로 끌어당긴다'
        - 'μ 는 데이터끼리 멀리 흩어 놓고 σ 는 0 쪽으로 끌어당겨 범위를 좁힌다'
        - 'prior 의 평균이 0 이므로 μ 와 σ 를 모두 0 쪽으로 끌어당긴다'
        - 'μ 와 σ 는 그대로 두고 decoder 의 weight 만 바꾼다'
      answer: 0
      explanation: |
        한 차원의 KL 은 ½(μ² + σ² − log σ² − 1) 이라서, μ² 은 μ = 0 에서 가장 작고 σ² − log σ² 는 σ = 1 에서 가장 작다. μ 를 흩고 σ 를 줄이는
        것은 reconstruction 항을 줄이는 방향이다. σ 를 0 쪽으로 보내면 −log σ² 이 커져서 KL 이 오히려 커진다. KL 항은 encoder 가 낸 μ, σ 로만
        계산되므로 encoder 의 weight 를 바꾼다.
    - question: |
        ELBO 를 키우는 것과 VAE 의 loss 를 줄이는 것은 어떤 관계인가?
      choices:
        - 'ELBO 는 log p(x) 의 위쪽 경계라서 log p(x) 보다 항상 크므로, ELBO 를 줄여야 loss 가 준다'
        - 'ELBO 는 reconstruction loss 와 KL 의 합에 마이너스를 붙인 값이라, β = 1 이면 같은 일이다'
        - '둘은 관계가 없다. ELBO 는 학습이 끝난 뒤 test 때 모델을 평가하려고만 계산한다'
        - 'ELBO 는 KL 항만 뜻하고 reconstruction 항은 포함하지 않는다'
      answer: 1
      explanation: |
        ELBO 는 E[log p(x|z)] − KL 이고, 앞 항은 reconstruction loss 의 부호를 바꾼 것이라서 ELBO = −(reconstruction loss + KL) 이다. ELBO 는
        log p(x) 의 아래쪽 경계라서 log p(x) 보다 크지 않다. VAE 는 학습할 때 ELBO 를 계산해 키우므로 test 때만 계산하는 값이 아니다. ELBO 에는
        KL 항과 reconstruction 항이 모두 들어 있다.
    - question: |
        VAE 가 log p(x) 를 직접 키우지 않고 ELBO 를 키우는 이유는 무엇인가?
      choices:
        - 'p(x) 는 확률이라 1 이하이고 학습 데이터에서는 이미 1 이므로, log p(x) 는 항상 0 이라 키울 수 없기 때문이다'
        - 'ELBO 가 log p(x) 보다 언제나 커서, ELBO 를 키우면 log p(x) 는 저절로 따라 커지기 때문이다'
        - 'p(x) 는 모든 latent 에 걸쳐 더해야 해서 계산할 수 없고, ELBO 는 계산할 수 있는 log p(x) 의 하한이기 때문이다'
        - 'log p(x) 를 직접 키우면 KL 항이 음수가 되어 loss 가 끝없이 작아지기 때문이다'
      answer: 2
      explanation: |
        p(x) 는 모든 z 에 걸쳐 p(z) p(x|z) 를 더하거나 적분해야 해서 계산할 수 없다. ELBO 는 encoder 가 낸 분포로 계산할 수 있고, log p(x) 와의
        차이가 0 이상인 KL 이라서 ELBO 를 올리면 log p(x) 의 하한도 함께 올라간다. log p(x) 는 늘 0 이 아니라 데이터마다 다른 값이다. ELBO 는
        log p(x) 보다 작거나 같다. KL 은 어떤 경우에도 음수가 되지 않는다.

- topic: beta-collapse
  title: β 와 posterior collapse
  variants:
    - question: |
        VAE loss 에서 KL 항의 weight β 를 아주 크게 하면 어떤 일이 생기는가?
      choices:
        - 'KL 항이 커질수록 데이터끼리 밀어내서, 모든 데이터의 latent 가 멀리 흩어져 빈 곳이 많아진다'
        - 'latent space 가 잘 정리되어 복원이 더 정확해지고 sample 도 더 선명해진다'
        - 'KL 항이 loss 를 거의 다 차지해 reconstruction 항이 사라지고, 보통의 autoencoder 가 된다'
        - 'encoder 가 어떤 입력에도 prior 와 같은 분포를 내서, decoder 는 평균에 가까운 흐릿한 출력만 낸다'
      answer: 3
      explanation: |
        KL 을 0 으로 만드는 것이 가장 중요해지면 모든 posterior 가 N(0, I) 로 겹치고, decoder 는 latent 로 데이터를 구별하지 못한다. 이것이
        posterior collapse 다. latent 가 흩어지고 빈 곳이 생기는 것은 β = 0 일 때다. β 를 키우면 KL 을 줄이는 쪽에 무게가 실려 복원은 오히려
        나빠진다. 보통의 autoencoder 로 돌아가는 것은 KL 항이 사라지는 β = 0 쪽이다.
    - question: |
        β = 1 로 학습했는데도 KL 이 0 으로 떨어지고 decoder 가 latent 를 무시하는 posterior collapse 가 생겼다. 흔한 원인과
        대처는 무엇인가?
      choices:
        - 'latent 차원이 너무 작아 정보를 담을 자리가 없어서이며, 차원을 늘리면 반드시 해결된다'
        - 'learning rate 가 너무 작아 encoder 가 학습되기 전에 KL 이 먼저 0 이 되어서이며, 크게 키우면 해결된다'
        - 'decoder 가 latent 없이도 데이터를 잘 맞힐 만큼 강해서이며, KL annealing 으로 KL 의 weight 를 천천히 올린다'
        - 'reconstruction loss 가 너무 커서 KL 을 가렸기 때문이며, 합 대신 평균으로 바꾸면 해결된다'
      answer: 2
      explanation: |
        앞 단어를 보고 다음 단어를 맞히는 LSTM 같은 강한 decoder 는 latent 없이도 loss 를 줄일 수 있어서 KL 을 0 으로 두는 쪽으로 수렴하기
        쉽다. KL annealing 은 학습 초반에 KL 의 무게를 줄여 latent 를 쓰게 만든다. 차원을 늘려도 decoder 가 latent 를 무시하면 소용이 없다.
        learning rate 는 이 균형을 바꾸지 않는다. reconstruction loss 를 평균하면 KL 이 상대적으로 무거워져 collapse 가 더 쉬워진다.
    - question: |
        VAE 를 구현하면서 784 pixel 의 reconstruction loss 를 합 대신 평균으로 계산했고, KL 은 latent 차원마다 구해 더했다.
        무엇이 달라지는가?
      choices:
        - 'β 를 784 배 키운 것과 같아져서, latent 가 prior 쪽으로 더 세게 당겨진다'
        - '평균과 합은 gradient 방향이 같아서 아무것도 달라지지 않는다'
        - 'KL 항도 784 분의 1 로 함께 작아져서 두 항의 비율은 그대로다'
        - 'loss 를 평균하면 latent 를 뽑는 단계가 미분되지 않아 reparameterization trick 을 쓸 수 없다'
      answer: 0
      explanation: |
        평균은 합을 784 로 나눈 값이라 reconstruction 항의 무게만 줄고, 두 항의 비율로 보면 β 를 784 배 키운 것과 같다. 한 항만 나눴으므로 두
        항을 더한 loss 의 gradient 방향은 바뀐다. KL 은 그대로 더했으니 작아지지 않는다. loss 의 계산 방식은 latent 를 뽑는 방법과 관계없다.

- topic: sampling
  title: sampling, interpolation, 흐릿한 sample
  variants:
    - question: |
        학습을 마친 VAE 로 새 데이터를 만들 때는 어떻게 하는가?
      choices:
        - '학습 데이터 하나를 encoder 에 넣고 그 μ 를 그대로 decoder 에 넣는다'
        - 'encoder 는 빼고, prior N(0, I) 에서 뽑은 latent 를 decoder 에 넣는다'
        - '새로울수록 좋으므로 각 차원을 −100 ~ 100 에서 고르게 뽑아 decoder 에 넣는다'
        - 'decoder 의 출력을 다시 encoder 에 넣기를 여러 번 반복한다'
      answer: 1
      explanation: |
        KL 항이 학습 내내 posterior 들을 prior 근처에 모아 두었으므로, prior 에서 뽑은 latent 는 decoder 가 익숙한 자리에 떨어진다. 학습 데이터의
        μ 를 넣으면 그 데이터를 되살릴 뿐 새 데이터가 아니다. −100 ~ 100 처럼 넓게 뽑으면 대부분 decoder 가 본 적 없는 자리다. encoder 와 decoder
        를 반복하는 단계는 VAE 의 생성 과정에 없다.
    - question: |
        두 데이터 사이의 중간 모습을 VAE 의 latent space 에서 만드는 방법은 무엇인가?
      choices:
        - '두 데이터의 pixel 값을 비율 t 로 섞은 (1 − t) x_a + t x_b 를 만든다'
        - '두 데이터를 차례로 decoder 에 넣어 나온 두 출력 사이를 이어 붙인다'
        - 'prior 에서 latent 를 여러 번 뽑아, 두 데이터 중 어느 쪽에 더 가까운지로 줄을 세운다'
        - '두 μ 를 잇는 직선 위의 점 (1 − t) z_a + t z_b 를 decoder 에 넣는다'
      answer: 3
      explanation: |
        latent space 를 빈 곳 없이 채운 VAE 에서는 두 μ 를 잇는 직선 위의 점도 decoder 가 익숙한 자리라서, t 를 0 에서 1 로 바꾸면 한 데이터가
        다른 데이터로 조금씩 바뀐다. pixel 을 평균하면 두 그림이 겹쳐 보일 뿐이다. decoder 는 데이터가 아니라 latent 를 입력으로 받는다. 무작위로
        뽑으면 두 데이터 사이를 순서대로 지나가지 않는다.
    - question: |
        VAE 가 만든 이미지가 실제 이미지보다 흐릿한 이유는 무엇인가?
      choices:
        - 'decoder 가 latent 를 키우는 동안 출력 해상도가 입력보다 작아지기 때문이다'
        - '학습 데이터가 원래 흐릿해서 decoder 도 그 흐릿함을 그대로 배우기 때문이다'
        - '범위가 겹친 latent 에서 decoder 가 여러 데이터의 평균에 가까운 출력을 내기 때문이다'
        - 'reparameterization trick 이 뽑은 noise ε 을 이미지에 그대로 더해 가장자리를 흩뜨리기 때문이다'
      answer: 2
      explanation: |
        겹친 자리의 latent 는 학습 중 여러 데이터로 되살려야 했던 자리라서, reconstruction loss 를 줄이는 출력은 그 데이터들의 평균에 가깝고 획의
        가장자리가 번진다. 출력 해상도는 보통 입력과 같다. 학습 데이터가 선명해도 같은 일이 생긴다. reparameterization trick 은 latent 를 뽑는
        방법이고 이미지에 noise 를 더하지 않는다.

- topic: cvae-translation
  title: 여러 답을 내는 그림 변환의 CVAE
  variants:
    - question: |
        cVAE-GAN 은 신발 밑그림에 색을 칠하는 CVAE 다. 학습을 마친 뒤 새 밑그림에 색을 칠할 때 latent z 는 어떻게 정하는가?
      choices:
        - 'encoder 를 쓰지 않고 N(0, I) 에서 z 를 뽑는다. 넣을 정답 사진이 없고, 다시 뽑으면 다른 색이 나온다'
        - '밑그림을 encoder 에 넣어 z 를 구한다. encoder 는 학습 때도 밑그림만 보고 μ 와 σ 를 냈기 때문이다'
        - '학습 사진 가운데 밑그림이 가장 비슷한 사진을 찾아 encoder 에 넣고, 거기서 나온 z 를 그대로 쓴다'
        - 'z 를 8 차원 모두 0 으로 고정한다. prior 의 평균이라서 언제나 가장 그럴듯한 색 하나가 나오기 때문이다'
      answer: 0
      explanation: |
        cVAE-GAN 의 encoder 는 정답 사진을 받아 밑그림에 없는 색과 무늬를 z 에 담는데, 새 밑그림에는 정답 사진이 없다. 그래서 prior N(0, I)
        에서 z 를 뽑아 밑그림과 함께 generator 에 넣고, 다시 뽑을 때마다 색이 다른 그림을 얻는다. encoder 의 입력은 밑그림이 아니라 정답
        사진이다. 비슷한 사진을 찾는 단계는 없다. z 를 0 하나로 고정하면 같은 밑그림에 늘 같은 그림 하나만 나와 여러 답을 낼 수 없다.
    - question: |
        Zhu 등(2017)은 cVAE-GAN 에서 KL 항을 뺀 cAE-GAN 도 학습해 비교했다. cAE-GAN 에서 z 를 무작위로 뽑아 그림을 만들면 어떤 일이 생기는가?
      choices:
        - 'KL 이 없으니 encoder 가 정보를 담지 않게 되어, z 를 바꿔도 거의 같은 그림만 나온다'
        - 'KL 은 sampling 과 상관없는 항이라서, cVAE-GAN 과 같은 다양함과 사실감이 나온다'
        - '결과는 다양하지만, 뽑은 z 가 학습 때 비어 있던 자리에 떨어져 그림이 크게 망가진다'
        - 'generator 가 z 를 무시하는 법을 배워서, 밑그림을 그대로 베낀 흑백 그림만 나온다'
      answer: 2
      explanation: |
        KL 항이 없으면 encoder 가 정답 사진마다 낸 z 가 어디에 놓일지 정해지지 않아서 latent space 에 빈 곳이 생긴다. 논문에 따르면 cAE-GAN 은
        다양함이 늘지만 사실감이 크게 떨어지는데, 뽑은 z 가 비어 있는 자리에서 나올 수 있기 때문이다. KL 이 없어도 encoder 는 reconstruction
        항을 줄이려고 정보를 담는다. KL 을 더한 cVAE-GAN 에서 사실감이 돌아왔으므로 KL 은 sampling 과 관계가 깊다. noise 를 무시하는 문제는 encoder
        없이 noise 만 더한 pix2pix + noise 의 일이다.
    - question: |
        pix2pix 의 저자들은 밑그림과 함께 무작위 noise 를 generator 에 넣어 보았다. 실행할 때마다 다른 그림이 나왔는가?
      choices:
        - '나왔다. noise 를 다시 뽑으면 generator 의 입력이 달라지므로 출력도 반드시 크게 달라지게 되어 있다'
        - '나왔다. GAN 항이 진짜 사진들의 다양함을 따라 하도록 generator 를 밀어 주기 때문이다'
        - '나오지 않았다. noise 를 넣으면 학습이 불안정해져 generator 가 아예 수렴하지 못했기 때문이다'
        - '나오지 않았다. generator 가 noise 를 무시하도록 배워서 저자들은 최종 실험에서 noise 를 뺐다'
      answer: 3
      explanation: |
        BicycleGAN 논문에 따르면 pix2pix 의 저자들은 예비 실험에서 generator 가 noise 를 무시한다는 것을 보고 최종 실험에서 noise 를 뺐다. 정답
        사진은 밑그림마다 하나뿐이라서, noise 를 무시하고 그 정답 하나에 맞추는 것이 loss 를 줄이는 쉬운 길이다. 입력이 달라져도 generator 가
        그 차이를 쓰지 않으면 출력은 같다. GAN 항은 그림 한 장이 진짜 사진처럼 보이는지를 볼 뿐, 같은 밑그림에서 다른 그림을 내라고 요구하지
        않는다. 오히려 noise 를 무시하는 쪽이 학습을 더 안정시킨다는 보고도 논문에 인용되어 있다.
