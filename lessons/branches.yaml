# The curriculum map: one tree that grows from the starting lesson at the top down to Stable Diffusion. The deep
# learning foundations and the image generation lessons build on each other closely, so they share one tree.

# hub: the basics every tree starts from, on rings around the start, innermost first. A ring holds lessons of one kind:
# whole branches, and single lessons of tree branches that two or more trees build on. With a single tree there is no
# hub: every lesson, the math included, grows down from the start.
hub:
  rings: []

# title: the tree's name; with more than one tree it is written in the tree's area of the map.
# color: the faint tint of that area.
# angle: the direction a tree grows from the start, degrees clockwise from up (0 up, 90 right, 180 down).
# branches: the tree's branches, laid side by side in this order, left to right for a tree growing down.
trees:
  - id: roadmap
    title: Graphics Roadmap
    color: "#a78bfa"
    angle: 180
    branches: [math, language, core, vision, generative, stable-diffusion]

# Listed in legend order. core: true marks the foundations every other branch builds on (exactly one); the map draws
# its chain as the trunk.
branches:
  - id: math
    title: Math
    summary: vector·matrix, 미분, 확률. 이미지의 pixel 값과 학습, noise 를 숫자로 다루는 기초
    color: "#d6d3d1"

  - id: core
    title: Foundations
    summary: 신경망이 무엇을 계산하고 어떻게 학습하는지를 숫자 계산부터 따라가는 출발점
    color: "#cbd5e1"
    core: true

  - id: language
    title: Language
    summary: tokenizer 와 Transformer, GPT 까지 이어지는 sequence 모델링. 글을 읽는 text encoder 가 여기서 나온다
    color: "#a78bfa"

  - id: vision
    title: Vision
    summary: CNN 에서 ResNet·ViT·CLIP 까지, 이미지를 읽고 글과 같은 공간에 놓는 image encoder
    color: "#60a5fa"

  - id: generative
    title: Generative Models
    summary: VAE·diffusion·flow matching. noise 에서 새 이미지를 만들어 내는 생성 모델의 수학
    color: "#e879f9"

  - id: stable-diffusion
    title: Stable Diffusion
    summary: U-Net, latent space, text conditioning, guidance, sampler. 글 한 줄로 이미지를 만드는 Stable Diffusion 의 부품
    color: "#f59e0b"
