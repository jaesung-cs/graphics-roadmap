# The curriculum map: the math at the centre, and two trees growing out of it: the deep learning foundations, and the
# image generation that builds on them up to Stable Diffusion.

# hub: the basics every tree starts from, on rings around the start at the centre, innermost first. A ring holds
# lessons of one kind: whole branches, and single lessons of tree branches that two or more trees build on. A hub
# lesson's prerequisites sit on its own ring or inside it; the trees start from the outermost ring.
hub:
  rings:
    - branches: [math]

# title: the name written in the tree's area of the map, which lines from the hub mark off from the other trees.
# color: the faint tint of that area.
# angle: the direction a tree grows from the centre, degrees clockwise from up (0 up, 90 right, 180 down).
# branches: the tree's branches, laid side by side in this order, clockwise around the centre.
trees:
  - id: foundations
    title: Deep Learning
    color: "#a78bfa"
    angle: 180
    branches: [language, core, vision]
  - id: generation
    title: Image Generation
    color: "#e879f9"
    angle: 0
    branches: [generative, stable-diffusion]

# Listed in legend order. core: true marks the foundations every other branch builds on (exactly one); the map draws
# its chain as the trunk.
branches:
  - id: math
    title: Math
    summary: vector·matrix, 미분, 확률. 이미지의 pixel 값과 학습, noise 를 숫자로 다루는 기초
    color: "#d6d3d1"

  - id: core
    title: Foundations
    summary: 신경망이 무엇을 계산하고 어떻게 학습하는지를 숫자 계산부터 따라가는 출발점
    color: "#cbd5e1"
    core: true

  - id: language
    title: Language
    summary: tokenizer 와 Transformer, GPT 까지 이어지는 sequence 모델링. 글을 읽는 text encoder 가 여기서 나온다
    color: "#a78bfa"

  - id: vision
    title: Vision
    summary: CNN 에서 ResNet·ViT·CLIP 까지, 이미지를 읽고 글과 같은 공간에 놓는 image encoder
    color: "#60a5fa"

  - id: generative
    title: Generative Models
    summary: VAE·diffusion·flow matching. noise 에서 새 이미지를 만들어 내는 생성 모델의 수학
    color: "#e879f9"

  - id: stable-diffusion
    title: Stable Diffusion
    summary: U-Net, latent space, text conditioning, guidance, sampler. 글 한 줄로 이미지를 만드는 Stable Diffusion 의 부품
    color: "#f59e0b"
