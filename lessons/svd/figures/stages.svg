<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SVD 의 학습 세 단계. 1 단계 SD 2.1 을 σ 표기로 미세조정, 2 단계 LVD-F 로 14 프레임 256×384 150k iteration 뒤 320×576 100k iteration, 3 단계 고화질 video 로 image-to-video 를 320×576 50k 뒤 576×1024 50k iteration. 모든 단계에서 U-Net 전체를 학습한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="878" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="440.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">Stable Video Diffusion 의 학습 세 단계</text>
  <rect x="30.0" y="60.0" width="260.0" height="170.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="160.0" y="88.0" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="bold">1. 이미지 학습</text>
  <text x="160.0" y="122.0" fill="#e2e8f0" font-size="12" text-anchor="middle">Stable Diffusion 2.1 에서 시작</text>
  <text x="160.0" y="146.0" fill="#e2e8f0" font-size="12" text-anchor="middle">σ 표기의 식으로 바꿔 31k iteration</text>
  <text x="160.0" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="middle">(512² 에서 1k, 256×384 에서 30k)</text>
  <text x="160.0" y="210.0" fill="#94a3b8" font-size="12" text-anchor="middle">배우는 것: 그림 그리는 법</text>
  <rect x="310.0" y="60.0" width="260.0" height="170.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440.0" y="88.0" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="bold">2. video 사전학습</text>
  <text x="440.0" y="122.0" fill="#e2e8f0" font-size="12" text-anchor="middle">시간 layer 656M 을 끼우고 LVD-F 로</text>
  <text x="440.0" y="146.0" fill="#e2e8f0" font-size="12" text-anchor="middle">14 프레임 256×384, 150k iteration</text>
  <text x="440.0" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="middle">→ 320×576, 100k iteration</text>
  <text x="440.0" y="210.0" fill="#94a3b8" font-size="12" text-anchor="middle">배우는 것: 움직임 일반</text>
  <rect x="590.0" y="60.0" width="260.0" height="170.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="720.0" y="88.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="bold">3. 고화질 미세조정</text>
  <text x="720.0" y="122.0" fill="#e2e8f0" font-size="12" text-anchor="middle">image-to-video 로 바꿔 320×576, 50k</text>
  <text x="720.0" y="146.0" fill="#e2e8f0" font-size="12" text-anchor="middle">→ 고화질 약 1M clip, 576×1024, 50k</text>
  <text x="720.0" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="middle">14 프레임(SVD), 25 프레임(SVD-XT)</text>
  <text x="720.0" y="210.0" fill="#94a3b8" font-size="12" text-anchor="middle">배우는 것: 화질과 해상도</text>
  <line x1="292.0" y1="145.0" x2="308.0" y2="145.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572.0" y1="145.0" x2="588.0" y2="145.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30.0" y="252.0" width="820.0" height="80.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="440.0" y="280.0" fill="#e2e8f0" font-size="13" text-anchor="middle">U-Net 1,524,623,082 개 = 이미지 layer 868,546,244 개 + 시간 layer 656,076,838 개</text>
  <text x="440.0" y="306.0" fill="#94a3b8" font-size="12" text-anchor="middle">세 단계 모두 U-Net 전체를 학습한다. 앞 강의의 Video LDM·AnimateDiff 처럼 이미지 layer 를 고정하지 않는다</text>
</svg>
