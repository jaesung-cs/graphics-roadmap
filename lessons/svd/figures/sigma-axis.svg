<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>σ 를 log 눈금에 놓은 그림. Stable Diffusion 의 σ 는 0.029 ~ 14.615 이고, SVD 의 25 step Karras schedule 은 700 에서 0.002 까지 내려가며 25 개 가운데 13 개가 14.615 보다 크다. 학습 σ 의 가운데 값은 이미지 미세조정 0.30, 320×576 사전학습 1.0, image-to-video 320×576 2.01, 576×1024 2.72 로 커진다</title>
