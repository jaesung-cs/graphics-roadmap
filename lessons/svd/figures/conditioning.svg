<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>그림 한 장을 두 길로 넣는다. CLIP image encoder 가 224×224 로 줄인 그림에서 1024 개 vector 하나를 만들어 cross-attention 에 넣고, noise 를 조금 섞은 그림의 VAE latent 4×72×128 을 25 프레임에 복사해 noise latent 4 channel 옆에 이어 붙여 8 channel 로 넣는다. fps 6, motion bucket 127, noise 세기 0.02 는 256 개씩 sin·cos 로 늘린 768 개를 1280 개로 바꿔 시각 embedding 에 더한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="898" height="468" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="450.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">그림 한 장을 U-Net 에 넣는 세 길</text>
  <rect x="30.0" y="190.0" width="130.0" height="80.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="95.0" y="222.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">조건 그림</text>
  <text x="95.0" y="244.0" fill="#94a3b8" font-size="12" text-anchor="middle">576 × 1024</text>
  <line x1="160.0" y1="210.0" x2="200.0" y2="95.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="205.0" y="60.0" width="250.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="330.0" y="86.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="bold">CLIP image encoder (ViT-H/14)</text>
  <text x="330.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">224×224 로 줄여 1024 개 vector 하나</text>
  <line x1="455.0" y1="95.0" x2="520.0" y2="95.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="525.0" y="60.0" width="345.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="697.0" y="86.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="bold">cross-attention 의 key·value (token 1 개)</text>
  <text x="697.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">글 대신 그림의 내용을 전한다</text>
  <line x1="160.0" y1="230.0" x2="200.0" y2="230.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="205.0" y="195.0" width="250.0" height="70.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330.0" y="221.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="bold">noise 세기 0.02 를 섞고 VAE encoder</text>
  <text x="330.0" y="245.0" fill="#e2e8f0" font-size="12" text-anchor="middle">latent 4 × 72 × 128, 25 프레임에 복사</text>
  <line x1="455.0" y1="230.0" x2="520.0" y2="230.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="525.0" y="175.0" width="345.0" height="110.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="697.0" y="200.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="bold">channel 방향으로 이어 붙이기</text>
  <rect x="560.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <rect x="650.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="578.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <rect x="668.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="596.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <rect x="686.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <rect x="614.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <rect x="704.0" y="215.0" width="14.0" height="40.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="595.0" y="272.0" fill="#94a3b8" font-size="11" text-anchor="middle">noise latent 4</text>
  <text x="685.0" y="272.0" fill="#f59e0b" font-size="11" text-anchor="middle">그림 latent 4</text>
  <text x="790.0" y="240.0" fill="#e2e8f0" font-size="13" text-anchor="middle">= 8 channel</text>
  <text x="790.0" y="260.0" fill="#94a3b8" font-size="11" text-anchor="middle">프레임마다</text>
  <line x1="160.0" y1="250.0" x2="200.0" y2="360.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="205.0" y="320.0" width="250.0" height="80.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="330.0" y="344.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">숫자 조건 3 개</text>
  <text x="330.0" y="366.0" fill="#e2e8f0" font-size="12" text-anchor="middle">fps 6 · motion bucket 127</text>
  <text x="330.0" y="386.0" fill="#e2e8f0" font-size="12" text-anchor="middle">· noise 세기 0.02</text>
  <line x1="455.0" y1="360.0" x2="520.0" y2="360.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="525.0" y="320.0" width="345.0" height="80.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="697.0" y="344.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">하나에 256 개씩 sin·cos → 768 개</text>
  <text x="697.0" y="366.0" fill="#e2e8f0" font-size="12" text-anchor="middle">linear 2 층으로 1280 개로 바꿔</text>
  <text x="697.0" y="386.0" fill="#e2e8f0" font-size="12" text-anchor="middle">시각 t 의 embedding 에 더한다</text>
  <text x="450.0" y="438.0" fill="#94a3b8" font-size="12" text-anchor="middle">CLIP 쪽은 noise 를 섞지 않은 그림을, VAE 쪽은 noise 를 섞은 그림을 쓴다. guidance 의 조건 없는 예측은 CLIP vector 와 그림 latent 를 0 으로 둔다</text>
</svg>
