# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: patch-token
  title: pixel 대신 patch 를 token 으로 쓰는 이유
  variants:
    - question: |
        ViT 가 pixel 하나하나를 token 으로 쓰지 않고, 가로세로 여러 pixel 을 묶은 patch 를 token 으로 쓰는 이유는 무엇인가?
      choices:
        - 'Transformer 는 입력 token 수가 196 개로 정해져 있어서, 사진을 그 수에 맞춰 잘라야 하기 때문이다'
        - 'pixel 값은 정수라서 Transformer 가 받는 실수 vector 로 바꿀 수 없기 때문이다'
        - 'attention 점수 표가 token 수의 제곱으로 커지는데 pixel 은 너무 많고, pixel 하나에는 뜻이 거의 없기 때문이다'
        - 'patch 로 묶으면 사진의 정보가 압축되어, parameter 수가 pixel 수에 비례해 줄어들기 때문이다'
      answer: 2
      explanation: |
        attention 은 token 쌍마다 점수를 매기므로 token 이 N 개면 점수 표가 N × N 칸이다. 224×224 사진의 pixel 50,176 개를 token 으로 쓰면
        점수 표가 약 25억 칸이 되고, pixel 하나는 색 하나라 그것만으로는 무엇인지 알 수 없다. 16×16 patch 로 묶으면 token 이 196 개로 줄어 점수
        표가 38,416 칸이 되고, token 하나가 작은 모양을 담는다.
        Transformer 의 token 수는 정해져 있지 않으므로 첫째 보기는 틀렸다. pixel 값은 그대로 숫자라서 vector 로 쓸 수 있으므로 둘째 보기도
        틀렸다. 모든 patch 가 같은 행렬을 쓰므로 parameter 수는 patch 수와 관계없어서 넷째 보기의 이유는 성립하지 않는다.
    - question: |
        글을 읽도록 만든 Transformer 에 카메라 사진을 넣으려면, 사진을 어떤 형태로 바꿔야 하는가?
      choices:
        - '같은 길이의 vector 여러 개를 늘어놓은 목록으로 바꿔야 한다'
        - 'vocabulary 의 token 번호 목록으로 바꿔야 한다'
        - '흑백으로 바꾼 사진 한 장으로 바꿔야 한다'
        - 'convolution 을 여러 층 거친 feature map 한 장으로 바꿔야 한다'
      answer: 0
      explanation: |
        attention 은 같은 길이의 vector 목록만 있으면 계산할 수 있고, 그 vector 가 글에서 왔는지 사진에서 왔는지는 따지지 않는다. 그래서
        사진을 patch 로 잘라 patch 마다 vector 하나를 만들면 Transformer 를 그대로 쓸 수 있다.
        사진 조각은 pixel 값의 조합이 끝없이 많아 vocabulary 번호를 붙일 수 없으므로 둘째 보기는 틀렸다. 컬러 사진도 그대로 받으므로
        흑백으로 바꿔야 한다는 셋째 보기도 틀렸다. feature map 한 장은 그대로는 vector 목록이 아니므로 넷째 보기도 틀렸다.
    - question: |
        사진의 왼쪽 위 구석과 오른쪽 아래 구석의 관계를 첫 층에서 바로 계산할 수 있는 쪽은 3×3 convolution 의 CNN 과 ViT 중 어느 쪽인가?
      choices:
        - 'CNN 이다. filter 를 사진 전체에 밀어 가며 쓰므로 첫 층에서 모든 자리를 한 번에 보기 때문이다'
        - '둘 다 첫 층에서는 바로 이웃한 칸만 보고, 먼 칸의 관계는 다음 층에서 계산한다'
        - '어느 쪽도 못 한다. 둘 다 층을 수십 개 쌓아야만 두 구석이 한 계산에 들어온다'
        - 'ViT 다. 첫 층부터 patch 마다 모든 patch 와 attention 점수를 매긴다'
      answer: 3
      explanation: |
        ViT 의 self-attention 은 첫 층부터 모든 patch 쌍에 점수를 매기므로 멀리 떨어진 두 구석도 바로 만난다.
        CNN 의 3×3 filter 는 출력 한 칸을 계산할 때 가까운 9 칸만 보므로 첫째 보기는 틀렸다. 둘 다 첫 층에서는
        이웃한 칸만 본다는 둘째 보기는 CNN 에만 맞는 설명이다. 층을 많이 쌓아야 두 구석이 만난다는 셋째 보기도 CNN 에만 맞는다.

- topic: patch-embedding
  title: patch embedding 의 역할
  variants:
    - question: |
        ViT 는 펼친 patch 에 행렬 E 를 곱해 token 을 만들고 모든 patch 가 같은 E 를 쓴다. 사진을 키워 patch 수가 4 배가 되면 E 의 parameter 수는 어떻게 되는가?
      choices:
        - '4 배로 늘어난다'
        - '그대로다'
        - '16 배로 늘어난다'
        - '4 분의 1 로 줄어든다'
      answer: 1
      explanation: |
        모든 patch 가 같은 E 를 쓰므로 E 의 크기는 patch 하나의 숫자 수(channel × P × P)와 token 길이 D 로만 정해지고, patch 개수와는
        관계없다. 같은 filter 를 모든 자리에 쓰는 CNN 의 weight sharing 과 같은 성질이다.
        4 배라는 첫째 보기는 patch 마다 행렬을 따로 둔다고 착각한 답이다. 16 배라는 셋째 보기는 token 수의 제곱으로 커지는 attention
        점수 표와 헷갈린 답이다. patch 가 많아진다고 행렬이 작아질 이유도 없으므로 넷째 보기도 틀렸다.
    - question: |
        ViT 의 patch embedding 은 convolution 층 하나로 구현할 수 있다. 어떤 convolution 인가? patch 크기는 P 이다.
      choices:
        - 'filter 크기 3, stride 1 인 convolution 을 여러 층 쌓은 것'
        - 'filter 크기 P, stride 1 인 convolution 으로 patch 가 겹치게 읽는 것'
        - 'filter 크기 1, stride P 인 convolution'
        - 'filter 크기와 stride 가 모두 P 인 convolution'
      answer: 3
      explanation: |
        filter 크기와 stride 가 모두 P 이면 filter 가 겹치지 않고 patch 하나씩을 정확히 덮는다. filter 하나가 E 의 행 하나에 해당하고,
        filter 를 D 개 두면 출력의 한 자리에 patch 하나의 token 인 숫자 D 개가 나온다.
        3×3 convolution 을 쌓는 것은 CNN 의 구조라서 첫째 보기는 틀렸다. stride 1 이면 patch 가 겹쳐 출력 자리가 patch 수보다 훨씬
        많아지므로 둘째 보기도 틀렸다. filter 크기 1 이면 patch 안의 pixel 대부분을 보지 않으므로 셋째 보기도 틀렸다.
    - question: |
        ViT-B/16 은 숫자 768 개짜리 patch 를 숫자 768 개짜리 token 으로 바꾼다. 크기가 그대로인데도 patch embedding 이 필요한 이유는 무엇인가?
      choices:
        - '밝기 숫자를 학습으로 정한 기준들로 다시 적어, 모델이 쓰기 좋은 vector 로 바꾸기 위해서다'
        - 'patch 의 정보를 압축해 숫자 수를 줄여서, 뒤의 attention 계산을 가볍게 하기 위해서다'
        - '글의 token 처럼 patch 마다 vocabulary 번호를 붙여서 embedding 표에서 vector 를 찾기 위해서다'
        - 'patch 가 사진의 어느 자리에서 왔는지를 token 에 더해 순서를 알려 주기 위해서다'
      answer: 0
      explanation: |
        펼친 patch 는 pixel 마다 밝기를 적은 숫자일 뿐이라서, 학습으로 정하는 행렬 E 를 곱해 모델에 쓸모 있는 기준들로 다시 적는다.
        ViT-B/16 은 숫자 수를 줄이지 않으므로 압축이 목적이라는 둘째 보기는 틀렸다. 숫자를 너무 줄이면 서로 다른 patch 가 같은 vector
        가 되어 구별되지 않는다. patch 는 번호 대신 행렬 곱으로 vector 를 만들므로 셋째 보기도 틀렸다. 자리 정보를 더하는 일은 position
        embedding 이 맡으므로 넷째 보기도 틀렸다.

- topic: cls-token
  title: '[CLS] token 의 역할'
  variants:
    - question: |
        ViT 의 [CLS] token 은 무엇이고 어떻게 쓰이는가?
      choices:
        - '사진의 첫 번째 patch 를 펼친 vector 로, 왼쪽 위 구석의 정보만 따로 담아 둔다'
        - '사진마다 patch 들의 평균을 계산해 맨 앞에 넣는 vector 로, 처음부터 사진 전체를 요약한다'
        - 'class 이름을 글로 적은 token 으로, 학습할 때 정답을 함께 넣어 모델이 맞히게 돕는다'
        - 'patch token 앞에 붙이는 학습된 vector 로, 마지막 층의 이 자리 출력을 사진의 요약으로 쓴다'
      answer: 3
      explanation: |
        [CLS] 는 어느 patch 에도 해당하지 않는 학습된 vector 로, 모든 사진에서 같은 값으로 출발해 attention 으로 patch 들의 정보를 모은다.
        마지막 층의 [CLS] 출력이 head 로 들어가 class 점수를 낸다.
        [CLS] 는 patch 가 아니므로 첫째 보기는 틀렸다. 처음 값은 사진에서 계산하지 않고 학습으로 정하므로 둘째 보기도 틀렸다. 정답을
        입력으로 넣으면 학습이 의미가 없으므로 셋째 보기도 틀렸다.
    - question: |
        patch 196 개로 자른 사진에 [CLS] token 을 붙이면 Transformer 에 들어가는 token 은 몇 개이고, 나오는 token 은 몇 개인가?
      choices:
        - '들어가는 token 은 196 개이고 나오는 token 은 1 개다'
        - '들어가는 token 은 197 개이고 나오는 token 도 197 개다'
        - '들어가는 token 은 197 개이고 나오는 token 은 [CLS] 1 개뿐이다'
        - '들어가는 token 은 392 개이고 나오는 token 은 197 개다'
      answer: 1
      explanation: |
        [CLS] 1 개를 patch 196 개 앞에 붙이므로 197 개가 들어가고, Transformer encoder 의 층은 들어온 token 수만큼 내보내므로 197 개가
        나온다. 분류에는 그중 [CLS] 자리 하나만 꺼내 쓴다.
        [CLS] 를 붙이면 입력이 196 개일 수 없으므로 첫째 보기는 틀렸다. 층은 token 수를 줄이지 않으므로 셋째 보기도 틀렸다. [CLS] 는 하나만
        붙이므로 392 개라는 넷째 보기도 틀렸다.
    - question: |
        [CLS] token 없이 patch 출력들을 평균해서 분류하면 ViT 가 제대로 학습되지 않는가?
      choices:
        - '학습되지 않는다. attention 은 [CLS] 를 기준으로 점수를 매기므로 [CLS] 가 없으면 계산되지 않는다'
        - '학습되지 않는다. 평균을 내면 patch 마다 더한 position embedding 이 섞여 사라지기 때문이다'
        - '학습된다. ViT 논문은 learning rate 를 맞추면 평균으로도 [CLS] 와 비슷하게 잘 된다고 보고했다'
        - '학습되지만 [CLS] 처럼 요약을 맡은 자리가 없어서 정확도가 항상 절반 이하로 떨어진다'
      answer: 2
      explanation: |
        ViT 논문 부록에 따르면 patch 출력의 평균(global average pooling)으로 분류해도 learning rate 만 맞추면 [CLS] 와 비슷한 성능이
        나온다. [CLS] 는 글의 Transformer 와 같은 구조를 두려고 고른 방법이다.
        attention 은 patch token 끼리도 계산되므로 첫째 보기는 틀렸다. position embedding 은 입력에 더해진 뒤 층을 지나며 출력에 반영되므로
        둘째 보기도 틀렸다. 정확도가 절반 이하로 떨어진다는 넷째 보기는 근거가 없다.

- topic: position-embedding
  title: position embedding 이 필요한 이유
  variants:
    - question: |
        position embedding 을 빼면 ViT 에는 어떤 문제가 생기는가?
      choices:
        - 'patch 의 배치만 다른 두 사진에서 token 의 모음이 같아져, 모델이 두 사진을 구별하지 못한다'
        - 'patch embedding 이 자리 정보를 받아 계산하므로, patch embedding 을 계산할 수 없게 된다'
        - '자리를 모르는 token 끼리 모든 순서를 따져야 해서 attention 점수 표가 token 수의 세제곱으로 커진다'
        - '[CLS] 가 맨 앞 자리라는 것을 몰라서 [CLS] token 이 더 이상 학습되지 않는다'
      answer: 0
      explanation: |
        attention 의 점수와 가중 평균은 token 이 몇 번째 자리에 있는지를 보지 않는다. 그래서 위치 정보가 없으면 patch 의 자리만 바꾼 두
        사진이 같은 출력을 낸다. position embedding 은 자리마다 다른 vector 를 더해 이 문제를 막는다.
        patch embedding 은 위치와 관계없이 계산되므로 둘째 보기는 틀렸다. 점수 표 크기는 token 수의 제곱 그대로이므로 셋째 보기도 틀렸다.
        [CLS] 는 위치 정보가 없어도 학습되므로 넷째 보기도 틀렸다.
    - question: |
        ViT 의 position embedding 은 Transformer 원 논문의 positional encoding 과 무엇이 다른가?
      choices:
        - '둘 다 sin·cos 식으로 계산하고, ViT 는 그 값을 두 배로 키워 쓴다'
        - 'ViT 는 위치 정보를 token 에 더하지 않고 attention 점수에 곱한다'
        - 'ViT 는 sin·cos 식 대신 자리마다 한 행씩 둔 표를 무작위 값에서 출발해 학습으로 정한다'
        - 'ViT 의 position embedding 은 사람이 사진의 가로세로 좌표를 직접 적어 넣은 고정값이다'
      answer: 2
      explanation: |
        원 논문의 positional encoding 은 sin·cos 식으로 위치 vector 를 계산하지만, ViT 는 자리마다 vector 한 행씩을 두고 학습으로 정하는
        learned position embedding 을 token 에 더한다.
        ViT 는 sin·cos 식을 쓰지 않으므로 첫째 보기는 틀렸다. 위치 vector 를 token 에 더하는 방식이므로 둘째 보기도 틀렸다. 처음 값은
        무작위라서 학습 전에는 patch 사이의 이웃 관계를 담지 않으므로 넷째 보기도 틀렸다.
    - question: |
        224×224 사진, patch 16 으로 학습한 ViT 를 384×384 사진으로 fine-tuning 하려고 한다. position embedding 은 어떻게 하는가?
      choices:
        - '그대로 쓴다. position embedding 표의 행 수는 patch 수와 관계없이 정해져 있기 때문이다'
        - '원래 표의 vector 들을 사진 속 위치에 맞춰 2차원 interpolation 으로 늘려 쓴다'
        - 'patch 크기를 사진에 맞춰 키워서 patch 수를 원래와 같게 맞추고 표를 그대로 쓴다'
        - '원래 자리에는 원래 값을 쓰고, 새로 늘어난 자리에는 0 vector 를 더해 자리 정보 없이 둔다'
      answer: 1
      explanation: |
        patch 크기 16 은 그대로라서 patch 가 14×14 = 196 개에서 24×24 = 576 개로 늘고, 원래 표에는 196 자리뿐이다. ViT 논문에서는 원래 14×14
        격자의 vector 들을 새 격자 위치에 맞춰 주변 값을 섞는 2차원 interpolation 으로 늘려 쓴다.
        표의 행은 자리마다 하나라 patch 수와 직접 관계가 있으므로 첫째 보기는 틀렸다. 논문은 patch 크기를 그대로 두므로 셋째 보기도
        틀렸다. 0 vector 를 더하면 늘어난 자리들이 서로 구별되지 않으므로 넷째 보기도 틀렸다.

- topic: token-cost
  title: patch 크기와 계산량
  variants:
    - question: |
        같은 사진에서 patch 한 변을 절반으로 줄이면 token 수와 attention 점수 표의 크기는 어떻게 되는가?
      choices:
        - 'token 은 2 배가 되고 점수 표는 4 배가 된다'
        - 'token 은 4 배가 되고 점수 표는 그대로다'
        - 'token 은 4 배가 되고 점수 표는 16 배가 된다'
        - 'token 은 절반이 되고 점수 표는 4 분의 1 이 된다'
      answer: 2
      explanation: |
        patch 한 변을 절반으로 줄이면 가로세로 각각 patch 수가 2 배라 token 은 2 × 2 = 4 배가 된다. 점수 표는 token 쌍마다 한 칸이라
        token 수의 제곱인 4 × 4 = 16 배가 된다.
        첫째 보기는 한 방향의 patch 수만 센 답이다. 점수 표는 token 수에 따라 커지므로 둘째 보기는 틀렸다. patch 를 작게 자르면 token 이
        늘어나므로 넷째 보기도 틀렸다.
    - question: |
        patch 14 를 쓰는 image encoder 의 입력 사진을 224×224 에서 448×448 로 키우면 image token 수는 어떻게 되는가?
      choices:
        - '2 배가 된다'
        - '그대로다. patch 크기가 같기 때문이다'
        - '16 배가 된다'
        - '4 배가 된다'
      answer: 3
      explanation: |
        사진 한 변이 2 배가 되면 한 변의 patch 수가 16 개에서 32 개로 2 배라서 token 은 256 개에서 1,024 개로 2 × 2 = 4 배가 된다.
        사진 한 변이 다시 2 배가 되면 token 은 다시 4 배가 된다.
        첫째 보기는 한 방향만 센 답이다. patch 크기가 같아도 사진이 커지면 patch 수가 늘어나므로 둘째 보기는 틀렸다. 16 배라는 셋째 보기는
        token 수가 아니라 attention 점수 표가 늘어나는 배수다.
    - question: |
        ViT-L/16 과 ViT-L/32 는 층 수와 폭이 같고 patch 크기만 다르다. 224×224 사진에서 두 model 의 차이로 알맞은 것은?
      choices:
        - 'parameter 는 거의 같지만 L/16 의 token 이 4 배라서, attention 계산이 훨씬 많다'
        - 'patch 가 작은 L/16 은 parameter 가 4 배라서, 같은 데이터로 학습하기가 훨씬 어렵다'
        - 'patch 가 큰 L/32 는 사진 일부를 버리고 가운데 patch 만 보아서, 계산이 적다'
        - 'patch 크기가 달라도 token 수는 같고, patch 하나에 담기는 숫자만 다르다'
      answer: 0
      explanation: |
        한 변의 patch 수가 $224 \div 16 = 14$ 와 $224 \div 32 = 7$ 이라 token 은 196 개와 49 개로 4 배 차이 나고, attention 점수 표는 16 배
        차이 난다. 층 수와 폭이 같아 parameter 는 patch embedding 의 행렬 크기 차이 정도만 다르다. L/32 도 사진 전체를 patch 로 덮으므로 사진을
        버리지 않는다. patch 크기가 바뀌면 token 수가 바뀐다.

- topic: inductive-bias
  title: inductive bias 와 데이터 양
  variants:
    - question: |
        ViT 가 CNN 보다 학습 데이터를 훨씬 많이 봐야 하는 이유는 무엇인가?
      choices:
        - 'ViT 는 parameter 가 CNN 보다 항상 100 배 이상 많아서, 그만큼의 숫자를 채우려면 데이터가 더 필요하기 때문이다'
        - 'CNN 과 달리 ViT 는 locality 같은 가정이 구조에 거의 없어, 공간 관계까지 데이터에서 배워야 하기 때문이다'
        - 'ViT 는 컬러 사진을 처리하지 못해 흑백으로 바꾼 사진을 더 많이 봐야 하기 때문이다'
        - 'ViT 는 loss 대신 attention 점수만으로 학습해서, 한 장에서 배우는 양이 적기 때문이다'
      answer: 1
      explanation: |
        CNN 은 가까운 pixel 끼리 보고 같은 filter 를 모든 자리에 쓰는 가정(inductive bias)을 구조에 담고 있다. ViT 는 첫 층부터 모든 patch 를
        보고 position embedding 도 무작위에서 출발하므로, 이웃 관계까지 데이터에서 배워야 한다. 가정이 적으면 같은 데이터에 맞는 규칙이
        여럿이라 데이터가 많이 필요하다.
        ViT-B/16 의 parameter 는 약 8,660만 개로 ResNet-18 의 약 7 배이므로 100 배 이상이라는 첫째 보기는 틀렸다. ViT 는 컬러 사진을
        그대로 받으므로 셋째 보기도 틀렸다. ViT 도 loss 를 계산해 학습하므로 넷째 보기도 틀렸다.
    - question: |
        ImageNet 130만 장만으로 미리 학습하면 ViT-L/16 이 더 작은 ViT-B/16 보다 정확도가 낮다. 데이터가 3억 장이 되면 어떻게 되는가?
      choices:
        - '순서가 뒤집혀 ViT-L/16 이 ViT-B/16 보다 높아진다'
        - '두 모델 모두 오르지만 ViT-B/16 이 앞선 차이는 그대로 유지된다'
        - '데이터가 너무 많아 두 모델 모두 다 외우지 못하고 정확도가 떨어진다'
        - 'ViT-B/16 만 좋아지고 ViT-L/16 은 그대로다'
      answer: 0
      explanation: |
        ViT 논문에서 ImageNet 으로만 학습하면 ViT-L/16 이 76.53%, ViT-B/16 이 77.91% 였지만, JFT-300M(약 3억 장)에서는 87.12% 대 84.15% 로
        뒤집혔다. 가정이 적고 parameter 가 많은 모델일수록 데이터가 충분해야 능력이 드러난다.
        1.38%p 뒤처지던 ViT-L/16 이 2.97%p 앞서게 되므로 차이가 그대로라는 둘째 보기는 틀렸다. ViT-B/16 도 77.91% 에서 84.15% 로
        오르므로 두 모델 모두 떨어진다는 셋째 보기도 틀렸다. ViT-L/16 은 76.53% 에서 87.12% 로 더 크게 오르므로 넷째 보기도 틀렸다.
    - question: |
        사진과 설명 글 4 억 쌍으로 학습한 CLIP 에서는 CLIP 의 ViT 가 CLIP 의 ResNet 보다 같은 성능을 내는 데 계산이 약 3 배 덜 들었다. 이 결과를 가장 잘 설명하는 것은?
      choices:
        - 'ResNet 은 사진을 숫자 vector 로 바꿀 수 없어서, 글과 짝을 맞추는 학습에는 쓸 수 없기 때문이다'
        - 'ViT 는 parameter 가 ResNet 보다 언제나 적어서, 어떤 데이터에서든 계산이 덜 들기 때문이다'
        - 'CNN 은 inductive bias 가 없어 데이터에 맞춰 자유롭게 배우므로 데이터가 많을 때 불리하기 때문이다'
        - '데이터가 적으면 가정이 담긴 CNN 이 유리하고, 아주 많으면 가정이 적은 ViT 가 앞서기 때문이다'
      answer: 3
      explanation: |
        ViT 논문은 작은 데이터에서는 convolution 의 inductive bias 가 도움이 되고, 큰 데이터에서는 패턴을 데이터에서 바로 배우는 편이
        낫다고 정리했다. 4 억 쌍은 아주 큰 데이터라 CLIP 에서 ViT 가 앞선 것도 이 결과와 맞는다. CLIP 은 ResNet 으로도 사진을 vector 로
        바꿔 학습했으므로 첫째 보기는 틀렸다. ViT 가 언제나 parameter 가 적은 것은 아니다. CNN 은 inductive bias 가 많은 쪽이므로 셋째 보기도
        틀렸다.

- topic: dit-patch-output
  title: DiT 가 patch 출력 전부를 쓰는 이유
  variants:
    - question: |
        분류용 ViT 는 [CLS] 출력 하나만 head 에 넣지만, 그림을 그리는 DiT 는 patch 출력 전부를 쓴다. 그 이유는 무엇인가?
      choices:
        - 'noise 를 걷어 내려면 latent 의 자리마다 섞인 noise 를 맞혀야 해서, 자리마다 출력이 있어야 하기 때문이다'
        - 'DiT 에는 [CLS] token 을 붙이는 단계가 없어서, 남은 patch 출력이라도 모두 써야 하기 때문이다'
        - 'patch 출력을 모두 쓰면 token 수가 줄어 attention 계산이 [CLS] 하나를 쓸 때보다 가벼워지기 때문이다'
        - '[CLS] 출력은 class 를 맞히는 데만 쓸 수 있어서, 그림을 그리는 model 에서는 계산할 수 없기 때문이다'
      answer: 0
      explanation: |
        DiT 의 출력은 입력 latent 와 같은 크기의 noise 다. 마지막 block 뒤에서 token 하나하나를 $p \times p$ noise 조각으로 바꾸고 원래 자리에
        늘어놓으므로, token 이 저마다 latent 의 한 구역을 맡는다. [CLS] 를 붙이지 않는 것은 결과이지 이유가 아니다. 쓰는 출력이 많다고
        attention 계산이 줄지 않는다. [CLS] 출력도 계산은 할 수 있지만 자리마다 다른 noise 를 담지 못한다.
    - question: |
        256×256 사진의 latent 는 32×32×4 다. patch 크기 2 인 DiT-XL/2 에 넣으면 token 은 몇 개인가?
      choices:
        - '16 개. 32 를 2 로 나눈 한 변의 patch 수만 센다'
        - '256 개. 한 변의 patch 수 16 을 제곱한다'
        - '1,024 개. latent 의 칸 수 32 × 32 를 그대로 쓴다'
        - '4,096 개. 칸 수 1,024 에 channel 4 를 곱한다'
      answer: 1
      explanation: |
        한 변의 patch 수는 $32 \div 2 = 16$ 이고 token 은 $16 \times 16 = 256$ 개다. patch 하나는 $2 \times 2 \times 4 = 16$ 개 숫자를 담아
        token 하나가 된다. 16 은 한 방향만 센 값이다. 1,024 는 patch 크기 1 로 칸마다 token 을 만든 경우의 수다. channel 은 token 하나
        안에 들어가므로 token 수를 늘리지 않는다.
    - question: |
        DiT 는 마지막 Transformer block 뒤에서 token 을 어떻게 다시 noise 로 바꾸는가?
      choices:
        - 'token 전부를 평균 내 숫자 하나로 만든 뒤, 그 숫자를 latent 의 모든 칸에 똑같이 채운다'
        - '[CLS] 출력 하나를 linear 층에 넣어 latent 전체 크기의 noise 를 한꺼번에 만든다'
        - 'token 하나하나를 linear 층으로 $p \times p$ noise 조각으로 바꾸고, 조각을 원래 자리에 늘어놓는다'
        - 'token 을 다시 VAE decoder 에 넣어 512×512 그림으로 바꾼 뒤 그 차이를 noise 로 쓴다'
      answer: 2
      explanation: |
        DiT 논문은 마지막 LayerNorm 뒤에 linear decoder 를 두어 token 마다 $p \times p$ 조각(과 channel)을 만들고, 조각을 원래 자리로 다시
        늘어놓아 입력과 같은 크기의 출력을 만든다. 평균을 내면 자리마다 다른 noise 를 낼 수 없다. DiT 는 [CLS] 를 쓰지 않는다. VAE decoder 는
        noise 를 다 걷어 낸 뒤 마지막에 한 번만 쓰고, DiT 의 출력은 latent 크기의 noise 다.

- topic: dit-patch-size
  title: DiT 의 patch 크기와 계산량
  variants:
    - question: |
        DiT-XL 을 patch 크기 8, 4, 2 로 학습했더니 parameter 는 약 6.75 억 개로 거의 같았는데 FID 는 106.41, 43.01, 19.47 로 좋아졌다. 무엇이 달라졌기 때문인가?
      choices:
        - 'patch 가 작을수록 parameter 가 크게 늘어서, 더 많은 숫자로 그림을 배웠기 때문이다'
        - 'patch 가 작을수록 token 이 늘어 계산량이 7.39 에서 118.64 Gflops 로 커졌기 때문이다'
        - 'patch 가 작을수록 학습 step 을 더 많이 해서, 학습이 더 오래 이어졌기 때문이다'
        - 'patch 가 작을수록 VAE 가 latent 를 더 크게 만들어, 그림의 정보가 늘었기 때문이다'
      answer: 1
      explanation: |
        patch 한 변을 절반으로 줄이면 token 이 4 배(16 → 64 → 256)가 되고 계산량도 약 4 배씩 는다. 논문은 parameter 가 거의 같아도 계산량이
        늘면 FID 가 좋아진다는 점에서 계산량이 품질을 정한다고 정리했다. parameter 는 세 model 이 거의 같으므로 크게 늘지 않았다.
        세 model 은 모두 400K step 을 학습했다. latent 는 patch 크기와 상관없이 VAE 가 정한 32×32×4 그대로다.
    - question: |
        patch 크기를 그대로 두고 사진을 256×256 에서 512×512 로 키우면 DiT 의 token 수와 attention 점수 표는 각각 몇 배가 되는가?
      choices:
        - 'token 2 배, 점수 표 4 배. 사진 한 변이 2 배라서다'
        - 'token 4 배, 점수 표 4 배. 점수 표는 token 수에 비례한다'
        - 'token 4 배, 점수 표 16 배. 점수 표는 token 수의 제곱이다'
        - 'token 1 배, 점수 표 1 배. patch 크기가 같으면 token 도 같다'
      answer: 2
      explanation: |
        latent 가 $32 \times 32$ 에서 $64 \times 64$ 로 한 변이 2 배라서 patch 2 일 때 token 은 256 개에서 1,024 개로 4 배가 된다. 점수 표는
        token 끼리 모두 짝지어 $256^2$ 에서 $1{,}024^2$ 으로 16 배다. token 2 배는 한 방향만 센 값이다. 점수 표는 token 수에
        비례하지 않고 token 수의 제곱에 비례한다. patch 크기가 같아도 latent 가 커지면 patch 수가 늘어난다.
    - question: |
        DiT 논문은 계산량이 작은 model 이 그림을 뽑을 때 step 수를 늘려도 큰 model 을 따라잡지 못한다고 보고했다. 이 결과가 말하는 것은?
      choices:
        - '그림을 뽑는 step 수를 늘리면 언제나 model 을 키운 것과 같은 효과가 난다'
        - 'step 수는 그림 품질과 관계가 없어서, 몇 step 으로 뽑든 FID 가 같다'
        - 'step 하나를 계산하는 model 의 크기가 모자라면, step 을 많이 밟아도 그 차이를 메우지 못한다'
        - '작은 model 은 step 을 늘릴수록 오히려 FID 가 나빠져서, step 을 줄여야 한다'
      answer: 2
      explanation: |
        논문에서 DiT-L/2 가 1000 step 으로 그림 한 장에 80.7 Tflops 를 써도, 128 step 으로 15.2 Tflops 를 쓴 DiT-XL/2 보다 FID 가 나빴다(25.9
        대 23.7). step 을 늘리면 작은 model 도 좋아지지만 큰 model 과의 차이를 메우지는 못했으므로, step 을 늘리는 것이 model 을
        키우는 것과 같지 않다. step 수를 바꾸면 FID 도 바뀌므로 step 수는 품질과 관계가 있다. 작은 model 도 step 을 늘리면 FID 가
        좋아졌으므로 나빠진다는 보기도 틀렸다.
