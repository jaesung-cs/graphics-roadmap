<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Pyramid Attention Broadcast. 출력이 거의 바뀌지 않는 가운데 구간에서 attention 의 출력을 몇 step 에 한 번만 계산하고 나머지 step 에는 그 값을 다시 쓴다. 가운데 20 step 에서 범위 2 인 spatial attention 은 10 번, 범위 4 인 temporal attention 은 5 번, 범위 6 인 cross attention 은 4 번 계산한다</title>
