<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>LTX-Video 의 생성. Transformer 가 latent 에서 noise 를 줄여 가다가, 마지막 한 step 은 decoder 가 맡는다. decoder 는 시각 t 와 noise 가 조금 남은 latent 를 받아 바로 깨끗한 pixel 을 낸다. 시각 0.05 에서 원래 값 0.8, noise −1.2 이면 0.95 × 0.8 + 0.05 × (−1.2) = 0.70 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="898" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="450.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">마지막 step 을 맡는 decoder (LTX-Video)</text>
  <rect x="40.0" y="80.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95.0" y="110.0" fill="#e2e8f0" font-size="13" text-anchor="middle">noise</text>
  <text x="95.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">t = 1</text>
  <line x1="152.0" y1="115.0" x2="186.0" y2="115.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <rect x="190.0" y="80.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="245.0" y="110.0" fill="#e2e8f0" font-size="13" text-anchor="middle">latent</text>
  <text x="245.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">t = 0.6</text>
  <line x1="302.0" y1="115.0" x2="336.0" y2="115.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <rect x="340.0" y="80.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="395.0" y="110.0" fill="#e2e8f0" font-size="13" text-anchor="middle">latent</text>
  <text x="395.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">t = 0.2</text>
  <line x1="452.0" y1="115.0" x2="486.0" y2="115.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <rect x="490.0" y="80.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="545.0" y="110.0" fill="#e2e8f0" font-size="13" text-anchor="middle">latent</text>
  <text x="545.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">t = 0.05</text>
  <text x="265.0" y="175.0" fill="#38bdf8" font-size="12" text-anchor="middle">Transformer 가 latent 에서 latent 로 (128 channel, 32×32×8 압축)</text>
  <line x1="602.0" y1="115.0" x2="660.0" y2="115.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="665.0" y="70.0" width="200.0" height="90.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="765.0" y="100.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">denoising decoder</text>
  <text x="765.0" y="122.0" fill="#e2e8f0" font-size="12" text-anchor="middle">t 를 함께 받아</text>
  <text x="765.0" y="142.0" fill="#e2e8f0" font-size="12" text-anchor="middle">깨끗한 pixel 을 바로 낸다</text>
  <rect x="40.0" y="210.0" width="820.0" height="140.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="450.0" y="236.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="bold">decoder 가 받는 값: 원래 latent 와 noise 를 시각 t 만큼 섞은 값</text>
  <text x="450.0" y="264.0" fill="#e2e8f0" font-size="13" text-anchor="middle">(1 − t) × 원래 값 + t × noise   →   t = 0.05, 원래 값 0.8, noise −1.2</text>
  <text x="450.0" y="292.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0.95 × 0.8 + 0.05 × (−1.2) = 0.76 − 0.06 = 0.70  (원래 값보다 0.10 작다)</text>
  <text x="450.0" y="322.0" fill="#94a3b8" font-size="12" text-anchor="middle">decoder 는 t 를 0 ~ 0.2 에서 뽑아 학습하고, pixel 의 loss 로 세부까지 맞춘다</text>
</svg>
