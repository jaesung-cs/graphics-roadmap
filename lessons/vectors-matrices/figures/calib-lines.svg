  <text x="650.0" y="312.0" fill="#64748b" font-size="11" text-anchor="end">s (pixel/cm)</text>
  <text x="402.0" y="42.0" fill="#64748b" font-size="11" text-anchor="end">c</text>
  <line x1="70.0" y1="111.7" x2="310.0" y2="207.1" stroke="#f59e0b" stroke-width="2.2"/>
  <line x1="70.0" y1="55.6" x2="258.2" y2="280.0" stroke="#38bdf8" stroke-width="2.2"/>
  <line x1="70.0" y1="55.0" x2="258.7" y2="280.0" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="140.6" cy="139.8" r="5" fill="#34d399"/>
  <text x="150.6" y="129.8" fill="#34d399" font-size="11" text-anchor="start">(5, 100) → (5.05, 99.5)</text>
  <text x="197.1" y="146.2" fill="#f59e0b" font-size="11" text-anchor="start">10s + c = 150</text>
  <text x="81.3" y="271.2" fill="#38bdf8" font-size="11" text-anchor="start">30s + c = 250</text>
  <line x1="410.0" y1="111.7" x2="650.0" y2="207.1" stroke="#f59e0b" stroke-width="3.2"/>
  <line x1="410.0" y1="111.4" x2="650.0" y2="207.7" stroke="#38bdf8" stroke-width="1.4"/>
  <line x1="410.0" y1="110.9" x2="650.0" y2="207.2" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="480.6" cy="139.8" r="5" fill="#34d399"/>
  <circle cx="621.8" cy="195.9" r="5" fill="#f87171"/>
  <text x="488.6" y="127.8" fill="#34d399" font-size="11" text-anchor="start">정확히 읽음 (5, 100)</text>
  <text x="617.8" y="217.9" fill="#f87171" font-size="11" text-anchor="end">1 칸 틀림 (15, 0)</text>
  <text x="418.5" y="257.6" fill="#94a3b8" font-size="11" text-anchor="start">두 직선이 거의 겹친다</text>
  <text x="340.0" y="346.0" fill="#94a3b8" font-size="11" text-anchor="middle">주황: 첫째 눈금의 식 · 파랑: 둘째 눈금의 식(점선은 pixel 을 1 칸 틀린 경우) · 교점이 답 (s, c)</text>
</svg>
