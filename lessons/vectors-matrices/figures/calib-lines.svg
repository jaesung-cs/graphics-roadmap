  <text x="140.6" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">5</text>
  <line x1="211.2" y1="280.0" x2="211.2" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="211.2" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">10</text>
