  <text x="62.0" y="199.9" fill="#64748b" font-size="11" text-anchor="end">0</text>
  <line x1="70.0" y1="139.8" x2="310.0" y2="139.8" stroke="#1e293b" stroke-width="1"/>
  <text x="62.0" y="143.8" fill="#64748b" font-size="11" text-anchor="end">100</text>
  <line x1="70.0" y1="83.7" x2="310.0" y2="83.7" stroke="#1e293b" stroke-width="1"/>
