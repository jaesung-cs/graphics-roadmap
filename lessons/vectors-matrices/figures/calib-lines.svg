  <text x="62.0" y="42.0" fill="#64748b" font-size="11" text-anchor="end">c</text>
  <line x1="410.0" y1="280.0" x2="410.0" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="410.0" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <line x1="480.6" y1="280.0" x2="480.6" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="480.6" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">5</text>
  <line x1="551.2" y1="280.0" x2="551.2" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="551.2" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">10</text>
  <line x1="621.8" y1="280.0" x2="621.8" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="621.8" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">15</text>
  <line x1="410.0" y1="252.0" x2="650.0" y2="252.0" stroke="#1e293b" stroke-width="1"/>
  <text x="402.0" y="256.0" fill="#64748b" font-size="11" text-anchor="end">−100</text>
  <line x1="410.0" y1="195.9" x2="650.0" y2="195.9" stroke="#1e293b" stroke-width="1"/>
  <text x="402.0" y="199.9" fill="#64748b" font-size="11" text-anchor="end">0</text>
