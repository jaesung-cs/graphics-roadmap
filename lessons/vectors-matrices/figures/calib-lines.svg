<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>눈금 계산의 두 식을 (s, c) 평면의 직선으로 그린 모습. 눈금이 10 cm 와 30 cm 면 두 직선이 뚜렷하게 만나 pixel 1 칸 오차에도 교점이 (5, 100) 에서 (5.05, 99.5) 로 조금 움직이고, 10 cm 와 10.1 cm 면 두 직선이 거의 겹쳐 교점이 (15, 0) 까지 옮겨 간다</title>
  <defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="678" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="70.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">눈금 10 cm 와 30 cm</text>
  <text x="410.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">눈금 10 cm 와 10.1 cm</text>
  <line x1="70.0" y1="280.0" x2="70.0" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="70.0" y="296.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
