<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>조명이 바로 위에 있을 때 평평한 바닥과 30° 기운 경사면의 밝기. 바닥의 normal vector (0, 1) 과 빛 방향 (0, 1) 의 dot product 는 1 이라 밝기 255, 경사면의 normal vector (−0.5, 0.866) 과의 dot product 는 0.866 이라 밝기 221 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="678" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="60.0" y1="40.0" x2="60.0" y2="90.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="110.0" y1="40.0" x2="110.0" y2="90.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="160.0" y1="40.0" x2="160.0" y2="90.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="230.0" y1="40.0" x2="230.0" y2="90.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="280.0" y1="40.0" x2="280.0" y2="90.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="330.0" y1="40.0" x2="330.0" y2="90.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="195.0" y="30.0" fill="#f59e0b" font-size="12" text-anchor="middle">조명 (빛이 바로 위에서 내려온다)</text>
  <line x1="30.0" y1="290.0" x2="170.0" y2="290.0" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="190.0" y1="290.0" x2="337.2" y2="205.0" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="190.0" y1="290.0" x2="260.0" y2="290.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M236,290 A46,46 0 0,0 229.8,267.0" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="248.0" y="282.0" fill="#94a3b8" font-size="11" text-anchor="start">30°</text>
  <line x1="100.0" y1="290.0" x2="100.0" y2="200.0" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="108.0" y="220.0" fill="#34d399" font-size="12" text-anchor="start">n = (0, 1)</text>
  <line x1="263.6" y1="247.5" x2="218.6" y2="169.6" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="213.6" y="155.5" fill="#38bdf8" font-size="12" text-anchor="end">n = (−0.5, 0.866)</text>
  <text x="100.0" y="308.0" fill="#e2e8f0" font-size="12" text-anchor="middle">평평한 바닥</text>
  <text x="270.0" y="308.0" fill="#e2e8f0" font-size="12" text-anchor="middle">30° 경사면</text>
  <rect x="40.0" y="316.0" width="120.0" height="14.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
  <text x="100.0" y="347.0" fill="#94a3b8" font-size="11" text-anchor="middle">밝기 255</text>
  <rect x="210.0" y="316.0" width="120.0" height="14.0" rx="0" fill="#dddddd" stroke="none" stroke-width="1"/>
  <text x="270.0" y="347.0" fill="#94a3b8" font-size="11" text-anchor="middle">밝기 221</text>
  <text x="420.0" y="70.0" fill="#f59e0b" font-size="13" text-anchor="start">빛이 오는 쪽 l = (0, 1)</text>
  <text x="420.0" y="120.0" fill="#34d399" font-size="13" text-anchor="start" font-weight="600">바닥</text>
  <text x="420.0" y="144.0" fill="#e2e8f0" font-size="12" text-anchor="start">n · l = 0 × 0 + 1 × 1 = 1</text>
  <text x="420.0" y="166.0" fill="#94a3b8" font-size="12" text-anchor="start">→ 1 × 255 = 255</text>
  <text x="420.0" y="214.0" fill="#38bdf8" font-size="13" text-anchor="start" font-weight="600">30° 경사면</text>
  <text x="420.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="start">n · l = −0.5 × 0 + 0.866 × 1</text>
  <text x="420.0" y="258.0" fill="#e2e8f0" font-size="12" text-anchor="start">= 0.866</text>
  <text x="420.0" y="280.0" fill="#94a3b8" font-size="12" text-anchor="start">→ 0.866 × 255 ≈ 221</text>
</svg>
