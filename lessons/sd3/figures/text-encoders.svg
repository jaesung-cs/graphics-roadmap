<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CLIP ViT-L 의 77×768 과 OpenCLIP ViT-bigG 의 77×1280 을 이어 붙인 77×2048 을 0 으로 채워 77×4096 으로 만들고, T5-XXL 의 256×4096 과 세로로 쌓아 333×4096 을 만든 뒤 Linear 로 333×1536 글 token 을 만든다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="818" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="400" y="30" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">세 text encoder 가 만드는 글 token 333 개</text>
  <rect x="30" y="60" width="190" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="125" y="82" fill="#38bdf8" font-size="13" text-anchor="middle">CLIP ViT-L</text>
  <text x="125" y="99" fill="#94a3b8" font-size="11" text-anchor="middle">끝에서 둘째 층 77 × 768</text>
  <rect x="30" y="125" width="190" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="125" y="147" fill="#38bdf8" font-size="13" text-anchor="middle">OpenCLIP ViT-bigG</text>
  <text x="125" y="164" fill="#94a3b8" font-size="11" text-anchor="middle">끝에서 둘째 층 77 × 1280</text>
  <line x1="220" y1="85" x2="262" y2="108" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <line x1="220" y1="150" x2="262" y2="128" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <rect x="265" y="92" width="150" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="340" y="114" fill="#e2e8f0" font-size="12" text-anchor="middle">이어 붙이기</text>
  <text x="340" y="131" fill="#38bdf8" font-size="12" text-anchor="middle">77 × 2048</text>
  <line x1="415" y1="117" x2="452" y2="117" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="455" y="92" width="160" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="535" y="114" fill="#e2e8f0" font-size="12" text-anchor="middle">뒤를 0 으로 채우기</text>
  <text x="535" y="131" fill="#38bdf8" font-size="12" text-anchor="middle">77 × 4096</text>
  <rect x="30" y="200" width="190" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="125" y="222" fill="#f59e0b" font-size="13" text-anchor="middle">T5-XXL encoder</text>
  <text x="125" y="239" fill="#94a3b8" font-size="11" text-anchor="middle">마지막 층 256 × 4096</text>
  <line x1="220" y1="225" x2="452" y2="225" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="455" y="200" width="160" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="535" y="222" fill="#e2e8f0" font-size="12" text-anchor="middle">T5 token</text>
  <text x="535" y="239" fill="#f59e0b" font-size="12" text-anchor="middle">256 × 4096</text>
  <line x1="615" y1="117" x2="650" y2="150" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <line x1="615" y1="225" x2="650" y2="190" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="652" y="140" width="130" height="60" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="717" y="163" fill="#e2e8f0" font-size="12" text-anchor="middle">세로로 쌓기</text>
  <text x="717" y="182" fill="#a78bfa" font-size="13" text-anchor="middle">333 × 4096</text>
  <line x1="717" y1="200" x2="717" y2="262" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-p)"/>
  <rect x="632" y="264" width="170" height="50" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="717" y="286" fill="#e2e8f0" font-size="12" text-anchor="middle">Linear 4096 → 1536</text>
  <text x="717" y="303" fill="#a78bfa" font-size="12" text-anchor="middle">글 token 333 × 1536</text>
  <text x="30" y="290" fill="#94a3b8" font-size="12" text-anchor="start">pooled vector: CLIP 두 개의 768 + 1280 = 2048 → 시각 쪽 조건으로</text>
  <text x="30" y="310" fill="#94a3b8" font-size="12" text-anchor="start">T5 를 빼면 T5 자리 256 × 4096 을 모두 0 으로 채운다</text>
</svg>
