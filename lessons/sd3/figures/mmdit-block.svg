<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SDXL 의 cross-attention 은 그림 token 이 글 token 을 읽기만 하고 글 token 은 그대로다. SD3 의 MMDiT block 은 그림 token 4,096 개와 글 token 333 개가 각자의 weight 로 Q·K·V 를 만들어 4,429 개를 한 attention 에 넣고, 다시 나뉘어 각자의 MLP 를 지난다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="838" height="428" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="420" y="30" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">cross-attention 과 MMDiT block</text>
  <rect x="20" y="50" width="300" height="360" rx="8" fill="#0e1628" stroke="#1e293b" stroke-width="1.6"/>
  <text x="170" y="75" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="bold">SDXL 의 cross-attention</text>
  <rect x="40" y="100" width="120" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="100" y="127" fill="#38bdf8" font-size="13" text-anchor="middle">그림 token</text>
  <rect x="180" y="100" width="120" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="240" y="127" fill="#f59e0b" font-size="13" text-anchor="middle">글 token</text>
  <line x1="100" y1="144" x2="100" y2="200" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <text x="88" y="178" fill="#38bdf8" font-size="12" text-anchor="end">Q</text>
  <line x1="240" y1="144" x2="160" y2="200" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <text x="214" y="178" fill="#f59e0b" font-size="12" text-anchor="start">K, V</text>
  <rect x="40" y="202" width="160" height="44" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="120" y="229" fill="#a78bfa" font-size="13" text-anchor="middle">attention</text>
  <line x1="100" y1="246" x2="100" y2="300" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <rect x="40" y="302" width="120" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="100" y="329" fill="#38bdf8" font-size="13" text-anchor="middle">바뀐 그림 token</text>
  <line x1="240" y1="144" x2="240" y2="302" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="180" y="302" width="120" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="240" y="329" fill="#f59e0b" font-size="13" text-anchor="middle">글 token 그대로</text>
  <text x="170" y="375" fill="#94a3b8" font-size="12" text-anchor="middle">글은 그림을 보지 못하고</text>
  <text x="170" y="393" fill="#94a3b8" font-size="12" text-anchor="middle">모든 층에 같은 값으로 들어간다</text>
  <rect x="340" y="50" width="480" height="360" rx="8" fill="#0e1628" stroke="#1e293b" stroke-width="1.6"/>
  <text x="580" y="75" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="bold">SD3 의 MMDiT block</text>
  <rect x="370" y="100" width="170" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="455" y="120" fill="#38bdf8" font-size="13" text-anchor="middle">그림 token 4,096 개</text>
  <text x="455" y="136" fill="#94a3b8" font-size="11" text-anchor="middle">× 1536</text>
  <rect x="620" y="100" width="170" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="705" y="120" fill="#f59e0b" font-size="13" text-anchor="middle">글 token 333 개</text>
  <text x="705" y="136" fill="#94a3b8" font-size="11" text-anchor="middle">× 1536</text>
  <line x1="455" y1="144" x2="455" y2="166" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <line x1="705" y1="144" x2="705" y2="166" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="370" y="168" width="170" height="34" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="455" y="190" fill="#e2e8f0" font-size="12" text-anchor="middle">그림용 Q·K·V weight</text>
  <rect x="620" y="168" width="170" height="34" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="705" y="190" fill="#e2e8f0" font-size="12" text-anchor="middle">글용 Q·K·V weight</text>
  <line x1="455" y1="202" x2="520" y2="226" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <line x1="705" y1="202" x2="640" y2="226" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="460" y="228" width="240" height="44" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="580" y="248" fill="#a78bfa" font-size="13" text-anchor="middle">하나로 이어 붙인 attention</text>
  <text x="580" y="264" fill="#94a3b8" font-size="11" text-anchor="middle">token 4,096 + 333 = 4,429 개</text>
  <line x1="520" y1="272" x2="455" y2="296" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <line x1="640" y1="272" x2="705" y2="296" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="370" y="298" width="170" height="34" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="455" y="320" fill="#e2e8f0" font-size="12" text-anchor="middle">그림용 출력·MLP weight</text>
  <rect x="620" y="298" width="170" height="34" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="705" y="320" fill="#e2e8f0" font-size="12" text-anchor="middle">글용 출력·MLP weight</text>
  <text x="580" y="360" fill="#94a3b8" font-size="12" text-anchor="middle">두 줄기가 attention 에서만 만나고, 글 token 도 층마다 바뀐다</text>
  <text x="580" y="380" fill="#94a3b8" font-size="12" text-anchor="middle">block 하나의 weight 84,980,736 개 = 그림 쪽 절반 + 글 쪽 절반</text>
</svg>
