<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>MMDiT 의 attention 점수 표 4,429 × 4,429 를 네 구역으로 나눈 모습. 그림끼리 16,777,216, 그림 Q 와 글 K 1,363,968, 글 Q 와 그림 K 1,363,968, 글끼리 110,889 이고 합은 19,616,041 이다. SDXL 의 cross-attention 은 그림 Q 와 글 K 구역만 계산한다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="798" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="400" y="30" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">token 4,429 개가 만드는 점수 표 4,429 × 4,429</text>
  <rect x="100" y="70" width="277.4441183111312" height="277.4441183111312" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.35"/>
  <rect x="377.4441183111312" y="70" width="22.555881688868794" height="277.4441183111312" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.55"/>
  <rect x="100" y="347.4441183111312" width="277.4441183111312" height="22.555881688868794" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.55"/>
  <rect x="377.4441183111312" y="347.4441183111312" width="22.555881688868794" height="22.555881688868794" fill="#a78bfa" stroke="#a78bfa" stroke-width="1" fill-opacity="0.8"/>
  <text x="238.7220591555656" y="208.7220591555656" fill="#e2e8f0" font-size="14" text-anchor="middle">그림 → 그림</text>
  <text x="238.7220591555656" y="228.7220591555656" fill="#38bdf8" font-size="13" text-anchor="middle">16,777,216</text>
  <text x="90" y="208.7220591555656" fill="#94a3b8" font-size="11" text-anchor="end">그림 Q 4,096</text>
  <text x="90" y="363.4441183111312" fill="#94a3b8" font-size="11" text-anchor="end">글 Q 333</text>
  <text x="238.7220591555656" y="62" fill="#94a3b8" font-size="11" text-anchor="middle">그림 K 4,096</text>
  <text x="404" y="62" fill="#94a3b8" font-size="11" text-anchor="start">글 K 333</text>
  <rect x="460" y="90" width="18" height="18" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.35"/>
  <text x="488" y="103" fill="#e2e8f0" font-size="12" text-anchor="start">그림 Q × 그림 K</text>
  <text x="488" y="122" fill="#38bdf8" font-size="12" text-anchor="start">4,096 × 4,096 = 16,777,216</text>
  <rect x="460" y="148" width="18" height="18" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.55"/>
  <text x="488" y="161" fill="#e2e8f0" font-size="12" text-anchor="start">그림 Q × 글 K (SDXL 의 cross-attention 은 이것만)</text>
  <text x="488" y="180" fill="#f59e0b" font-size="12" text-anchor="start">4,096 × 333 = 1,363,968</text>
  <rect x="460" y="206" width="18" height="18" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.55"/>
  <text x="488" y="219" fill="#e2e8f0" font-size="12" text-anchor="start">글 Q × 그림 K (글이 그림을 읽는 자리)</text>
  <text x="488" y="238" fill="#34d399" font-size="12" text-anchor="start">333 × 4,096 = 1,363,968</text>
  <rect x="460" y="264" width="18" height="18" fill="#a78bfa" stroke="#a78bfa" stroke-width="1" fill-opacity="0.8"/>
  <text x="488" y="277" fill="#e2e8f0" font-size="12" text-anchor="start">글 Q × 글 K</text>
  <text x="488" y="296" fill="#a78bfa" font-size="12" text-anchor="start">333 × 333 = 110,889</text>
  <text x="460" y="335" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="bold">합: 4,429 × 4,429 = 19,616,041</text>
</svg>
