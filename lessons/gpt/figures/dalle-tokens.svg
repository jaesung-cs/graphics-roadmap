<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>DALL·E 의 그림 생성. 설명 글은 BPE token 최대 256 개로 바뀌어 앞에 놓이고, Transformer 가 그림 token 을 하나씩 1,024 번 골라 32×32 격자를 채운다. 다 채운 격자를 dVAE decoder 가 256×256 그림으로 되살린다</title>
