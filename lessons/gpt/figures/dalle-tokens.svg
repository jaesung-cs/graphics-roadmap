  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="40.0" fill="#94a3b8" font-size="12" text-anchor="start">한 줄로 이은 token</text>
  <rect x="24.0" y="54.0" width="56.0" height="32.0" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52.0" y="75.0" fill="#e2e8f0" font-size="11" text-anchor="middle">a</text>
  <rect x="86.0" y="54.0" width="56.0" height="32.0" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
