<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>chunk 단위의 causal attention. 줄은 query 의 chunk, 칸은 key 의 chunk 다. 같은 chunk 안과 앞 chunk 는 볼 수 있고(칠한 칸), 뒤 chunk 는 볼 수 없다. 생성할 때는 앞 chunk 의 key 와 value 를 저장해 두는 KV cache 로 새 chunk 의 query 만 계산한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="858" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="430.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">chunk 단위로 앞만 보는 attention (CausVid)</text>
  <text x="108.0" y="120.0" fill="#e2e8f0" font-size="12" text-anchor="end">chunk 1</text>
  <rect x="120.0" y="90.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="170.0" y="90.0" width="46.0" height="46.0" rx="0" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <rect x="220.0" y="90.0" width="46.0" height="46.0" rx="0" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <rect x="270.0" y="90.0" width="46.0" height="46.0" rx="0" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="108.0" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="end">chunk 2</text>
  <rect x="120.0" y="140.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="170.0" y="140.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="220.0" y="140.0" width="46.0" height="46.0" rx="0" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <rect x="270.0" y="140.0" width="46.0" height="46.0" rx="0" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="108.0" y="220.0" fill="#e2e8f0" font-size="12" text-anchor="end">chunk 3</text>
  <rect x="120.0" y="190.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="170.0" y="190.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="220.0" y="190.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="270.0" y="190.0" width="46.0" height="46.0" rx="0" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="108.0" y="270.0" fill="#e2e8f0" font-size="12" text-anchor="end">chunk 4</text>
  <rect x="120.0" y="240.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="170.0" y="240.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="220.0" y="240.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <rect x="270.0" y="240.0" width="46.0" height="46.0" rx="0" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.7"/>
  <text x="143.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="193.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="243.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="middle">3</text>
  <text x="293.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="middle">4</text>
  <text x="218.0" y="312.0" fill="#94a3b8" font-size="12" text-anchor="middle">key 의 chunk</text>
  <text x="50.0" y="60.0" fill="#94a3b8" font-size="12" text-anchor="start">query ↓</text>
  <rect x="400.0" y="80.0" width="430.0" height="230.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="615.0" y="106.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">생성: chunk 4 를 만들 때</text>
  <rect x="430.0" y="126.0" width="60.0" height="34.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <text x="460.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">chunk 1</text>
  <rect x="500.0" y="126.0" width="60.0" height="34.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <text x="530.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">chunk 2</text>
  <rect x="570.0" y="126.0" width="60.0" height="34.0" rx="0" fill="#111a2e" stroke="#94a3b8" stroke-width="1"/>
  <text x="600.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">chunk 3</text>
  <rect x="640.0" y="126.0" width="60.0" height="34.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.5"/>
  <text x="670.0" y="148.0" fill="#e2e8f0" font-size="11" text-anchor="middle">chunk 4</text>
  <text x="565.0" y="180.0" fill="#94a3b8" font-size="11" text-anchor="middle">저장한 key·value (KV cache)</text>
  <text x="670.0" y="180.0" fill="#34d399" font-size="11" text-anchor="middle">새로 계산</text>
  <text x="615.0" y="214.0" fill="#e2e8f0" font-size="12" text-anchor="middle">앞 chunk 는 다시 계산하지 않고</text>
  <text x="615.0" y="236.0" fill="#e2e8f0" font-size="12" text-anchor="middle">새 chunk 의 query 가 저장한 key 를 읽는다</text>
  <text x="615.0" y="266.0" fill="#94a3b8" font-size="12" text-anchor="middle">CausVid: chunk = latent 프레임 5 개, chunk 마다 4 step</text>
  <text x="615.0" y="288.0" fill="#94a3b8" font-size="12" text-anchor="middle">첫 chunk 까지 1.3 초, 그 뒤 약 9.4 FPS (H100)</text>
  <text x="430.0" y="360.0" fill="#94a3b8" font-size="12" text-anchor="middle">뒤를 보지 않으므로 앞 chunk 를 다 만들기 전에 화면에 내보낼 수 있다</text>
</svg>
