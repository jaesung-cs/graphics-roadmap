<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Diffusion Forcing 의 sampling. 프레임마다 noise 크기가 다르다. 처음에는 세 프레임이 모두 noise 1 이고, 다음에는 프레임 1 을 0 으로, 프레임 2 를 0.5 로 줄이고, 그다음 프레임 2 를 0, 프레임 3 을 0.5 로, 마지막에 모두 0 으로 만든다. 가까운 미래일수록 먼저 확실해진다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="858" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="430.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">Diffusion Forcing: 프레임마다 다른 noise 크기</text>
  <text x="170.0" y="108.0" fill="#e2e8f0" font-size="13" text-anchor="end">단계 1</text>
  <rect x="200.0" y="80.0" width="100.0" height="40.0" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.75"/>
  <text x="250.0" y="106.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 1</text>
  <rect x="320.0" y="80.0" width="100.0" height="40.0" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.75"/>
  <text x="370.0" y="106.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 1</text>
  <rect x="440.0" y="80.0" width="100.0" height="40.0" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.75"/>
  <text x="490.0" y="106.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 1</text>
  <text x="170.0" y="164.0" fill="#e2e8f0" font-size="13" text-anchor="end">단계 2</text>
  <rect x="200.0" y="136.0" width="100.0" height="40.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.75"/>
  <text x="250.0" y="162.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0</text>
  <rect x="320.0" y="136.0" width="100.0" height="40.0" rx="0" fill="#7c5a1a" stroke="#7c5a1a" stroke-width="1" fill-opacity="0.75"/>
  <text x="370.0" y="162.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0.5</text>
  <rect x="440.0" y="136.0" width="100.0" height="40.0" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.75"/>
  <text x="490.0" y="162.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 1</text>
  <text x="170.0" y="220.0" fill="#e2e8f0" font-size="13" text-anchor="end">단계 3</text>
  <rect x="200.0" y="192.0" width="100.0" height="40.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.75"/>
  <text x="250.0" y="218.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0</text>
  <rect x="320.0" y="192.0" width="100.0" height="40.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.75"/>
  <text x="370.0" y="218.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0</text>
  <rect x="440.0" y="192.0" width="100.0" height="40.0" rx="0" fill="#7c5a1a" stroke="#7c5a1a" stroke-width="1" fill-opacity="0.75"/>
  <text x="490.0" y="218.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0.5</text>
  <text x="170.0" y="276.0" fill="#e2e8f0" font-size="13" text-anchor="end">단계 4</text>
  <rect x="200.0" y="248.0" width="100.0" height="40.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.75"/>
  <text x="250.0" y="274.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0</text>
  <rect x="320.0" y="248.0" width="100.0" height="40.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.75"/>
  <text x="370.0" y="274.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0</text>
  <rect x="440.0" y="248.0" width="100.0" height="40.0" rx="0" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity="0.75"/>
  <text x="490.0" y="274.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 0</text>
  <text x="250.0" y="72.0" fill="#94a3b8" font-size="12" text-anchor="middle">프레임 1</text>
  <text x="370.0" y="72.0" fill="#94a3b8" font-size="12" text-anchor="middle">프레임 2</text>
  <text x="490.0" y="72.0" fill="#94a3b8" font-size="12" text-anchor="middle">프레임 3</text>
  <rect x="600.0" y="80.0" width="230.0" height="210.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="715.0" y="106.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="bold">학습</text>
  <text x="715.0" y="132.0" fill="#e2e8f0" font-size="12" text-anchor="middle">프레임마다 noise 크기를</text>
  <text x="715.0" y="154.0" fill="#e2e8f0" font-size="12" text-anchor="middle">따로 뽑아 섞는다</text>
  <text x="715.0" y="196.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">생성</text>
  <text x="715.0" y="222.0" fill="#e2e8f0" font-size="12" text-anchor="middle">앞 프레임을 먼저 줄이고</text>
  <text x="715.0" y="244.0" fill="#e2e8f0" font-size="12" text-anchor="middle">다 만든 프레임은 noise 를</text>
  <text x="715.0" y="266.0" fill="#e2e8f0" font-size="12" text-anchor="middle">조금 남긴 채 조건으로 쓴다</text>
  <text x="430.0" y="340.0" fill="#94a3b8" font-size="12" text-anchor="middle">noise 를 섞는 것을 부분적으로 가리는 것으로 보면, model 은 어떤 프레임이 얼마나 가려져 있어도 되살리는 법을 배운다</text>
</svg>
