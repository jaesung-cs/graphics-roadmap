<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>FramePack 의 context. 만들 프레임에 가장 가까운 프레임은 token 1,560 개를 그대로 쓰고, 그 앞 프레임은 780 개, 390 개, 195 개로 절반씩 줄인다. 앞 프레임이 아무리 많아도 합은 1,560 × 2 = 3,120 개를 넘지 않는다. 줄이지 않으면 10 프레임만으로 15,600 개다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="878" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="440.0" y="32.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">FramePack: 오래된 프레임일수록 token 을 줄이기</text>
  <rect x="619.4" y="70.0" width="210.6" height="40.0" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.7"/>
  <text x="724.7" y="95.0" fill="#e2e8f0" font-size="12" text-anchor="middle">만들 프레임</text>
  <rect x="392.8" y="70.0" width="210.6" height="40.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.7"/>
  <text x="498.1" y="95.0" fill="#e2e8f0" font-size="11" text-anchor="middle">1,560</text>
  <rect x="281.5" y="70.0" width="105.3" height="40.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.62"/>
  <text x="334.1" y="95.0" fill="#e2e8f0" font-size="11" text-anchor="middle">780</text>
  <rect x="222.8" y="70.0" width="52.6" height="40.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.5399999999999999"/>
  <text x="249.2" y="95.0" fill="#e2e8f0" font-size="11" text-anchor="middle">390</text>
  <rect x="190.5" y="70.0" width="26.3" height="40.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.45999999999999996"/>
  <rect x="171.3" y="70.0" width="13.2" height="40.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.37999999999999995"/>
  <rect x="158.7" y="70.0" width="6.6" height="40.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.29999999999999993"/>
  <text x="148.7" y="95.0" fill="#94a3b8" font-size="14" text-anchor="end">…</text>
  <text x="498.0" y="130.0" fill="#94a3b8" font-size="12" text-anchor="middle">가장 가까운 프레임</text>
  <text x="300.0" y="130.0" fill="#94a3b8" font-size="12" text-anchor="middle">← 오래된 프레임</text>
  <rect x="40.0" y="160.0" width="800.0" height="196.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="440.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">프레임 하나의 token: 480p 에서 약 1,560 개 (HunyuanVideo·Wan)</text>
  <text x="440.0" y="216.0" fill="#38bdf8" font-size="13" text-anchor="middle">가까운 순서로 1,560 · 780 · 390 · 195 · … (절반씩)</text>
  <text x="440.0" y="244.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">합 = 1,560 × (1 + 1/2 + 1/4 + …) &lt; 1,560 × 2 = 3,120</text>
  <text x="440.0" y="276.0" fill="#94a3b8" font-size="12" text-anchor="middle">줄이지 않으면 앞 프레임 10 개만으로 1,560 × 10 = 15,600 개, 100 개면 156,000 개</text>
  <text x="440.0" y="304.0" fill="#94a3b8" font-size="12" text-anchor="middle">줄이는 방법: Transformer 입구의 patch 크기를 키운다 (예: 2 × 4 × 4 = 32 칸을 token 하나로)</text>
  <text x="440.0" y="332.0" fill="#94a3b8" font-size="12" text-anchor="middle">그래서 video 가 길어져도 한 번에 계산하는 token 수가 거의 그대로다</text>
</svg>
