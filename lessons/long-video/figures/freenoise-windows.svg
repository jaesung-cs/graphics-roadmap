  <text x="544.8" y="230.0" fill="#94a3b8" font-size="11" text-anchor="start">… 창 13 개 (마지막 창은 프레임 48 ~ 63)</text>
  <rect x="40.0" y="252.0" width="820.0" height="126.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450.0" y="276.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="bold">프레임 10 의 출력 = 세 창의 출력을 창 가운데에 가까울수록 크게 섞는다</text>
  <text x="450.0" y="302.0" fill="#e2e8f0" font-size="12" text-anchor="middle">창 가운데 7.5 · 11.5 · 15.5 → 거리 2.5 · 1.5 · 5.5 → 무게 8 − 거리 = 5.5 · 6.5 · 2.5 (합 14.5)</text>
  <text x="450.0" y="326.0" fill="#e2e8f0" font-size="12" text-anchor="middle">창의 출력 0.4 · 0.6 · 0.9 → (5.5 × 0.4 + 6.5 × 0.6 + 2.5 × 0.9) ÷ 14.5 ≈ 0.58</text>
  <text x="450.0" y="352.0" fill="#94a3b8" font-size="12" text-anchor="middle">자리 하나의 점수: 64² = 4,096 개 대신 창 13 개 × 16² = 3,328 개, 창마다 학습 때와 같은 16 프레임</text>
