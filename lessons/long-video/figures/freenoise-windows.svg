  <title>FreeNoise 의 창. 64 프레임을 16 프레임 창으로 4 프레임씩 옮겨 가며 13 개 창에서 temporal attention 을 계산한다. 프레임 10 은 0, 4, 8 에서 시작하는 세 창에 들어가고, 창 가운데 7.5, 11.5, 15.5 까지의 거리 2.5, 1.5, 5.5 로 무게 5.5, 6.5, 2.5 를 받는다. 세 창의 출력 0.4, 0.6, 0.9 를 이 무게로 섞으면 약 0.58 이다</title>
