<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>왼쪽은 그림의 정보가 두 부분으로 나뉘는 모습이다. 숫자 대부분은 눈에 띄지 않는 세밀한 무늬로 지각 압축이 덜어 내는 부분이고, 적은 부분이 무엇이 어디에 있는지를 정하는 의미다. 오른쪽은 autoencoder 가 앞부분을, diffusion 이 뒷부분을 맡는 latent diffusion 의 분업이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#94a3b8" font-size="13" text-anchor="start">그림을 저장하는 숫자</text>
  <rect x="24.0" y="50.0" width="300.0" height="40.0" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.3"/>
  <rect x="24.0" y="50.0" width="300.0" height="40.0" rx="0" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="174.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">눈에 띄지 않는 세밀한 무늬</text>
  <rect x="324.0" y="50.0" width="60.0" height="40.0" rx="0" fill="#a78bfa" stroke="none" stroke-width="1" fill-opacity="0.4"/>
  <rect x="324.0" y="50.0" width="60.0" height="40.0" rx="0" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="354.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">의미</text>
  <text x="174.0" y="112.0" fill="#f59e0b" font-size="12" text-anchor="middle">지각 압축이 덜어 낸다</text>
  <text x="354.0" y="112.0" fill="#a78bfa" font-size="12" text-anchor="middle">의미 압축</text>
  <text x="24.0" y="160.0" fill="#94a3b8" font-size="13" text-anchor="start">latent diffusion 의 분업</text>
  <rect x="24.0" y="176.0" width="220.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="134.0" y="202.0" fill="#e2e8f0" font-size="13" text-anchor="middle">autoencoder (한 번 학습)</text>
  <text x="134.0" y="222.0" fill="#94a3b8" font-size="11" text-anchor="middle">세밀한 무늬를 줄이고 되살린다</text>
  <line x1="246.0" y1="208.0" x2="290.0" y2="208.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="294.0" y="176.0" width="220.0" height="64.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="404.0" y="202.0" fill="#e2e8f0" font-size="13" text-anchor="middle">diffusion (latent 위)</text>
  <text x="404.0" y="222.0" fill="#94a3b8" font-size="11" text-anchor="middle">무엇이 어디에 있는지를 배운다</text>
  <rect x="540.0" y="50.0" width="156.0" height="190.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="618.0" y="110.0" fill="#94a3b8" font-size="12" text-anchor="middle">pixel 위의</text>
  <text x="618.0" y="130.0" fill="#94a3b8" font-size="12" text-anchor="middle">diffusion 은</text>
  <text x="618.0" y="150.0" fill="#94a3b8" font-size="12" text-anchor="middle">두 일을</text>
  <text x="618.0" y="170.0" fill="#94a3b8" font-size="12" text-anchor="middle">한 network 가</text>
  <text x="618.0" y="190.0" fill="#94a3b8" font-size="12" text-anchor="middle">모든 pixel 에서 한다</text>
</svg>
