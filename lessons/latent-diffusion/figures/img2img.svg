<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>그림에서 출발하는 생성. 밑그림 → encoder → × 0.18215 → strength 0.8 만큼 noise 섞기 → 남은 40 step 의 U-Net → ÷ 0.18215 → decoder → 새 그림</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="738" height="228" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="76.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">밑그림</text>
  <text x="76.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">512×512×3</text>
  <rect x="142.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="194.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">encoder</text>
  <text x="194.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">× 0.18215</text>
  <line x1="130.0" y1="90.0" x2="140.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="312.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">noise 섞기</text>
  <text x="312.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">step 781 까지</text>
  <line x1="248.0" y1="90.0" x2="258.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="378.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="430.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">U-Net</text>
  <text x="430.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">남은 40 step</text>
  <line x1="366.0" y1="90.0" x2="376.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="496.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="548.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">decoder</text>
  <text x="548.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">÷ 0.18215</text>
  <line x1="484.0" y1="90.0" x2="494.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="614.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
