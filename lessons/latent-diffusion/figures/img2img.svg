  <line x1="602.0" y1="90.0" x2="612.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24.0" y="40.0" fill="#94a3b8" font-size="12" text-anchor="start">strength 0.8 · DDIM 50 step 기준</text>
  <text x="370.0" y="160.0" fill="#94a3b8" font-size="12" text-anchor="middle">건너뛰는 10 step: U-Net 을 쓰지 않는다</text>
  <text x="370.0" y="186.0" fill="#a78bfa" font-size="12" text-anchor="middle">원래 값의 몫 0.208 · noise 의 몫 0.978 에서 출발</text>
