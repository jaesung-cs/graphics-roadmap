<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>LDM 논문 표 8 의 PSNR 과 그림 6 의 결론. f 가 4, 8, 16, 32 로 커지면 되살린 그림의 PSNR 이 27.53, 24.19, 21.94, 22.27 dB 이다. f = 1, 2 는 학습이 느리고, f = 32 는 품질이 일찍 멈추며, f = 4 ~ 16 이 효율과 품질의 균형을 맞춘다. 2M step 뒤 FID 는 LDM-1 과 LDM-8 사이에 38 차이가 난다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#94a3b8" font-size="13" text-anchor="start">되살린 그림의 PSNR (dB, 표 8, KL autoencoder)</text>
  <rect x="70.0" y="117.3" width="70.0" height="122.7" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.35"/>
  <rect x="70.0" y="117.3" width="70.0" height="122.7" rx="0" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="105.0" y="109.3" fill="#34d399" font-size="13" text-anchor="middle">27.53</text>
  <text x="105.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f = 4 · c 3</text>
  <rect x="230.0" y="140.7" width="70.0" height="99.3" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.35"/>
  <rect x="230.0" y="140.7" width="70.0" height="99.3" rx="0" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="265.0" y="132.7" fill="#34d399" font-size="13" text-anchor="middle">24.19</text>
  <text x="265.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f = 8 · c 4</text>
  <rect x="390.0" y="156.4" width="70.0" height="83.6" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.35"/>
  <rect x="390.0" y="156.4" width="70.0" height="83.6" rx="0" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="425.0" y="148.4" fill="#34d399" font-size="13" text-anchor="middle">21.94</text>
  <text x="425.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f = 16 · c 8</text>
  <rect x="550.0" y="154.1" width="70.0" height="85.9" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.35"/>
  <rect x="550.0" y="154.1" width="70.0" height="85.9" rx="0" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="585.0" y="146.1" fill="#f59e0b" font-size="13" text-anchor="middle">22.27</text>
  <text x="585.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">f = 32 · c 64</text>
  <line x1="50.0" y1="240.0" x2="690.0" y2="240.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="185.0" y="290.0" fill="#34d399" font-size="12" text-anchor="middle">f = 4 ~ 16: 효율과 품질의 균형 (그림 6)</text>
  <text x="585.0" y="290.0" fill="#f59e0b" font-size="12" text-anchor="middle">f = 32: 품질이 일찍 멈춤</text>
  <text x="360.0" y="310.0" fill="#94a3b8" font-size="11" text-anchor="middle">f = 1, 2 는 학습이 느리다 · 2M step 뒤 FID 차이 LDM-1 대 LDM-8 = 38</text>
</svg>
