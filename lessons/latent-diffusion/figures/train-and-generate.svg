<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 학습 한 step 으로 그림 → encoder → × 0.18215 → noise 섞기 → U-Net → loss 이고, 아래는 생성으로 N(0, 1) 의 64×64×4 → U-Net 50 번 → ÷ 0.18215 → decoder → 512×512×3 그림이다. encoder 는 학습에만, decoder 는 생성의 마지막에 한 번만 쓴다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="738" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#38bdf8" font-size="13" text-anchor="start">학습 한 step</text>
  <rect x="24.0" y="50.0" width="104.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="76.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">그림</text>
  <text x="76.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">512×512×3</text>
  <rect x="142.0" y="50.0" width="104.0" height="56.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="194.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">encoder</text>
  <text x="194.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">고정</text>
  <line x1="130.0" y1="78.0" x2="140.0" y2="78.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260.0" y="50.0" width="104.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="312.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">× 0.18215</text>
  <text x="312.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">z</text>
  <line x1="248.0" y1="78.0" x2="258.0" y2="78.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="378.0" y="50.0" width="104.0" height="56.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">noise 섞기</text>
  <text x="430.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">x_t, t</text>
  <line x1="366.0" y1="78.0" x2="376.0" y2="78.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="496.0" y="50.0" width="104.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="548.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">U-Net</text>
  <text x="548.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">noise 예측</text>
  <line x1="484.0" y1="78.0" x2="494.0" y2="78.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="614.0" y="50.0" width="104.0" height="56.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="666.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">loss</text>
  <text x="666.0" y="94.0" fill="#94a3b8" font-size="11" text-anchor="middle">(ε − 예측)²</text>
  <line x1="602.0" y1="78.0" x2="612.0" y2="78.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24.0" y="160.0" fill="#f59e0b" font-size="13" text-anchor="start">생성</text>
  <rect x="24.0" y="176.0" width="124.0" height="56.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="86.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="middle">N(0, 1)</text>
  <text x="86.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">64×64×4</text>
  <rect x="166.0" y="176.0" width="124.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="228.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="middle">U-Net</text>
  <text x="228.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">50 번</text>
  <line x1="150.0" y1="204.0" x2="164.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="308.0" y="176.0" width="124.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="370.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="middle">÷ 0.18215</text>
  <text x="370.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">latent</text>
  <line x1="292.0" y1="204.0" x2="306.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450.0" y="176.0" width="124.0" height="56.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="512.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="middle">decoder</text>
  <text x="512.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">한 번</text>
  <line x1="434.0" y1="204.0" x2="448.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="592.0" y="176.0" width="124.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="654.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="middle">그림</text>
  <text x="654.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">512×512×3</text>
  <line x1="576.0" y1="204.0" x2="590.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370.0" y="272.0" fill="#94a3b8" font-size="12" text-anchor="middle">encoder 는 학습에만 쓰고, 생성은 decoder 를 마지막에 한 번 쓴다</text>
</svg>
