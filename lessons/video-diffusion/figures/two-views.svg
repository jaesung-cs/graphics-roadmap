  <circle cx="720.0" cy="205.0" r="8" fill="#f59e0b" fill-opacity="0.85"/>
  <line x1="700.0" y1="205.0" x2="712.0" y2="205.0" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="748.0" cy="205.0" r="8" fill="#f59e0b" fill-opacity="0.85"/>
  <line x1="728.0" y1="205.0" x2="740.0" y2="205.0" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="776.0" cy="205.0" r="8" fill="#f59e0b" fill-opacity="0.85"/>
  <line x1="756.0" y1="205.0" x2="768.0" y2="205.0" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="682.0" y="235.0" fill="#94a3b8" font-size="11" text-anchor="middle">같은 자리의 프레임끼리</text>
  <text x="40.0" y="330.0" fill="#94a3b8" font-size="12" text-anchor="start">reshape 만 바꿔 끼우므로 이미지 layer 의 weight 는 그대로 쓴다. 노란 칸 하나가 시간 layer 의 줄 하나다</text>
</svg>
