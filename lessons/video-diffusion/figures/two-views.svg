  <rect x="682.0" y="80.0" width="22.0" height="22.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="710.0" y="80.0" width="22.0" height="22.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="738.0" y="80.0" width="22.0" height="22.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="766.0" y="80.0" width="22.0" height="22.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="682.0" y="125.0" fill="#94a3b8" font-size="11" text-anchor="middle">프레임마다 따로</text>
  <line x1="270.0" y1="200.0" x2="320.0" y2="215.0" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="325.0" y="175.0" width="220.0" height="90.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="435.0" y="199.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="bold">시간 layer 가 보는 모양</text>
  <text x="435.0" y="221.0" fill="#e2e8f0" font-size="12" text-anchor="middle">자리마다 길이 16 의 줄 (b·h·w, f, c)</text>
  <text x="435.0" y="241.0" fill="#94a3b8" font-size="11" text-anchor="middle">64 × 64 = 4,096 줄</text>
