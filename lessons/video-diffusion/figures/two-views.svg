<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>16 × 4 × 64 × 64 video latent 를 이미지 layer 는 그림 16 장의 batch 로, 시간 layer 는 자리마다 길이 16 인 줄 4,096 개로 읽는다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="818" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="410.0" y="30.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">같은 video latent 를 두 방향으로 읽기</text>
  <rect x="40.0" y="70.0" width="120.0" height="120.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="54.0" y="80.0" width="120.0" height="120.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="68.0" y="90.0" width="120.0" height="120.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="82.0" y="100.0" width="120.0" height="120.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="96.0" y="110.0" width="120.0" height="120.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="110.0" y="120.0" width="120.0" height="120.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="166.0" y="176.0" width="8.0" height="8.0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
  <text x="150.0" y="262.0" fill="#e2e8f0" font-size="13" text-anchor="middle">latent 16 × 4 × 64 × 64</text>
  <text x="150.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">(512×512 그림 16 장)</text>
  <text x="150.0" y="300.0" fill="#94a3b8" font-size="11" text-anchor="middle">숫자 262,144 개 = 그림 한 장의 16 배</text>
  <line x1="270.0" y1="110.0" x2="320.0" y2="100.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <rect x="325.0" y="60.0" width="220.0" height="90.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="435.0" y="84.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="bold">이미지 layer 가 보는 모양</text>
  <text x="435.0" y="106.0" fill="#e2e8f0" font-size="12" text-anchor="middle">그림 16 장의 batch (b·f, c, h, w)</text>
  <text x="435.0" y="126.0" fill="#94a3b8" font-size="11" text-anchor="middle">한 장 안에서만 계산</text>
  <rect x="570.0" y="80.0" width="22.0" height="22.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
  <rect x="598.0" y="80.0" width="22.0" height="22.0" fill="#111a2e" stroke="#38bdf8" stroke-width="1"/>
