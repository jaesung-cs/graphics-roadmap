<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>AnimateDiff 는 1. 이미지 attention 에 LoRA 인 domain adapter 를 video 프레임으로 학습해 video 의 화질을 맡기고, 2. 이미지 layer 를 고정한 채 프레임끼리의 Transformer 인 motion module 을 학습하고, 3. 선택으로 MotionLoRA 로 카메라 움직임을 더한다. 생성할 때는 다른 SD 1.5 model 에 motion module 을 끼운다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="858" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="430.0" y="30.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">AnimateDiff 의 세 단계와 생성</text>
  <rect x="30.0" y="60.0" width="255.0" height="130.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="157.0" y="86.0" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="bold">1. domain adapter</text>
  <text x="157.0" y="114.0" fill="#e2e8f0" font-size="12" text-anchor="middle">이미지 attention 에 LoRA</text>
  <text x="157.0" y="136.0" fill="#94a3b8" font-size="12" text-anchor="middle">video 의 프레임을 그림처럼 학습</text>
  <text x="157.0" y="158.0" fill="#94a3b8" font-size="12" text-anchor="middle">흐림·watermark 같은 video 의 화질을 맡는다</text>
  <line x1="287.0" y1="125.0" x2="303.0" y2="125.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="305.0" y="60.0" width="255.0" height="130.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="432.0" y="86.0" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="bold">2. motion module</text>
  <text x="432.0" y="114.0" fill="#e2e8f0" font-size="12" text-anchor="middle">프레임끼리의 Transformer</text>
  <text x="432.0" y="136.0" fill="#94a3b8" font-size="12" text-anchor="middle">이미지 layer 와 adapter 는 고정</text>
  <text x="432.0" y="158.0" fill="#94a3b8" font-size="12" text-anchor="middle">16 프레임, 256×256 video</text>
  <line x1="562.0" y1="125.0" x2="578.0" y2="125.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="580.0" y="60.0" width="255.0" height="130.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.6"/>
  <text x="707.0" y="86.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="bold">3. MotionLoRA (선택)</text>
  <text x="707.0" y="114.0" fill="#e2e8f0" font-size="12" text-anchor="middle">motion module 에 LoRA</text>
  <text x="707.0" y="136.0" fill="#94a3b8" font-size="12" text-anchor="middle">참고 video 20 ~ 50 개</text>
  <text x="707.0" y="158.0" fill="#94a3b8" font-size="12" text-anchor="middle">zoom·pan 같은 카메라 움직임</text>
  <rect x="30.0" y="220.0" width="800.0" height="140.0" rx="8" fill="#0e1628" stroke="#1e293b" stroke-width="1.6"/>
  <text x="50.0" y="246.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="bold">생성할 때</text>
  <rect x="60.0" y="262.0" width="220.0" height="70.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="170.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">다른 사람이 미세조정한</text>
  <text x="170.0" y="308.0" fill="#a78bfa" font-size="12" text-anchor="middle">SD 1.5 model (그림체)</text>
  <text x="300.0" y="302.0" fill="#e2e8f0" font-size="22" text-anchor="middle">+</text>
  <rect x="320.0" y="262.0" width="200.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="420.0" y="290.0" fill="#38bdf8" font-size="13" text-anchor="middle">motion module</text>
  <text x="420.0" y="308.0" fill="#94a3b8" font-size="11" text-anchor="middle">학습 없이 끼운다</text>
  <text x="540.0" y="302.0" fill="#e2e8f0" font-size="22" text-anchor="middle">=</text>
  <rect x="560.0" y="262.0" width="250.0" height="70.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.6"/>
  <text x="685.0" y="290.0" fill="#34d399" font-size="13" text-anchor="middle">그 그림체로 움직이는 video</text>
  <text x="685.0" y="308.0" fill="#94a3b8" font-size="11" text-anchor="middle">domain adapter 는 빼거나 줄인다</text>
</svg>
