<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 skip connection 에 OpenPose ControlNet 과 depth ControlNet 의 출력을 각자의 세기로 더하는 모습. 원래 값 0.7 에 1.0 × 0.4 와 0.5 × 0.2 를 더해 1.2 가 된다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">여러 ControlNet 을 한 skip connection 에 더하기</text>
  <rect x="40" y="70" width="170" height="56" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.6"/>
  <text x="125" y="94" fill="#cbd5e1" font-size="12" text-anchor="middle">고정한 U-Net 의 값</text>
  <text x="125" y="114" fill="#e2e8f0" font-size="14" text-anchor="middle">0.7</text>
  <rect x="40" y="150" width="170" height="56" rx="8" fill="#13233d" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="125" y="174" fill="#38bdf8" font-size="12" text-anchor="middle">OpenPose ControlNet</text>
  <text x="125" y="194" fill="#e2e8f0" font-size="12" text-anchor="middle">0.4 × 세기 1.0 = 0.4</text>
  <rect x="40" y="220" width="170" height="50" rx="8" fill="#10291f" stroke="#34d399" stroke-width="1.6"/>
  <text x="125" y="241" fill="#34d399" font-size="12" text-anchor="middle">depth ControlNet</text>
  <text x="125" y="259" fill="#e2e8f0" font-size="12" text-anchor="middle">0.2 × 세기 0.5 = 0.1</text>
  <circle cx="330" cy="168" r="20" fill="#111a2e" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="330" y="174" fill="#f59e0b" font-size="18" text-anchor="middle">+</text>
  <line x1="212" y1="98" x2="310" y2="150.5" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <line x1="212" y1="178" x2="310" y2="170.5" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <line x1="212" y1="245" x2="310" y2="187.25" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <line x1="352" y1="168" x2="430" y2="168" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="432" y="140" width="250" height="56" rx="8" fill="#1f1a10" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="557" y="164" fill="#f59e0b" font-size="12" text-anchor="middle">skip connection 에 들어가는 값</text>
  <text x="557" y="184" fill="#e2e8f0" font-size="14" text-anchor="middle">0.7 + 0.4 + 0.1 = 1.2</text>
</svg>
