<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>zero convolution 의 두 step. 첫 step 에는 w = (0, 0) 이라 출력이 0 이고 w 의 gradient 는 g × x = (1.0, −0.5) 지만 복사본 쪽 gradient 는 (0, 0) 이다. 한 번 고친 뒤 w = (−0.1, 0.05) 가 되어 출력이 −0.30 이 되고 복사본 쪽 gradient 가 (−0.05, 0.025) 로 생긴다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">zero convolution 의 두 step (입력 x = (2, −1), 출력에 대한 gradient g = +0.5)</text>
  <rect x="40" y="52" width="300" height="236" rx="8" fill="#0e1628" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="190" y="78" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="600">첫 step</text>
  <rect x="60" y="96" width="80" height="40" rx="8" fill="#13233d" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="100" y="121" fill="#38bdf8" font-size="12" text-anchor="middle">복사본</text>
  <line x1="140" y1="116" x2="168" y2="116" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <text x="154" y="108" fill="#94a3b8" font-size="11" text-anchor="middle">x</text>
  <rect x="170" y="96" width="70" height="40" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="205" y="121" fill="#e2e8f0" font-size="12" text-anchor="middle">1×1</text>
  <line x1="240" y1="116" x2="268" y2="116" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <text x="302" y="121" fill="#f59e0b" font-size="13" text-anchor="middle">출력 0</text>
  <text x="190" y="164" fill="#e2e8f0" font-size="12" text-anchor="middle">w = (0, 0), b = 0</text>
  <text x="190" y="200" fill="#e2e8f0" font-size="12" text-anchor="middle">w 의 gradient = g × x = (1.0, −0.5)</text>
  <text x="190" y="232" fill="#f87171" font-size="12" text-anchor="middle">복사본 쪽 gradient = g × w = (0, 0)</text>
  <text x="190" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">복사본은 아직 학습되지 않는다</text>
  <rect x="380" y="52" width="300" height="236" rx="8" fill="#0e1628" stroke="#34d399" stroke-width="1.6"/>
  <text x="530" y="78" fill="#34d399" font-size="14" text-anchor="middle" font-weight="600">한 번 고친 뒤 (learning rate 0.1)</text>
  <rect x="400" y="96" width="80" height="40" rx="8" fill="#13233d" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="440" y="121" fill="#38bdf8" font-size="12" text-anchor="middle">복사본</text>
  <line x1="480" y1="116" x2="508" y2="116" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a-b)"/>
  <text x="494" y="108" fill="#94a3b8" font-size="11" text-anchor="middle">x</text>
  <rect x="510" y="96" width="70" height="40" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="545" y="121" fill="#e2e8f0" font-size="12" text-anchor="middle">1×1</text>
  <line x1="580" y1="116" x2="608" y2="116" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <text x="642" y="121" fill="#34d399" font-size="13" text-anchor="middle">출력 −0.30</text>
  <text x="530" y="164" fill="#e2e8f0" font-size="12" text-anchor="middle">w = (−0.1, 0.05), b = −0.05</text>
  <text x="530" y="200" fill="#e2e8f0" font-size="12" text-anchor="middle">w 는 계속 gradient 를 받는다</text>
  <text x="530" y="232" fill="#34d399" font-size="12" text-anchor="middle">복사본 쪽 gradient = (−0.05, 0.025)</text>
  <text x="530" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">이제 복사본도 학습된다</text>
  <line x1="342" y1="170" x2="376" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-m)"/>
  <text x="360" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">w 의 gradient 는 입력 x 에 비례해 처음부터 0 이 아니고, 복사본 쪽 gradient 는 w 에 비례해 w 가 자란 뒤에 생긴다</text>
</svg>
