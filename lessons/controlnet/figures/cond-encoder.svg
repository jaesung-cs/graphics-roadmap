<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>조건 그림 512×512×3 이 작은 encoder 의 convolution 을 지나 512×512×16, 256×256×32, 128×128×96, 64×64×256 이 되고, 0 으로 시작하는 마지막 convolution 이 64×64×320 을 내서 복사본의 첫 convolution 출력에 더해진다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">조건 그림을 64×64 로 줄이는 작은 encoder (공개 weight 의 모양)</text>
  <rect x="34.0" y="84.0" width="92" height="92" rx="4" fill="#111a2e" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="80" y="206" fill="#94a3b8" font-size="12" text-anchor="middle">조건 그림</text>
  <text x="80" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">512×512</text>
  <text x="80" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">channel 3</text>
  <line x1="132.0" y1="130" x2="148.0" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="154.0" y="84.0" width="92" height="92" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="200" y="206" fill="#a78bfa" font-size="12" text-anchor="middle">첫 conv</text>
  <text x="200" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">512×512</text>
  <text x="200" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">channel 16</text>
  <line x1="252.0" y1="130" x2="279.0" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="285.0" y="95.0" width="70" height="70" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="320" y="206" fill="#a78bfa" font-size="12" text-anchor="middle">conv, stride 2</text>
  <text x="320" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">256×256</text>
  <text x="320" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">channel 32</text>
  <line x1="361.0" y1="130" x2="408.0" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="414.0" y="104.0" width="52" height="52" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="440" y="206" fill="#a78bfa" font-size="12" text-anchor="middle">conv, stride 2</text>
  <text x="440" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">128×128</text>
  <text x="440" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">channel 96</text>
  <line x1="472.0" y1="130" x2="535.0" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="541.0" y="111.0" width="38" height="38" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="560" y="206" fill="#a78bfa" font-size="12" text-anchor="middle">conv, stride 2</text>
  <text x="560" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">64×64</text>
  <text x="560" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">channel 256</text>
  <line x1="585.0" y1="130" x2="655.0" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="661.0" y="111.0" width="38" height="38" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="680" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">zero conv</text>
  <text x="680" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">64×64</text>
  <text x="680" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">channel 320</text>
  <text x="380" y="276" fill="#94a3b8" font-size="12" text-anchor="middle">zero conv 의 출력은 복사본의 첫 convolution 이 latent 를 channel 320 개로 늘린 값에 더해진다. 사이마다 SiLU</text>
</svg>
