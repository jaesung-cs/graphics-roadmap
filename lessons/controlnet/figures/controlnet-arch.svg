  <text x="305" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">예측한 noise</text>
  <text x="640" y="58" fill="#38bdf8" font-size="11" text-anchor="middle">latent zₜ + 작은 encoder 를 지난 조건 그림</text>
  <text x="400" y="438" fill="#94a3b8" font-size="12" text-anchor="middle">복사본의 값 12 + 1 개가 zero convolution 을 지나 skip connection 12 개와 가장 아래 block 출력에 더해진다</text>
  <text x="400" y="458" fill="#94a3b8" font-size="12" text-anchor="middle">회색은 weight 고정, 파랑과 흰색은 학습한다. 글과 step 번호는 양쪽 모두에 들어간다</text>
