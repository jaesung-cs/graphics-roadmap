# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: finite-difference
  title: finite difference 와 derivative
  variants:
    - question: |
        사진에서 0.01 cm 간격의 pixel 마다 밝기를 읽었다. 이 값으로 밝기의 기울기를 어떻게 구하고, 그 값은 정확히 무엇을 뜻하는가?
      choices:
        - '지금 pixel 의 밝기 하나를 0.01 cm 로 나누면 되고, 그 값이 바로 이 점의 기울기다'
        - '밝기를 차례로 더한 뒤 0.01 cm 를 곱하면 되고, 그 값이 구간의 평균 기울기다'
        - '이웃한 두 밝기의 차이를 0.01 cm 로 나누고, 그 값은 두 pixel 사이 구간의 평균 기울기다'
        - '이웃한 두 밝기의 차이가 곧 기울기라서, 0.01 cm 로 따로 나누지 않아도 단위가 이미 밝기/cm 다'
      answer: 2
      explanation: |
        기울기는 밝기가 변한 양을 그 사이 거리로 나눈 finite difference $\Delta b / \Delta x$ 로 구한다. 이 값은 두 pixel 사이 구간의 평균
        기울기라서, 간격을 0 에 가깝게 줄였을 때 다가가는 값(derivative)의 근사다. 밝기 하나를 거리로 나누면 변화가 아니라 값 자체를 나눈 것이고,
        더하고 곱하는 것은 적분 쪽 계산이다. 차이를 거리로 나누지 않으면 밝기/cm 가 아니라 밝기 단위의 변화량일 뿐이다.
    - question: |
        0.01 cm 간격의 세 pixel 밝기가 10.0, 10.5, 11.2 다. 두 구간의 기울기로 구한 기울기의 변화율로 알맞은 것은?
      choices:
        - '2000 밝기/cm². 두 구간 기울기 50 과 70 밝기/cm 의 차이를 0.01 cm 로 나눈다'
        - '20 밝기/cm². 두 구간 기울기 50 과 70 밝기/cm 의 차이 20 이 곧 변화율이다'
        - '1.2 밝기/cm². 변화율은 처음 밝기와 끝 밝기의 차이 11.2 − 10.0 이다'
        - '0 밝기/cm². 밝기가 매번 늘고 있으니 기울기만 있고 기울기의 변화는 없다'
      answer: 0
      explanation: |
        두 구간의 기울기는 $(10.5 - 10.0) \div 0.01 = 50$ 과 $(11.2 - 10.5) \div 0.01 = 70$ 밝기/cm 이고, 기울기의 변화율은 그 차이를 같은
        간격으로 나눈 $(70 - 50) \div 0.01 = 2000$ 밝기/cm² 다. 차이를 거리로 나누지 않으면 밝기/cm² 가 아니라 밝기/cm 단위의 변화량일 뿐이고,
        밝기 차이는 변화율이 아니다. 밝기가 커진다는 것은 기울기가 양수라는 뜻이고, 기울기의 변화율은 그 기울기가 얼마나 빨리 바뀌는지를 나타낸다.
    - question: |
        밝기 $b$ 를 위치 $x$ 로 미분한 $b'$ 와 두 번 미분한 $b''$ 는 사진에서 각각 무엇을 나타내는가?
      choices:
        - '$b''$ 는 여러 pixel 밝기의 평균이고, $b''''$ 는 그 밝기들이 흩어진 정도인 분산이다'
        - '$b''$ 는 위치에 따라 밝기가 오르는 기울기이고, $b''''$ 는 그 기울기가 바뀌는 정도로 밝기 곡선이 휘는 정도다'
        - '$b''$ 는 밝기를 위치로 한 번 적분한 값이고, $b''''$ 는 두 번 적분한 값이다'
        - '$b''$ 는 보정 program 이 맞춰야 할 목표 밝기이고, $b''''$ 는 지금 밝기와 그 목표 밝기 사이의 오차다'
      answer: 1
      explanation: |
        따옴표 하나는 한 번 미분한 값을 나타내고, 둘은 두 번 미분한 값을 나타낸다. 밝기를 한 번 미분하면 기울기이고, 기울기를 다시 미분하면 기울기가 바뀌는
        정도라서 곡선이 휘는 정도가 된다. OpenCV 의 Laplacian 튜토리얼은 edge 에서 두 번 미분한 값이 0 을 지나는 점을 이용한다. 평균·분산이나
        목표·오차와는 관계없고, 적분은 미분의 반대 계산이다.

- topic: differentiation-noise
  title: 수치 미분이 noise 를 키우는 이유
  variants:
    - question: |
        밝기를 0 ~ 255 의 정수로 저장한 하늘 사진에서 이웃 pixel 끼리 기울기를 계산한다. 같은 하늘을 100 pixel/cm 대신 1000 pixel/cm 로 찍었더니 기울기 값이 훨씬 심하게 튄다. 그 이유는 무엇인가?
      choices:
        - '해상도를 높이면 밝기를 더 큰 단계로 끊어 저장해서, pixel 마다 밝기 오차 자체가 커지기 때문이다'
        - '밝기 오차는 한 단계 그대로인데 기울기는 그 오차를 10 분의 1 로 줄어든 $\Delta x$ 로 나누기 때문이다'
        - '확대해 찍으면 하늘의 작은 얼룩까지 찍혀서, 실제 밝기가 pixel 마다 크게 오르내리기 때문이다'
        - 'pixel 이 10 배 많아져서, 기울기를 계산하는 동안 반올림 실수가 그만큼 쌓이기 때문이다'
      answer: 1
      explanation: |
        8 bit 사진은 밝기를 정수 단계로만 저장하므로 밝기의 오차는 해상도와 상관없이 최대 한 단계다. finite difference 는 그 오차를 $\Delta x$
        로 나누므로 $\Delta x$ 가 10 분의 1 이 되면 기울기의 오차는 10 배가 된다($1 \div 0.01 = 100$, $1 \div 0.001 = 1000$ 밝기/cm). 단계의 크기는
        저장 형식이 정하므로 바뀌지 않고, 하늘이 실제로 얼룩진 것도 아니다. 값이 튀는 것은 계산 실수가 아니라 미분이라는 계산의 성질이다.
    - question: |
        밝기를 미분해 기울기를 구하고, 그 기울기를 다시 미분했더니 결과가 쓸 수 없을 만큼 튄다. 이유로 가장 알맞은 것은?
      choices:
        - '두 번 미분한 값은 원래 정의되지 않는 양이라, 어떤 방법으로 계산해도 값이 항상 틀린다'
        - '두 번째 미분은 첫 번째 미분에서 커진 noise 를 되돌려 줄여야 하는데, 코드의 구현 실수로 오히려 키웠다'
        - '기울기를 미분하면 기울기에 섞인 bias 가 더한 횟수에 비례해 쌓여서 값이 점점 커진다'
        - '미분할 때마다 측정 오차를 $\Delta x$ 로 한 번 더 나누어, noise 가 다시 크게 불어나기 때문이다'
      answer: 3
      explanation: |
        미분할 때마다 오차가 $\Delta x$ 로 나뉜다. 1000 pixel/cm 에서 밝기 한 단계의 오차는 기울기에서는 1000 밝기/cm 가 되고, 두 번 미분한
        값에서는 1,000,000 밝기/cm² 가 된다. 그래서 두 번 미분한 값을 쓰는 Laplacian 도 보통 blur 와 함께 쓴다. 두 번 미분한 값도 정의되는 양이고, 미분은
        몇 번을 하든 noise 를 키운다. bias 가 쌓이는 것은 적분의 성질이다.
    - question: |
        사진 전체에 밝기를 10 단계씩 더해 모든 pixel 이 10 만큼 밝아졌다. 이 사진으로 finite difference 를 해서 구한 기울기는 어떻게 되는가?
      choices:
        - '모든 값이 똑같이 10 크므로 두 값의 차이에서 상쇄되어, 기울기는 바뀌지 않는다'
        - '밝기가 10 크니 기울기도 그만큼 커져서, 모든 기울기가 10 밝기/cm 크게 나온다'
        - '10 의 차이를 $\Delta x$ 로 나누므로, 기울기가 10 ÷ $\Delta x$ 만큼 크게 나온다'
        - '차이를 낼 때마다 10 이 남아서 오른쪽으로 갈수록 기울기 오차가 10 씩 쌓인다'
      answer: 0
      explanation: |
        일정한 값(상수)의 derivative 는 0 이다. 두 밝기에 같은 10 이 더해져 있으면 차이를 낼 때 지워지므로 기울기에는 나타나지 않고, edge 검출
        결과도 같다. 미분이 키우는 것은 자리마다 다르게 오르내리는 noise 이고, 일정한 bias 는 미분하면 사라진다. 오차가 쌓이는 것은 값을 계속
        더하는 적분의 일이다.

- topic: filtering-delay
  title: 평균과 blur 의 대가
  variants:
    - question: |
        1000 pixel/cm 사진에서 이웃 pixel 끼리 계산한 기울기가 튀어서, 이웃한 기울기 150 개의 평균을 쓰기로 했다. 이때 얻는 것과 잃는 것은 무엇인가?
      choices:
        - '150 개를 평균하면 noise 가 줄고, 가운데 pixel 의 값도 평균에 들어가므로 edge 위치는 번지지 않는다'
        - '평균을 내도 한 단계 오차는 그대로라서 noise 는 같고, 계산량만 150 배로 늘어난다'
        - '평균은 noise 를 줄이는 대신 사진 전체에 더해진 일정한 밝기까지 함께 없애 준다'
        - 'noise 는 크게 줄지만, 0.15 cm 구간 전체의 기울기라 edge 위치가 그 폭으로 번진다'
      answer: 3
      explanation: |
        기울기 150 개의 평균은 150 pixel 떨어진 두 밝기의 차이를 0.15 cm 로 나눈 것과 같아서, 한 단계의 오차가 0.15 cm 로 나뉘어 noise 가 크게
        준다. 대신 0.15 cm 구간의 평균이므로 실제 edge 가 어디에 있었는지가 그 폭 안에서 흐려진다. 평균은 noise 를 줄이는 계산이고, 일정하게
        더해진 밝기는 평균과 관계없이 미분할 때 이미 사라진다.
    - question: |
        OpenCV 의 Canny edge 검출은 기울기를 구하기 전에 5×5 Gaussian filter 로 사진을 먼저 흐리게 한다. 그 이유는 무엇인가?
      choices:
        - '흐리게 하면 어두운 pixel 이 모두 밝아져서, edge 의 기울기가 더 크게 나오기 때문에'
        - '기울기는 밝기의 변화율이라 pixel 마다 다른 noise 가 $\Delta x$ 로 나뉘어 크게 튀기 때문에'
        - 'Gaussian filter 가 사진을 작게 줄여서, 기울기를 계산할 pixel 수를 줄여 주기 때문에'
        - '흐리게 하면 edge 가 더 날카로워져서, edge 의 위치를 더 정확히 찾을 수 있기 때문에'
      answer: 1
      explanation: |
        기울기는 이웃 pixel 의 차이로 계산하므로 수치 미분과 같은 문제를 겪는다. pixel 마다 다른 작은 noise 가 $\Delta x$ 로 나뉘어 크게 튀면
        noise 자리마다 가짜 edge 가 생긴다. Gaussian filter 는 이 빠른 오르내림을 줄이는 대신 edge 를 조금 번지게 한다. 흐리게 하면 edge 는
        날카로워지지 않고 무뎌지며, 사진 크기나 전체 밝기를 바꾸는 계산도 아니다.
    - question: |
        edge 검출 전에 거치는 blur 를 더 강하게(더 넓은 범위를 평균하게) 설정했다. 생길 수 있는 문제는 무엇인가?
      choices:
        - 'blur 를 강하게 걸수록 남은 noise 가 한데 모여서, 기울기 값이 오히려 전보다 더 심하게 튄다'
        - 'blur 가 밝기의 저장 단계를 키워서 사진의 bit 수가 낮아진다'
        - '가까이 붙은 두 edge 가 하나로 섞이거나 edge 위치가 넓게 번져, 가는 경계를 놓칠 수 있다'
        - 'blur 가 값을 계속 평균하는 동안 사진에 일정한 bias 가 생겨 오른쪽으로 갈수록 커진다'
      answer: 2
      explanation: |
        blur 는 빠르게 오르내리는 값을 줄이는 만큼 실제 edge 도 무디게 만든다. blur 가 강할수록 noise 는 줄지만 edge 가 넓게 번지고, 가까운 두
        edge 가 하나로 섞여 구분되지 않을 수 있다. 그래서 noise 와 번짐 사이에서 알맞은 정도를 고른다. blur 는 값을 더 매끄럽게 만들 뿐 더 튀게
        하지 않고, 저장 단계는 파일 형식이 정하며, 쌓이는 bias 는 적분의 문제다.

- topic: integration-drift
  title: 적분과 쌓이는 오차
  variants:
    - question: |
        빛이 없는 밤하늘을 짧게 찍은 사진 여러 장을 같은 자리끼리 더했더니, 장수를 늘릴수록 배경이 한쪽으로 계속 밝아진다. 그 이유는 무엇인가?
      choices:
        - '센서의 bias(늘 한쪽으로 치우친 작은 오차)가 더할 때마다 같은 쪽으로 쌓여 장수에 비례해 커지기 때문이다'
        - '더하기는 매번 noise 를 $\Delta x$ 로 나눠 키우므로, 장수가 늘수록 더한 값이 크게 흔들리기 때문이다'
        - '사진을 더하면 해상도가 높아져서 밝기 한 단계의 오차가 기울기처럼 커지기 때문이다'
        - '어두운 사진은 센서가 꺼져서 마지막으로 잰 밝기가 계속 더해지기 때문이다'
      answer: 0
      explanation: |
        여러 장을 더하는 것은 적분이다. 빛이 없어도 센서에 장마다 0.1 단계 같은 bias 가 있으면 매번 같은 쪽으로 더해져 600 장이면 60 단계처럼
        장수에 비례해 쌓이는데, 이것을 drift 라고 한다. noise 를 $\Delta x$ 로 나눠 키우는 것은 미분이고, 적분에서는 오르내리는 noise 가 서로
        상쇄된다. 센서가 꺼지는 것도 아니어서, 셔터를 닫고 찍은 dark frame 을 빼서 bias 를 없앤다.
    - question: |
        빛이 없는 장면을 찍은 사진 한 장의 pixel 에 0.1 단계의 bias 와 0.5 단계 크기의 무작위 noise 가 함께 있다. 이런 사진 600 장을 더하면, 더한 값의 오차에 더 크게 기여하는 쪽은?
      choices:
        - 'noise. 한 장에서 크기가 bias 의 다섯 배라서, 600 장을 더해 쌓인 오차도 bias 의 다섯 배가 된다'
        - '둘이 같다. 더하면 bias 든 noise 든 모든 오차가 장수에 비례해 쌓인다'
        - 'bias. 매번 같은 쪽으로 더해져 60 단계가 쌓이고, noise 는 서로 상쇄되어 12 단계 정도다'
        - '둘 다 작다. 여러 장을 더하면 오차가 평균되어 bias 와 noise 가 모두 지워진다'
      answer: 2
      explanation: |
        bias 는 $0.1 \times 600 = 60$ 단계로 장수에 비례해 쌓인다. noise 는 더해질 때마다 방향이 달라 서로 상쇄되어, 600 장을 더한 합이 600 배가
        아니라 $\sqrt{600}$ 배 정도로만 커진다($0.5 \times \sqrt{600} \approx 12.2$). 그래서 noise 가 다섯 배 커도 많이 더한 결과에서는 bias 가
        훨씬 크다. 더하기는 noise 를 상대적으로 줄이지만 bias 를 지우지는 못한다.
    - question: |
        이웃 pixel 사이의 밝기 차이만 저장해 두고, 왼쪽 끝 밝기에서 출발해 그 차이를 차례로 더해 한 줄을 복원한다. 저장한 차이마다 0.1 단계씩 같은 쪽으로 틀려 있으면 복원한 밝기는 어떻게 되는가?
      choices:
        - '차이마다 오차가 0.1 로 작으니, 복원한 밝기의 오차도 줄 끝까지 0.1 에 머문다'
        - '오른쪽으로 갈수록 오차가 더한 횟수에 비례해 쌓여서, 1000 번째 pixel 에서는 100 단계가 틀린다'
        - '앞 pixel 의 오차와 뒤 pixel 의 오차가 서로 상쇄되어, 줄 끝까지 복원한 밝기가 원래 밝기와 같아진다'
        - '더할수록 오차가 평균되어, 오른쪽으로 갈수록 복원한 밝기가 점점 정확해진다'
      answer: 1
      explanation: |
        차이를 차례로 더하는 복원은 적분이다. 차이마다 같은 쪽으로 0.1 씩 틀려 있으면 이 bias 가 더할 때마다 쌓여, 1000 번 더한 자리에서는
        $0.1 \times 1000 = 100$ 단계가 틀린다. 같은 쪽으로 치우친 오차는 상쇄되거나 평균으로 줄지 않는다. 서로 다른 방향으로 오르내리는 noise 였다면
        $\sqrt{n}$ 배 정도로만 커졌을 것이다.

- topic: chain-rule
  title: chain rule
  variants:
    - question: |
        줄무늬에서 pixel 이 1 칸 오른쪽으로 가면 줄무늬 각도 $\theta$ 가 0.01 rad 늘고, 지금 자리에서 $\theta$ 가 1 rad 늘 때 밝기는 30 늘어난다. pixel 1 칸당 밝기는 대략 얼마나 변할까?
      choices:
        - '3000. $\theta$ 1 rad 당 30 에 1 칸당 각도 0.01 의 역수 100 을 곱한다'
        - '30. pixel 위치는 각도를 거쳐 밝기를 바꿀 뿐이라 비율이 그대로다'
        - '0.3. 1 칸에 $\theta$ 가 0.01 rad 늘므로 $30 \times 0.01$ 이다'
        - '30.01. 두 단계의 변화율 30 과 0.01 을 더해 처음과 끝 사이의 변화율로 쓴다'
      answer: 2
      explanation: |
        변화가 pixel 위치 → 각도 → 밝기로 단계를 거쳐 전해지므로 chain rule 로 단계마다 구한 변화율을 곱한다. 1 칸에 각도는 0.01 rad 늘고, 각도
        1 rad 당 밝기가 30 늘므로 $30 \times 0.01 = 0.3$ 이다. 100 을 곱하면 비율을 거꾸로 쓴 것이고, 가운데 단계를 무시하면 30 이 되며, 단계마다 구한
        변화율은 더하지 않고 곱한다.
    - question: |
        neural network 의 backpropagation 이 chain rule 이라고 하는데, chain rule 이 말하는 것은 무엇인가?
      choices:
        - '여러 함수가 이어져 있으면 각 함수의 derivative 를 모두 더한 값이 전체의 derivative 다'
        - '맨 마지막 층의 derivative 만 구하면, 앞의 층들은 그 값을 그대로 물려받아 쓴다'
        - '함수를 여러 번 이어 미분하면 결국 0 이 되므로, 단계가 많으면 변화율도 0 이다'
        - '변화가 여러 단계를 거쳐 전해질 때, 처음과 끝 사이의 변화율은 단계마다 구한 변화율을 곱한 값이다'
      answer: 3
      explanation: |
        $y$ 가 $u$ 에, $u$ 가 $x$ 에 달려 있으면 $\frac{dy}{dx} = \frac{dy}{du} \times \frac{du}{dx}$ 다. backpropagation 은 loss 에서 출발해 층마다 구한
        변화율을 곱해 가며 앞 층 weight 의 gradient 를 구한다. 변화율은 더하지 않고 곱하며, 층마다 값이 달라서 마지막 층의 값을 그대로 쓸 수 없다. 같은 함수를 거듭
        미분하는 것이 아니라 단계마다 한 번씩 미분해 곱하므로, 단계가 많다고 변화율이 0 이 되지도 않는다.
    - question: |
        줄무늬의 밝기가 $b = 100\sin\theta$ 이고 $\theta = 0.01x$ 다. pixel 1 칸당 밝기가 가장 빨리 변하는 자리와 전혀 변하지 않는 자리는?
      choices:
        - '$\theta = 0°$ 에서 가장 빨리 변하고, 가장 밝은 $\theta = 90°$ 에서는 밝기가 변하지 않는다'
        - '가장 밝은 $\theta = 90°$ 에서 가장 빨리 변하고, $\theta = 0°$ 에서는 밝기가 변하지 않는다'
        - '$\theta$ 가 pixel 마다 0.01 rad 씩 일정하게 늘므로, 모든 자리에서 같은 빠르기로 변한다'
        - '$\theta = 45°$ 에서 가장 빨리 변하고, $0°$ 와 $90°$ 에서는 밝기가 변하지 않는다'
      answer: 0
      explanation: |
        chain rule 로 $\frac{db}{dx} = 100\cos\theta \times 0.01 = \cos\theta$ 다. $\theta = 0°$ 에서는 $\cos 0° = 1$ 이라 1 칸당 1 로 가장 크고,
        $\theta = 90°$ 에서는 $\cos 90° = 0$ 이라 밝기가 가장 밝은 꼭대기에서 잠시 변하지 않는다. 각도가 일정하게 늘어도 $\sin$ 의 기울기가 자리마다
        달라서 밝기가 변하는 빠르기는 자리마다 다르다.

- topic: gradient
  title: partial derivative 와 gradient
  variants:
    - question: |
        contrast $a$ 와 밝기 $c$ 로 정한 오차 $D$ 의 gradient 가 지금 $(-0.28, -0.6)$ 이다. $D$ 를 가장 빨리 줄이려면 두 값을 어떻게 바꿔야 하는가?
      choices:
        - '두 값을 모두 줄인다. gradient 의 두 component 가 음수라서 그 방향으로 가면 $D$ 가 준다'
        - '두 값을 모두 키운다. gradient 의 반대 방향이 가장 빨리 줄어드는 방향이다'
        - '$c$ 만 키운다. $a$ 쪽 값은 $c$ 쪽 값의 절반쯤이라 무시해도 결과가 거의 같다'
        - '두 값을 그대로 둔다. gradient 가 음수면 이미 가장 낮은 점에 와 있다'
      answer: 1
      explanation: |
        gradient 는 함수가 가장 빨리 커지는 방향을 가리키므로, 줄이려면 그 반대 $(0.28, 0.6)$ 쪽으로 간다. 두 component 가 모두 음수라 두 값을 키우면
        $D$ 가 준다. 크기가 작은 component 도 같은 방향으로 기여하므로 무시하지 않으며, 가장 낮은 점에서는 gradient 가 음수가 아니라 0 이다.
    - question: |
        partial derivative $\frac{\partial D}{\partial a}$ 를 숫자로 재는 방법은 무엇인가?
      choices:
        - '$c$ 는 그대로 두고 $a$ 만 조금 바꿔, $D$ 가 변한 양을 바꾼 양으로 나눈다'
        - '$a$ 와 $c$ 를 둘 다 똑같이 조금씩 바꿔, $D$ 가 변한 양을 바꾼 양으로 나눈다'
        - '$a$ 를 0 으로 두고 계산한 $D$ 와 지금 $D$ 의 차이를 구한다'
        - '$a$ 를 크게 바꿔 가며 $D$ 가 가장 작아지는 $a$ 값을 찾는다'
      answer: 0
      explanation: |
        partial derivative 는 다른 변수를 고정하고 하나만 바꿨을 때의 변화율이다. 둘을 함께 바꾸면 어느 쪽 때문에 $D$ 가 변했는지 알 수 없다.
        변수를 0 으로 두거나 크게 바꿔 최솟값을 찾는 것은 변화율을 재는 방법이 아니다. $\partial$ 기호가 "다른 값은 고정했다" 는 표시다.
    - question: |
        gradient descent 에서 step 크기 $\alpha$ 를 너무 크게 잡으면 어떻게 되는가?
      choices:
        - '한 번에 크게 움직여 가장 낮은 점에 바로 도착하므로, step 은 클수록 좋다'
        - 'step 이 크면 gradient 의 부호가 뒤집혀서 계속 오르막 쪽으로만 간다'
        - 'gradient 에 큰 $\alpha$ 를 곱하면 gradient 가 0 이 되어 더 움직이지 않는다'
        - 'gradient 는 지금 점의 기울기라서, 너무 멀리 가면 가장 낮은 점을 지나쳐 값이 커질 수 있다'
      answer: 3
      explanation: |
        gradient 로는 지금 자리에서 어느 쪽이 내리막인지만 알 수 있다. 함수가 휘어 있어서 그 방향으로 너무 멀리 가면 가장 낮은 점을 지나쳐 처음보다
        나빠질 수 있다. contrast·밝기 예에서 $\alpha = 0.3$ 은 $D$ 를 0.05 에서 0.0103 으로 줄였지만 $\alpha = 1$ 은 0.632 로 오히려 늘렸다.
        방향 자체는 그대로 내리막이고, gradient 는 $\alpha$ 와 상관없이 그 점의 값이다.

- topic: jacobian
  title: Jacobian 과 선형 근사
  variants:
    - question: |
        $(r, \varphi)$ 를 화면 위치 $(x, y) = (r\cos\varphi, r\sin\varphi)$ 로 보내는 polar 변환의 Jacobian 은 무엇인가?
      choices:
        - '화면 위치 $(x, y)$ 를 넣으면 $r$ 과 $\varphi$ 를 바로 구해 주는, 거꾸로 된 변환 공식이다'
        - '변환 뒤 사진의 밝기를 $r$ 과 $\varphi$ 로 미분한 vector 로, 사진이 밝아지는 방향을 가리킨다'
        - '$x$, $y$ 를 $r$, $\varphi$ 로 편미분해 모은 행렬로, 작은 변화를 화면 위치의 변화로 바꾼다'
        - '사진의 가로·세로 pixel 수를 모은 표로, 변환한 뒤 만들 사진의 크기를 정한다'
      answer: 2
      explanation: |
        Jacobian 은 결과($x$, $y$)를 행으로, 변수($r$, $\varphi$)를 열로 해서 partial derivative 를 늘어놓은 행렬이다. 열 하나는 그 변수만 바꿀 때
        화면 위치가 움직이는 양이고, $\Delta\mathbf p \approx J\Delta\mathbf q$ 로 작은 변화를 옮긴다. 거꾸로 푸는 공식은 따로 있고, 값 하나(밝기)를
        미분한 vector 는 gradient 다. 사진 크기와는 관계없다.
    - question: |
        어떤 점에서 $J = \begin{bmatrix} 0 & -2 \\ 1 & 0 \end{bmatrix}$ 이다. $(\Delta r, \Delta\varphi) = (0.2, 0.1)$ 일 때 화면 위치의 변화는 대략 얼마인가?
      choices:
        - '$(0, 0.2)$. $r$ 이 바깥쪽으로 늘어나므로 첫째 열만 곱하면 된다'
        - '$(-0.2, 0.2)$. 첫째 열에 0.2, 둘째 열에 0.1 을 곱해 더한다'
        - '$(0, 0)$. 대각선 칸이 모두 0 이라 어떤 변화를 곱해도 움직이지 않는다'
        - '$(0.3, 0)$. 두 변화량을 더한 0.3 이 그대로 화면 위치의 변화가 된다'
      answer: 1
      explanation: |
        변화는 각 열에 그 변수의 변화량을 곱해 더한 $0.2 \times (0, 1) + 0.1 \times (-2, 0) = (0, 0.2) + (-0.2, 0) = (-0.2, 0.2)$ 다. 첫째 열만
        보면 $\varphi$ 의 몫 $(-0.2, 0)$ 이 빠지고, 대각선 칸에만 곱하면 다른 칸의 몫이 빠져 행렬 곱이 아니며, 변화량의 합은 위치 변화가 아니다.
        실제 이동은 휘어 가서 $(-0.220, 0.189)$ 로 조금 다르다.
    - question: |
        $\Delta\mathbf p \approx J\,\Delta\mathbf q$ 는 왜 근사이고, 언제 잘 맞는가?
      choices:
        - 'pixel 값의 반올림 때문에 근사일 뿐이고, 반올림이 없다면 변화가 얼마나 크든 언제나 정확하다'
        - 'Jacobian 을 숫자로 재서 근사일 뿐이고, 식으로 미분해 정확히 구하면 변화의 크기와 상관없이 정확하다'
        - '점은 휘어 가는데 Jacobian 은 지금 방향으로 곧게 간다고 보는 선형 근사라, 변화가 작을 때 잘 맞는다'
        - '변화를 크게 할수록 앞뒤 구간의 오차가 서로 상쇄되어, 큰 변화에서 오히려 더 잘 맞는다'
      answer: 2
      explanation: |
        Jacobian 은 지금 점에서의 변화율이라 휘어진 관계를 한 점 근처에서 직선으로 바꿔 본 선형 근사(first-order Taylor)다. 변화가 작을 때만
        잘 맞고, 변화를 10 배 키우면 오차는 약 100 배가 된다. polar 변환에서 $(0.02, 0.01)$ 의 오차는 0.00022 였지만 $(0.2, 0.1)$ 에서는 0.022 였다.
        반올림이나 계산 방법과 관계없이 생기는 오차이고, 크게 바꿀수록 커진다.
