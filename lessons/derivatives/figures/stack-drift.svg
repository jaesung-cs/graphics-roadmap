  <text x="496.0" y="67.6" fill="#f59e0b" font-size="12" text-anchor="start">bias 0.1 × 60 = 6</text>
  <text x="496.0" y="247.6" fill="#38bdf8" font-size="12" text-anchor="start">noise 합 −1.6</text>
  <text x="520.0" y="120.0" fill="#e2e8f0" font-size="12" text-anchor="start">bias: 장마다 같은 쪽으로</text>
  <text x="520.0" y="138.0" fill="#e2e8f0" font-size="12" text-anchor="start">더해져 장수에 비례</text>
  <text x="520.0" y="176.0" fill="#e2e8f0" font-size="12" text-anchor="start">noise: 방향이 매번 달라</text>
  <text x="520.0" y="194.0" fill="#e2e8f0" font-size="12" text-anchor="start">서로 상쇄, 보통 크기는</text>
  <text x="520.0" y="212.0" fill="#94a3b8" font-size="12" text-anchor="start">0.5 × √60 ≈ 3.9</text>
