<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>빛이 없는 장면을 찍은 사진의 한 pixel 을 60 장까지 더한 값. 장마다 0.1 단계인 bias 는 60 장에서 6 으로 쌓이고, 그보다 다섯 배 큰 0.5 단계의 무작위 noise 는 서로 상쇄되어 이 한 번의 실험에서는 −1.6 에 머문다</title>
