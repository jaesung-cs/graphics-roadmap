<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 뜻의 영어·한국어 문장이 tokenizer 마다 쓰는 token 수. The cat wore a hat. 은 GPT-2, GPT-4, GPT-4o 의 tokenizer 모두에서 6 개이고, 고양이가 모자를 썼다. 는 26, 13, 9 개다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="360.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">token 수 (tiktoken 으로 직접 센 값)</text>
  <rect x="200.0" y="48.0" width="14.0" height="14.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="220.0" y="60.0" fill="#94a3b8" font-size="11" text-anchor="start">GPT-2 · vocabulary 50,257</text>
  <rect x="370.0" y="48.0" width="14.0" height="14.0" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="390.0" y="60.0" fill="#94a3b8" font-size="11" text-anchor="start">GPT-4 · vocabulary 약 10만</text>
  <rect x="540.0" y="48.0" width="14.0" height="14.0" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="560.0" y="60.0" fill="#94a3b8" font-size="11" text-anchor="start">GPT-4o · vocabulary 약 20만</text>
  <text x="185.0" y="120.0" fill="#e2e8f0" font-size="13" text-anchor="end">The cat wore a hat.</text>
  <text x="185.0" y="138.0" fill="#94a3b8" font-size="11" text-anchor="end">UTF-8 19 byte</text>
  <rect x="200.0" y="100.0" width="96.0" height="14.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="302.0" y="112.0" fill="#e2e8f0" font-size="11" text-anchor="start">6</text>
  <rect x="200.0" y="118.0" width="96.0" height="14.0" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="302.0" y="130.0" fill="#e2e8f0" font-size="11" text-anchor="start">6</text>
  <rect x="200.0" y="136.0" width="96.0" height="14.0" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="302.0" y="148.0" fill="#e2e8f0" font-size="11" text-anchor="start">6</text>
  <text x="185.0" y="200.0" fill="#e2e8f0" font-size="13" text-anchor="end">고양이가 모자를 썼다.</text>
  <text x="185.0" y="218.0" fill="#94a3b8" font-size="11" text-anchor="end">UTF-8 30 byte</text>
  <rect x="200.0" y="180.0" width="416.0" height="14.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="622.0" y="192.0" fill="#e2e8f0" font-size="11" text-anchor="start">26</text>
  <rect x="200.0" y="198.0" width="208.0" height="14.0" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="414.0" y="210.0" fill="#e2e8f0" font-size="11" text-anchor="start">13</text>
  <rect x="200.0" y="216.0" width="144.0" height="14.0" rx="0" fill="#f59e0b" stroke="none" stroke-width="1" fill-opacity="0.85"/>
  <text x="350.0" y="228.0" fill="#e2e8f0" font-size="11" text-anchor="start">9</text>
  <text x="360.0" y="282.0" fill="#94a3b8" font-size="12" text-anchor="middle">한글은 한 글자가 3 byte 이고, 한국어 byte 쌍을 merge 로 많이 배운 tokenizer 일수록 token 이 준다</text>
</svg>
