<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Euler 는 step 처음의 빠르기 하나로 곧게 가고, Heun 은 끝에서 빠르기를 한 번 더 구해 평균하며, multistep 은 앞 step 들의 빠르기를 함께 써서 휘는 경로를 따라간다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="128.0" y="34.0" fill="#f59e0b" font-size="13" text-anchor="middle">Euler (1 차)</text>
  <path d="M44,200 C104,200 174,170 214,80" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="220.0" y="74.0" fill="#94a3b8" font-size="10" text-anchor="start">정답 경로</text>
  <text x="360.0" y="34.0" fill="#38bdf8" font-size="13" text-anchor="middle">Heun (2 차, NFE 2)</text>
  <path d="M276,200 C336,200 406,170 446,80" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="452.0" y="74.0" fill="#94a3b8" font-size="10" text-anchor="start">정답 경로</text>
  <text x="592.0" y="34.0" fill="#34d399" font-size="13" text-anchor="middle">multistep (NFE 1)</text>
  <path d="M508,200 C568,200 638,170 678,80" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="684.0" y="74.0" fill="#94a3b8" font-size="10" text-anchor="end">정답 경로</text>
  <line x1="44.0" y1="200.0" x2="214.0" y2="200.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="134.0" y="222.0" fill="#94a3b8" font-size="11" text-anchor="middle">처음 빠르기로 곧게</text>
  <line x1="276.0" y1="200.0" x2="446.0" y2="200.0" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="276.0" y1="200.0" x2="446.0" y2="120.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="366.0" y="236.0" fill="#94a3b8" font-size="11" text-anchor="middle">끝의 빠르기와 평균 · U-Net 두 번</text>
  <line x1="492.0" y1="212.0" x2="508.0" y2="200.0" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="598.0" y="236.0" fill="#94a3b8" font-size="11" text-anchor="middle">앞 step 의 빠르기도 함께 써서</text>
  <line x1="508.0" y1="200.0" x2="678.0" y2="110.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="598.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="middle">변화를 어림 · U-Net 한 번</text>
</svg>
