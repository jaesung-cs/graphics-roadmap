<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>생성의 한 step. latent x_t 와 step 번호를 U-Net 에 넣어 noise 를 맞히고, guidance 로 섞은 뒤, sampler(scheduler)가 다음 latent 를 계산한다. 학습은 U-Net 만 하고 sampler 는 고르기만 한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="738" height="228" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="60.0" width="124.0" height="60.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="86.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">latent x_t</text>
  <text x="86.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">step 번호 t</text>
  <rect x="170.0" y="60.0" width="124.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="232.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">U-Net</text>
  <text x="232.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">학습한 network</text>
  <line x1="150.0" y1="90.0" x2="168.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="316.0" y="60.0" width="124.0" height="60.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="378.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">guidance</text>
  <text x="378.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">두 예측 섞기</text>
  <line x1="296.0" y1="90.0" x2="314.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="462.0" y="60.0" width="124.0" height="60.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="524.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">sampler</text>
  <text x="524.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">다음 latent 계산</text>
  <line x1="442.0" y1="90.0" x2="460.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="608.0" y="60.0" width="124.0" height="60.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="670.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x_다음</text>
  <text x="670.0" y="106.0" fill="#94a3b8" font-size="11" text-anchor="middle">다음 step 으로</text>
  <line x1="588.0" y1="90.0" x2="606.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M666,122 C666,190 86,190 86,122" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="370.0" y="150.0" fill="#94a3b8" font-size="12" text-anchor="middle">20 ~ 50 번 되풀이</text>
  <text x="462.0" y="214.0" fill="#f59e0b" font-size="11" text-anchor="middle">Euler · DPM++ 2M · PLMS … 바꿔 끼워도 다시 학습하지 않는다</text>
</svg>
