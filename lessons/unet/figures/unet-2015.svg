<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>2015 년 U-Net 의 크기와 channel. 572×572 입력이 568, 280, 136, 64 를 거쳐 가장 아래 28×28 과 1024 channel 까지 줄고, 52, 100, 196 을 거쳐 388×388 출력으로 커진다. 가로 화살표는 줄이는 길의 값을 키우는 길로 건네는 copy and crop 이다</title>
