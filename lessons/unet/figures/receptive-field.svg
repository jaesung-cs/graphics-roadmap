<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 convolution 24 층으로 크기를 줄이지 않으면 receptive field 의 한 변이 49 에 그치고, 세 번 절반으로 줄이면 201 이 되어 폭 64 인 그림 전체를 덮는다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="698" height="228" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="190.0" y="34.0" fill="#94a3b8" font-size="12" text-anchor="start">receptive field 의 한 변 (pixel)</text>
  <text x="178.0" y="82.0" fill="#e2e8f0" font-size="13" text-anchor="end">줄이지 않음</text>
  <rect x="190.0" y="60.0" width="107.8" height="32.0" rx="0" fill="#38bdf8" stroke="none" stroke-width="1" fill-opacity="0.35"/>
  <rect x="190.0" y="60.0" width="107.8" height="32.0" rx="0" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="305.8" y="82.0" fill="#38bdf8" font-size="13" text-anchor="start">49</text>
  <text x="178.0" y="142.0" fill="#e2e8f0" font-size="13" text-anchor="end">세 번 절반으로</text>
  <rect x="190.0" y="120.0" width="442.2" height="32.0" rx="0" fill="#34d399" stroke="none" stroke-width="1" fill-opacity="0.35"/>
  <rect x="190.0" y="120.0" width="442.2" height="32.0" rx="0" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="640.2" y="142.0" fill="#34d399" font-size="13" text-anchor="start">201</text>
  <line x1="330.8" y1="50.0" x2="330.8" y2="190.0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="330.8" y="208.0" fill="#f59e0b" font-size="12" text-anchor="middle">그림의 폭 64</text>
  <text x="660.0" y="34.0" fill="#94a3b8" font-size="12" text-anchor="end">convolution 24 층 기준</text>
</svg>
