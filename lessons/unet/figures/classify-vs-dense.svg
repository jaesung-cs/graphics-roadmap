<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 224×224 사진을 7×7 로 줄여 class 점수 하나를 내는 분류 network 이고, 아래는 64×64 입력에서 같은 크기 64×64 의 noise 를 내는 U-Net 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="698" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="30.0" fill="#94a3b8" font-size="13" text-anchor="start">분류 network</text>
  <rect x="24.0" y="44.0" width="130.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="89.0" y="76.0" fill="#e2e8f0" font-size="13" text-anchor="middle">사진</text>
  <text x="89.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="middle">224×224</text>
  <line x1="156.0" y1="79.0" x2="196.0" y2="79.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="206.0" y="51.0" width="56.0" height="56.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="234.0" y="121.0" fill="#94a3b8" font-size="11" text-anchor="middle">56×56</text>
  <rect x="276.0" y="59.0" width="40.0" height="40.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="296.0" y="115.0" fill="#94a3b8" font-size="11" text-anchor="middle">28×28</text>
  <rect x="346.0" y="66.0" width="26.0" height="26.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="359.0" y="115.0" fill="#94a3b8" font-size="11" text-anchor="middle">14×14</text>
  <rect x="416.0" y="71.0" width="16.0" height="16.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="424.0" y="115.0" fill="#94a3b8" font-size="11" text-anchor="middle">7×7</text>
  <line x1="496.0" y1="79.0" x2="536.0" y2="79.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="54.0" width="136.0" height="50.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="608.0" y="84.0" fill="#e2e8f0" font-size="13" text-anchor="middle">고양이 0.92</text>
  <text x="24.0" y="160.0" fill="#94a3b8" font-size="13" text-anchor="start">noise 를 맞히는 network (dense prediction)</text>
  <rect x="24.0" y="174.0" width="130.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="89.0" y="206.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x_t</text>
  <text x="89.0" y="226.0" fill="#94a3b8" font-size="12" text-anchor="middle">64×64</text>
  <line x1="156.0" y1="209.0" x2="196.0" y2="209.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200.0" y="179.0" width="296.0" height="60.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="348.0" y="205.0" fill="#e2e8f0" font-size="14" text-anchor="middle">U-Net</text>
  <text x="348.0" y="225.0" fill="#94a3b8" font-size="12" text-anchor="middle">줄였다가 다시 키운다</text>
  <line x1="498.0" y1="209.0" x2="536.0" y2="209.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="174.0" width="136.0" height="70.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="608.0" y="206.0" fill="#e2e8f0" font-size="13" text-anchor="middle">예측한 noise</text>
  <text x="608.0" y="226.0" fill="#94a3b8" font-size="12" text-anchor="middle">64×64</text>
</svg>
