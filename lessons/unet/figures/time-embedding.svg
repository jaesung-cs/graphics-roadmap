  <line x1="388.0" y1="62.0" x2="422.0" y2="62.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="426.0" y="40.0" width="120.0" height="44.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="486.0" y="61.0" fill="#e2e8f0" font-size="12" text-anchor="middle">MLP · linear 층</text>
  <text x="486.0" y="77.0" fill="#94a3b8" font-size="11" text-anchor="middle">학습한 weight</text>
  <line x1="548.0" y1="62.0" x2="582.0" y2="62.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
