  <text x="328.0" y="221.0" fill="#e2e8f0" font-size="15" text-anchor="middle">3.5</text>
  <rect x="356.0" y="194.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="384.0" y="221.0" fill="#e2e8f0" font-size="15" text-anchor="middle">4.5</text>
  <text x="356.0" y="258.0" fill="#94a3b8" font-size="12" text-anchor="middle">더한 뒤</text>
  <rect x="500.0" y="150.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="528.0" y="177.0" fill="#e2e8f0" font-size="15" text-anchor="middle">+0.5</text>
  <rect x="556.0" y="150.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="584.0" y="177.0" fill="#e2e8f0" font-size="15" text-anchor="middle">+0.5</text>
  <rect x="500.0" y="194.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="528.0" y="221.0" fill="#e2e8f0" font-size="15" text-anchor="middle">+0.5</text>
  <rect x="556.0" y="194.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="584.0" y="221.0" fill="#e2e8f0" font-size="15" text-anchor="middle">+0.5</text>
  <text x="556.0" y="258.0" fill="#94a3b8" font-size="12" text-anchor="middle">변화량</text>
  <text x="360.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">같은 channel 의 모든 위치에 같은 값이 더해진다. t 가 바뀌면 더하는 값이 바뀐다</text>
</svg>
