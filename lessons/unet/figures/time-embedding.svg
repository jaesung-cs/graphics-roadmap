  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="40.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="69.0" y="67.0" fill="#e2e8f0" font-size="14" text-anchor="middle">t = 10</text>
  <line x1="116.0" y1="62.0" x2="150.0" y2="62.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="183.0" y="38.0" fill="#94a3b8" font-size="10" text-anchor="middle">cos(t)</text>
  <text x="241.0" y="38.0" fill="#94a3b8" font-size="10" text-anchor="middle">cos(0.01t)</text>
  <text x="299.0" y="38.0" fill="#94a3b8" font-size="10" text-anchor="middle">sin(t)</text>
  <text x="357.0" y="38.0" fill="#94a3b8" font-size="10" text-anchor="middle">sin(0.01t)</text>
