  <rect x="40.0" y="150.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="68.0" y="177.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <rect x="96.0" y="150.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="124.0" y="177.0" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <rect x="40.0" y="194.0" width="56.0" height="44.0" rx="0" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
