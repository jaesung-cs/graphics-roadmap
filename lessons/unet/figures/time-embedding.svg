<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>t = 10 의 time embedding −0.84, 0.99, −0.54, 0.10 을 linear 층으로 channel 마다 값 하나로 바꾸고, 2×2 channel 의 값 1, 2, 3, 4 에 0.5 를 더해 1.5, 2.5, 3.5, 4.5 가 되는 모습. 모든 위치가 +0.5 바뀐다</title>
