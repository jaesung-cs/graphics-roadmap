<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Stable Diffusion v1 의 U-Net. 64×64×4 입력이 320, 640, 1280, 1280 channel 로 64, 32, 16, 8 크기를 지나고, 키우는 길에서 되돌아와 64×64×4 noise 를 낸다. 단계마다 skip connection 3 개가 건너간다</title>
