  <text x="570.0" y="80.0" fill="#a78bfa" font-size="12" text-anchor="middle">f(z_t, t) 가 모두 z₀ 를 낸다</text>
  <rect x="20" y="285" width="740" height="60" rx="8" fill="#0e1628" stroke="#1e293b" stroke-width="1.6"/>
  <text x="36.0" y="309.0" fill="#e2e8f0" font-size="12" text-anchor="start">학습: 시각 t+k 의 점을 선생님이 DDIM 한 step(k = 20)으로 t 까지 옮기고, 두 점에서 학생의 f 가 같은 값을 내게 한다</text>
  <text x="36.0" y="331.0" fill="#94a3b8" font-size="12" text-anchor="start">생성: f 로 z₀ 를 맞히고, 다음 시각만큼 새 noise 를 섞어 다시 f 를 쓴다 (4 step 이면 999 → 759 → 499 → 259)</text>
</svg>
