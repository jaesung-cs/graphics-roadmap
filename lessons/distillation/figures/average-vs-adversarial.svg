<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>선생님 model 이 가까운 두 noise 에서 −2 와 +2 를 낼 때, MSE 로 배운 학생은 평균 0 을 내고, 판별기로 배운 학생은 진짜처럼 보이는 한쪽 끝 +2 를 낸다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="380.0" y="30.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">한 step 에 끝을 맞히면: 평균과 판별기</text>
  <line x1="120.0" y1="110.0" x2="640.0" y2="110.0" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120.0" y1="105.0" x2="120.0" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="120.0" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">-3</text>
  <line x1="206.7" y1="105.0" x2="206.7" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="206.7" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">-2</text>
  <line x1="293.3" y1="105.0" x2="293.3" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="293.3" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">-1</text>
  <line x1="380.0" y1="105.0" x2="380.0" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="380.0" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="466.7" y1="105.0" x2="466.7" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="466.7" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">1</text>
  <line x1="553.3" y1="105.0" x2="553.3" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="553.3" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">2</text>
  <line x1="640.0" y1="105.0" x2="640.0" y2="115.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="640.0" y="132.0" fill="#94a3b8" font-size="11" text-anchor="middle">3</text>
  <circle cx="206.7" cy="110.0" r="8" fill="#34d399" fill-opacity="0.9"/>
  <circle cx="553.3" cy="110.0" r="8" fill="#34d399" fill-opacity="0.9"/>
  <text x="106.0" y="114.0" fill="#e2e8f0" font-size="12" text-anchor="end">MSE 로 배운 학생</text>
  <line x1="120.0" y1="230.0" x2="640.0" y2="230.0" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="120.0" y1="225.0" x2="120.0" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="120.0" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">-3</text>
  <line x1="206.7" y1="225.0" x2="206.7" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="206.7" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">-2</text>
  <line x1="293.3" y1="225.0" x2="293.3" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="293.3" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">-1</text>
  <line x1="380.0" y1="225.0" x2="380.0" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="380.0" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="466.7" y1="225.0" x2="466.7" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="466.7" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">1</text>
  <line x1="553.3" y1="225.0" x2="553.3" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="553.3" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">2</text>
  <line x1="640.0" y1="225.0" x2="640.0" y2="235.0" stroke="#94a3b8" stroke-width="1"/>
  <text x="640.0" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">3</text>
  <circle cx="206.7" cy="230.0" r="8" fill="#34d399" fill-opacity="0.9"/>
  <circle cx="553.3" cy="230.0" r="8" fill="#34d399" fill-opacity="0.9"/>
  <text x="106.0" y="234.0" fill="#e2e8f0" font-size="12" text-anchor="end">판별기로 배운 학생</text>
  <text x="206.7" y="82.0" fill="#34d399" font-size="12" text-anchor="middle">선생님이 낸 끝 −2</text>
  <text x="553.3" y="82.0" fill="#34d399" font-size="12" text-anchor="middle">선생님이 낸 끝 +2</text>
  <circle cx="380.0" cy="110.0" r="8" fill="#f87171" fill-opacity="1"/>
  <text x="380.0" y="82.0" fill="#f87171" font-size="12" text-anchor="middle" font-weight="bold">학생의 답 0</text>
  <text x="380.0" y="156.0" fill="#94a3b8" font-size="12" text-anchor="middle">두 끝까지 거리 제곱의 평균: (0 − 2)² 과 (0 + 2)² 의 평균 4 가 가장 작다. 0 은 어느 그림과도 닮지 않은 회색이다</text>
  <circle cx="553.3" cy="230.0" r="8" fill="#f59e0b" fill-opacity="1"/>
  <text x="587.3" y="205.0" fill="#f59e0b" font-size="12" text-anchor="middle" font-weight="bold">학생의 답 +2</text>
  <text x="380.0" y="276.0" fill="#94a3b8" font-size="12" text-anchor="middle">판별기는 0 같은 값이 진짜 그림에 없다는 것을 알아보므로, 학생은 진짜처럼 보이는 한쪽 끝을 고른다</text>
</svg>
