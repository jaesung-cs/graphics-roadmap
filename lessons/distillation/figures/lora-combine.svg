<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SDXL weight θ 에 그림체 LoRA 를 0.8 배, LCM-LoRA 를 1.0 배 더하면 추가 학습 없이 그림체를 따르며 4 step 에 그리는 U-Net 이 된다. LCM-LoRA 는 rank 64, parameter 196,752,148 개다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="390.0" y="30.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">LCM-LoRA 를 다른 LoRA 와 더하기</text>
  <rect x="30" y="70" width="190" height="70" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="125.0" y="97.0" fill="#38bdf8" font-size="14" text-anchor="middle">SDXL weight θ</text>
  <text x="125.0" y="117.0" fill="#94a3b8" font-size="11" text-anchor="middle">U-Net 2,567,463,684 개</text>
  <text x="240.0" y="110.0" fill="#e2e8f0" font-size="22" text-anchor="middle">+</text>
  <rect x="260" y="70" width="210" height="70" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="365.0" y="97.0" fill="#f59e0b" font-size="14" text-anchor="middle">0.8 × 그림체 LoRA τ</text>
  <text x="365.0" y="117.0" fill="#94a3b8" font-size="11" text-anchor="middle">예: 종이 오리기 그림체</text>
  <text x="490.0" y="110.0" fill="#e2e8f0" font-size="22" text-anchor="middle">+</text>
  <rect x="510" y="70" width="240" height="70" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.6"/>
  <text x="630.0" y="97.0" fill="#34d399" font-size="14" text-anchor="middle">1.0 × LCM-LoRA τ_LCM</text>
  <text x="630.0" y="117.0" fill="#94a3b8" font-size="11" text-anchor="middle">rank 64, 196,752,148 개</text>
  <line x1="390.0" y1="140.0" x2="390.0" y2="185.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="230" y="188" width="320" height="56" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="390.0" y="212.0" fill="#a78bfa" font-size="13" text-anchor="middle">그림체를 따르며 4 step 에 그리는 U-Net</text>
  <text x="390.0" y="230.0" fill="#94a3b8" font-size="11" text-anchor="middle">더한 뒤 추가 학습 없음</text>
  <text x="390.0" y="274.0" fill="#94a3b8" font-size="12" text-anchor="middle">LCM-LoRA 파일은 fp16 으로 약 0.39 GB, U-Net 전체는 약 5.13 GB 다</text>
</svg>
