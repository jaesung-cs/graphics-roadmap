<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SDXL-Lightning 은 SDXL 의 128 step 을 MSE 와 CFG 6 으로 32 step 에 담고, 그 뒤 adversarial loss 로 8, 4, 2, 1 step 으로 차례로 줄인다. 판별기는 SDXL U-Net 의 encoder 복사본이다</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="798" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="400.0" y="30.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">SDXL-Lightning 의 단계별 distillation</text>
  <rect x="40.0" y="50.0" width="80.0" height="180.0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1" fill-opacity="0.55"/>
  <text x="80.0" y="42.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">128 step</text>
  <rect x="165.0" y="92.9" width="80.0" height="137.1" fill="#38bdf8" stroke="#38bdf8" stroke-width="1" fill-opacity="0.55"/>
  <text x="205.0" y="84.9" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">32 step</text>
  <line x1="127.0" y1="160.0" x2="159.0" y2="160.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="290.0" y="135.7" width="80.0" height="94.3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.55"/>
  <text x="330.0" y="127.7" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">8 step</text>
  <line x1="252.0" y1="160.0" x2="284.0" y2="160.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="415.0" y="157.1" width="80.0" height="72.9" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.55"/>
  <text x="455.0" y="149.1" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">4 step</text>
  <line x1="377.0" y1="160.0" x2="409.0" y2="160.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="540.0" y="178.6" width="80.0" height="51.4" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.55"/>
  <text x="580.0" y="170.6" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">2 step</text>
  <line x1="502.0" y1="160.0" x2="534.0" y2="160.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="665.0" y="200.0" width="80.0" height="30.0" fill="#f59e0b" stroke="#f59e0b" stroke-width="1" fill-opacity="0.55"/>
  <text x="705.0" y="192.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="bold">1 step</text>
  <line x1="627.0" y1="160.0" x2="659.0" y2="160.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <text x="80.0" y="252.0" fill="#94a3b8" font-size="11" text-anchor="middle">선생님</text>
  <text x="205.0" y="252.0" fill="#38bdf8" font-size="11" text-anchor="middle">MSE, CFG 6</text>
  <text x="205.0" y="268.0" fill="#94a3b8" font-size="10" text-anchor="middle">(이 단계만 CFG)</text>
  <text x="540.0" y="252.0" fill="#f59e0b" font-size="11" text-anchor="middle">adversarial loss (판별기 = SDXL U-Net 의 encoder 복사본, latent 에서)</text>
  <text x="540.0" y="270.0" fill="#94a3b8" font-size="10" text-anchor="middle">단계마다 앞 단계 model 이 선생님, 2·1 step 은 한 단계 앞 선생님도 쓴다</text>
</svg>
