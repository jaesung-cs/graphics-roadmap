<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ADD 의 학습. 진짜 그림에 noise 를 섞은 x_s 를 학생이 한 번에 그림 x̂ 로 바꾸고, 판별기는 x̂ 와 진짜 그림을 가려 adversarial loss 를 주며, x̂ 에 다시 noise 를 섞어 고정된 선생님 SDXL 이 한 step 으로 되돌린 값과의 거리가 distillation loss 다. 전체 loss 는 adversarial + 2.5 × distillation</title>
  <defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="858" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="430.0" y="30.0" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">Adversarial Diffusion Distillation 의 학습</text>
  <rect x="20" y="70" width="130" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="85.0" y="93.0" fill="#38bdf8" font-size="13" text-anchor="middle">진짜 그림 x₀</text>
  <text x="85.0" y="111.0" fill="#94a3b8" font-size="11" text-anchor="middle">dataset</text>
  <line x1="150.0" y1="97.0" x2="185.0" y2="97.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <text x="167.0" y="88.0" fill="#94a3b8" font-size="10" text-anchor="middle">+ noise</text>
  <rect x="188" y="70" width="120" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="248.0" y="93.0" fill="#38bdf8" font-size="13" text-anchor="middle">x_s</text>
  <text x="248.0" y="111.0" fill="#94a3b8" font-size="10" text-anchor="middle">s 는 4 개 가운데 하나</text>
  <line x1="308.0" y1="97.0" x2="343.0" y2="97.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="346" y="62" width="150" height="70" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2.2"/>
  <text x="421.0" y="88.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="bold">학생 (SDXL 로 시작)</text>
  <text x="421.0" y="108.0" fill="#94a3b8" font-size="11" text-anchor="middle">학습한다</text>
  <line x1="496.0" y1="97.0" x2="531.0" y2="97.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-m)"/>
  <rect x="534" y="70" width="120" height="54" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.6"/>
  <text x="594.0" y="93.0" fill="#34d399" font-size="13" text-anchor="middle">학생의 그림 x̂</text>
  <text x="594.0" y="111.0" fill="#94a3b8" font-size="11" text-anchor="middle">network 1 번</text>
  <line x1="654.0" y1="88.0" x2="690.0" y2="70.0" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a-a)"/>
  <rect x="692" y="46" width="150" height="70" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="767.0" y="70.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="bold">판별기</text>
  <text x="767.0" y="88.0" fill="#94a3b8" font-size="10" text-anchor="middle">DINOv2 특징 + 작은 head</text>
  <text x="767.0" y="104.0" fill="#94a3b8" font-size="10" text-anchor="middle">글·진짜 그림을 조건으로</text>
  <text x="767.0" y="136.0" fill="#f59e0b" font-size="11" text-anchor="middle">진짜 그림 x₀ 와 견주어 "진짜 같으냐"</text>
  <text x="767.0" y="154.0" fill="#f59e0b" font-size="11" text-anchor="middle">→ adversarial loss</text>
  <line x1="594.0" y1="124.0" x2="594.0" y2="190.0" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-p)"/>
  <text x="604.0" y="162.0" fill="#a78bfa" font-size="10" text-anchor="start">+ noise (시각 t)</text>
  <rect x="534" y="192" width="120" height="54" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="594.0" y="215.0" fill="#a78bfa" font-size="13" text-anchor="middle">x̂_t</text>
  <text x="594.0" y="233.0" fill="#94a3b8" font-size="10" text-anchor="middle">학생 그림에 noise</text>
  <line x1="534.0" y1="219.0" x2="499.0" y2="219.0" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-p)"/>
  <rect x="346" y="184" width="150" height="70" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="421.0" y="210.0" fill="#a78bfa" font-size="13" text-anchor="middle" font-weight="bold">선생님 (SDXL)</text>
  <text x="421.0" y="230.0" fill="#94a3b8" font-size="11" text-anchor="middle">고정, 한 step 만</text>
  <line x1="346.0" y1="219.0" x2="311.0" y2="219.0" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a-p)"/>
  <rect x="188" y="192" width="120" height="54" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="248.0" y="215.0" fill="#a78bfa" font-size="13" text-anchor="middle">선생님의 x̂₀</text>
  <text x="248.0" y="233.0" fill="#94a3b8" font-size="10" text-anchor="middle">목표 (gradient 없음)</text>
  <text x="248.0" y="274.0" fill="#a78bfa" font-size="11" text-anchor="middle">‖x̂ − 선생님의 x̂₀‖² → distillation loss</text>
  <rect x="20" y="300" width="820" height="80" rx="8" fill="#0e1628" stroke="#1e293b" stroke-width="1.6"/>
  <text x="40.0" y="326.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="bold">전체 loss = adversarial loss + 2.5 × distillation loss</text>
  <text x="40.0" y="348.0" fill="#94a3b8" font-size="12" text-anchor="start">판별기가 흐린 평균을 막고(선명함), 선생님이 글과 구도를 지킨다(SDXL 의 지식). 판별기는 따로 hinge loss 로 학습한다</text>
  <text x="40.0" y="368.0" fill="#94a3b8" font-size="12" text-anchor="start">생성할 때는 학생만 쓴다: 순수 noise → 학생 1 번 → 그림. guidance 도 쓰지 않는다</text>
</svg>
