<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ViT-Base 의 층마다 들어 있는 MLP. 숫자 768 개를 받아 GELU 를 쓰는 unit 3072 개의 hidden layer 를 거쳐 다시 숫자 768 개를 낸다. weight 와 bias 는 모두 4,722,432 개다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="314" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="45.0" y="101.2" width="90.0" height="97.5" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90.0" y="154.0" fill="#38bdf8" font-size="16" text-anchor="middle" font-weight="600">768</text>
  <text x="90.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">입력</text>
  <text x="90.0" y="268.0" fill="#94a3b8" font-size="11" text-anchor="middle">조각 하나의 숫자 768 개</text>
  <rect x="315.0" y="45.0" width="90.0" height="210.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360.0" y="154.0" fill="#f59e0b" font-size="16" text-anchor="middle" font-weight="600">3,072</text>
  <text x="360.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">hidden layer</text>
  <text x="360.0" y="268.0" fill="#94a3b8" font-size="11" text-anchor="middle">unit 3072 개 · GELU</text>
  <rect x="585.0" y="101.2" width="90.0" height="97.5" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="630.0" y="154.0" fill="#34d399" font-size="16" text-anchor="middle" font-weight="600">768</text>
  <text x="630.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">출력</text>
  <text x="630.0" y="268.0" fill="#94a3b8" font-size="11" text-anchor="middle">숫자 768 개</text>
  <line x1="137.0" y1="150.0" x2="311.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225.0" y="138.0" fill="#94a3b8" font-size="11" text-anchor="middle">768 × 3072 + 3072 = 2,362,368</text>
  <line x1="407.0" y1="150.0" x2="581.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495.0" y="138.0" fill="#94a3b8" font-size="11" text-anchor="middle">3072 × 768 + 768 = 2,360,064</text>
  <text x="360.0" y="298.0" fill="#e2e8f0" font-size="12" text-anchor="middle">합 4,722,432 개 · ViT-Base 에 이런 MLP 가 12 개</text>
</svg>
